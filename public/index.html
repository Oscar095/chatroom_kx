<script>
let currentCollection = 'wa_chats';
let currentSession = null;
// La coleccion de la conversacion abierta. En "Archivados" se mezclan los dos
// canales, asi que no siempre coincide con currentCollection.
let currentSessionCol = 'wa_chats';
// 'inbox' (un canal), 'archived' (los dos canales) o 'contacts' (la agenda).
let currentView = 'inbox';
let contactsList = null;
let currentContact = null;
let searchTimeout = null;
// id -> sesion, para que los resultados de busqueda puedan mostrar el nombre
// del contacto (/api/search solo devuelve sessionId).
let sessionsCache = {};
// Sesiones por coleccion. Se cargan las dos aunque solo se vea una, para poder
// encender el punto de pendientes del canal que no estas mirando.
let sessionsByCol = {};
let pendingOnly = false;

/* --- Estado de lectura -------------------------------------------------
   server.js es de solo lectura sobre Atlas (ver CLAUDE.md), asi que lo leido
   vive en el navegador. Por conversacion se guarda { r, p }:
     r = cuantos mensajes estaban leidos
     p = el r anterior, para que "marcar como no leido" pueda devolverse ahi
   No leidos = messageCount - r. Una conversacion que nunca se abrio tiene
   r = 0, o sea que entra como pendiente completa.
   Consecuencia: el estado es por navegador, no se comparte entre equipos.  */
const READS_KEY = 'kx-reads';
let reads = {};
try { reads = JSON.parse(localStorage.getItem(READS_KEY) || '{}') || {}; } catch { reads = {}; }
function saveReads() { try { localStorage.setItem(READS_KEY, JSON.stringify(reads)); } catch {} }

function unreadCount(s) {
    if (!s) return 0;
    const st = reads[s.id];
    return Math.max(0, (s.messageCount || 0) - (st ? st.r : 0));
}

function findSession(id) {
    for (const col of Object.keys(sessionsByCol)) {
        const hit = (sessionsByCol[col] || []).find(s => s.id === id);
        if (hit) return hit;
    }
    return null;
}

// Lo archivado no cuenta como pendiente: ya se cerro con el cliente.
function channelUnread(col) {
    return (sessionsByCol[col] || []).filter(s => !s.archived && unreadCount(s) > 0).length;
}

// Bandeja del canal visible, sin lo archivado.
function inboxOf(col) {
    return (sessionsByCol[col] || []).filter(s => !s.archived);
}

// La carpeta de archivados es una sola para los dos canales, ordenada por
// cuando se archivo cada conversacion.
function archivedAll() {
    return Object.keys(sessionsByCol)
        .flatMap(col => (sessionsByCol[col] || []).filter(s => s.archived))
        .sort((a, b) => new Date(b.archivedAt || 0) - new Date(a.archivedAt || 0));
}

function markRead(s) {
    const st = reads[s.id] || { r: 0, p: 0 };
    if (st.r === s.messageCount) {
        // Ya estaba al dia antes de abrirla: el punto de retorno pasa a ser
        // "sin pendientes". Si no, quedaria el de la primera lectura y marcarla
        // como no leida mostraria la conversacion entera como mensajes nuevos.
        if (st.p !== st.r) { reads[s.id] = { r: st.r, p: st.r }; saveReads(); }
        return;
    }
    reads[s.id] = { r: s.messageCount, p: st.r };
    saveReads();
}

function markUnread(id) {
    const s = findSession(id);
    if (!s) return;
    const st = reads[id] || { r: 0, p: 0 };
    // Vuelve al conteo previo a la ultima apertura: si habian llegado 3
    // mensajes nuevos, quedan esos 3 pendientes otra vez.
    let target = st.p;
    // Si ya estaba al dia antes de abrirla, deja al menos uno pendiente; si no,
    // el boton no cambiaria nada visible.
    if (target >= s.messageCount) target = s.messageCount - 1;
    target = Math.max(0, target);
    reads[id] = { r: target, p: target };
    saveReads();

    if (pendingOnly) renderSessions();
    else { refreshRow(id); updateCounters(); }
    showToast('Marcado como no leído');
}

function markUnreadCurrent() {
    if (currentSession) markUnread(currentSession);
}

function markAllRead() {
    const all = inboxOf(currentCollection);
    let n = 0;
    all.forEach(s => { if (unreadCount(s) > 0) { markRead(s); n++; } });
    if (!n) return;
    renderSessions();
    showToast(n === 1 ? '1 conversación marcada como leída'
                      : n + ' conversaciones marcadas como leídas');
}

function togglePendingFilter() {
    pendingOnly = !pendingOnly;
    document.getElementById('filterChip').classList.toggle('on', pendingOnly);
    const input = document.getElementById('searchInput');
    if (input.value.trim()) input.value = '';   // el filtro reemplaza la busqueda
    renderSessions();
}

// Actualiza el contador de una sola fila, sin repintar la lista (repintar
// perderia el resaltado de la conversacion abierta y relanzaria la animacion).
function refreshRow(id) {
    const row = document.querySelector(`.session-item[data-id="${id}"]`);
    const s = findSession(id);
    if (!row || !s) return;
    const n = unreadCount(s);
    row.classList.toggle('unread', n > 0);
    const badge = row.querySelector('.session-count');
    if (badge) {
        badge.textContent = n;
        badge.style.display = n > 0 ? '' : 'none';
    }
}

function updateCounters() {
    const pend = channelUnread(currentCollection);
    const label = document.getElementById('pendingLabel');
    if (label) {
        if (currentView === 'contacts') {
            const n = (contactsList || []).length;
            label.textContent = n ? n + (n === 1 ? ' contacto' : ' contactos') : '';
        } else if (currentView === 'archived') {
            const n = archivedAll().length;
            label.textContent = n ? n + (n === 1 ? ' archivada' : ' archivadas') : '';
        } else {
            label.textContent = pend ? pend + (pend === 1 ? ' pendiente' : ' pendientes') : '';
        }
    }
    toggleActivity('wa_chats', channelUnread('wa_chats') > 0);
    toggleActivity('wa_chats_web', channelUnread('wa_chats_web') > 0);
    const readAll = document.getElementById('readAllChip');
    if (readAll) readAll.disabled = pend === 0;
    updateTile('wa', 'wa_chats');
    updateTile('web', 'wa_chats_web');
}

// Las tarjetas del pie cuentan PERSONAS sin responder (conversaciones con al
// menos un mensaje sin leer), no mensajes.
function updateTile(key, col) {
    const tile = document.getElementById('tile-' + key);
    const val = document.getElementById('pend-' + key);
    const sub = document.getElementById('pend-' + key + '-sub');
    if (!tile || !val || !sub) return;

    const total = (sessionsByCol[col] || []).length;
    const pending = channelUnread(col);

    val.textContent = pending;
    sub.textContent = pending > 0 ? 'sin responder'
                    : total ? 'todo al día'
                    : 'sin chats';
    tile.classList.toggle('pending', pending > 0);
}

let toastTimer = null;
function showToast(msg) {
    const el = document.getElementById('toast');
    document.getElementById('toastText').textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

async function fetchAPI(endpoint, params = {}) {
    const query = new URLSearchParams(params);
    const res = await fetch('/api/' + endpoint + '?' + query.toString());
    return await res.json();
}

function formatSessionId(id) {
    if (!id) return 'Desconocido';
    if (id.length > 20) return id.substring(0, 8) + '...' + id.substring(id.length - 6);
    return id;
}

function formatPhone(sessionId) {
    if (!sessionId) return '?';
    const digits = sessionId.replace(/\D/g, '');
    if (digits.length >= 10) return '+' + digits;
    return sessionId;
}

function getInitials(name) {
    if (!name) return '?';
    // If it's a name (has letters), use first letters
    const words = String(name).trim().split(/\s+/);
    if (words.length >= 2 && /[a-zA-Z]/.test(words[0])) {
        return (words[0][0] + words[1][0]).toUpperCase();
    }
    if (/[a-zA-Z]/.test(name)) return String(name).charAt(0).toUpperCase();
    // If digits (phone), use last 2
    const digits = String(name).replace(/\D/g, '');
    if (digits.length >= 2) return digits.slice(-2);
    return String(name).charAt(0).toUpperCase();
}

// Compact stamp for the session list: time today, weekday this week, else date.
function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const now = new Date();
    if (d.toDateString() === now.toDateString()) {
        return d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
    }
    if (now - d < 604800000) return d.toLocaleDateString('es-CO', { weekday: 'short' });
    return d.toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: '2-digit' });
}

function formatFullDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString('es-CO', {
        day: 'numeric', month: 'long', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
    });
}

function getDateLabel(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const now = new Date();
    if (d.toDateString() === now.toDateString()) return 'Hoy';
    const yesterday = new Date(now);
    yesterday.setDate(yesterday.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) return 'Ayer';
    return d.toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' });
}

function truncate(text, max) {
    if (!text) return '...';
    return text.length > max ? text.substring(0, max) + '...' : text;
}

// A session can arrive without a sessionId (older records saved before the
// WhatsApp user_id fallback existed). Never render a bare "null".
function sessionLabel(s, isWeb) {
    if (s.name) return s.name;
    if (!s.sessionId) return 'Sin identificar';
    return isWeb ? formatSessionId(s.sessionId) : contactIdentifier(s, isWeb);
}

// What to show as the contact's handle. Meta sends a phone number for most
// contacts, but for the newer user_id identities there is no phone at all —
// only a username. Show whichever exists rather than a fake number.
function contactIdentifier(s, isWeb) {
    if (isWeb) return s.sessionId ? formatSessionId(s.sessionId) : '';
    if (s.username) return '@' + s.username;
    if (!s.sessionId) return '';
    if (/^\d+$/.test(s.sessionId)) return formatPhone(s.sessionId);
    return 'ID: ' + s.sessionId;   // user_id identity, no phone available
}

function toggleActivity(col, on) {
    const btn = document.querySelector(`.rail-btn[data-col="${col}"]`);
    if (btn) btn.classList.toggle('has-activity', !!on);
}

function skeletonList(n = 6) {
    let html = '';
    for (let i = 0; i < n; i++) {
        html += `<div class="sk-item">
            <div class="sk sk-avatar"></div>
            <div><div class="sk sk-line"></div><div class="sk sk-line"></div></div>
        </div>`;
    }
    return html;
}

function sessionCard(s, isWeb, index, opts = {}) {
    const displayName = sessionLabel(s, isWeb);
    const subtitle = s.name ? contactIdentifier(s, isWeb) : '';
    const delay = Math.min(index * 22, 400);
    const unread = unreadCount(s);
    // El contador queda siempre en el DOM aunque este oculto: refreshRow lo
    // muestra u oculta sin tener que repintar la fila entera.
    const badge = opts.badge !== undefined
        ? opts.badge
        : `<div class="session-count new"${unread ? '' : ' style="display:none"'}>${unread}</div>
           <button class="row-action" onclick="event.stopPropagation();markUnread('${s.id}')"
                   title="Marcar como no leído" aria-label="Marcar como no leído">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                   <path d="M2.5 12S6 5.5 12 5.5c1.6 0 3 .5 4.2 1.2M21.5 12s-1.2 2.2-3.3 4"/>
                   <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3.5 3.5l17 17"/>
               </svg>
           </button>`;
    const stamp = opts.hideDate ? '' :
        `<div class="session-date" title="${escapeAttr(formatFullDate(s.lastSeen || s.startedAt))}">${formatDate(s.lastSeen || s.startedAt)}</div>`;
    // El chip de Manual avisa desde la lista que el bot está en pausa ahí, sin
    // tener que abrir la conversación para darse cuenta.
    const manual = s.mode === 'manual' ? '<span class="row-chip manual">Manual</span> ' : '';
    const preview = opts.preview !== undefined
        ? opts.preview
        : `${manual}${s.lastType === 'ai' ? '<b>Bot:</b> ' : ''}${escapeHtml(truncate(s.lastMessage, 42))}`;

    return `
    <div class="session-item ${unread ? 'unread' : ''}" data-id="${s.id}" style="animation-delay:${delay}ms" onclick="openSession('${s.id}')">
        <div class="session-avatar ${isWeb ? 'web' : ''}">${escapeHtml(getInitials(s.name || s.sessionId))}</div>
        <div class="session-info">
            <div class="session-name">${escapeHtml(displayName)}</div>
            ${subtitle ? `<div class="session-contact">${escapeHtml(subtitle)}</div>` : ''}
            <div class="session-preview">${preview}</div>
        </div>
        <div class="session-meta">${stamp}${badge}</div>
    </div>`;
}

// Trae las dos colecciones y pinta la actual. Hacen falta ambas para contar
// los pendientes del canal que no esta a la vista.
async function loadSessions() {
    const list = document.getElementById('sessionsList');
    list.innerHTML = skeletonList();

    try {
        const [wa, web] = await Promise.all([
            fetchAPI('sessions', { collection: 'wa_chats' }),
            fetchAPI('sessions', { collection: 'wa_chats_web' })
        ]);
        // Si Mongo falla, /api/sessions responde {error} con status 500. Ese
        // objeto es "truthy", asi que sin esta comprobacion entraria como si
        // fuera la lista y reventaria despues en .filter/.length.
        if (!Array.isArray(wa) || !Array.isArray(web)) {
            throw new Error((wa && wa.error) || (web && web.error) || 'respuesta inesperada del servidor');
        }
        sessionsByCol = { wa_chats: wa, wa_chats_web: web };
        renderCurrentView();
    } catch (err) {
        list.innerHTML = '<div class="loading"><p>Error: ' + escapeHtml(err.message) + '</p></div>';
    }
}

function renderSessions(opts = {}) {
    const list = document.getElementById('sessionsList');
    const all = inboxOf(currentCollection);

    // El cache alimenta los resultados de busqueda, que tambien pueden caer
    // sobre conversaciones archivadas: se indexan todas, no solo la bandeja.
    sessionsCache = {};
    Object.keys(sessionsByCol).forEach(col =>
        (sessionsByCol[col] || []).forEach(s => { sessionsCache[s.id] = s; }));
    updateCounters();
    // quiet = viene del refresco automatico, no de una accion del usuario.
    list.classList.toggle('no-anim', !!opts.quiet);

    if (!all.length) {
        list.innerHTML = '<div class="loading"><p>No hay conversaciones en este canal</p></div>';
        return;
    }

    const shown = pendingOnly ? all.filter(s => unreadCount(s) > 0) : all;
    if (!shown.length) {
        list.innerHTML = '<div class="loading"><p>Nada pendiente en este canal.<br>Todo al día.</p></div>';
        return;
    }

    const isWeb = currentCollection === 'wa_chats_web';
    list.innerHTML = shown.map((s, i) => sessionCard(s, isWeb, i)).join('');

    // Conservar el resaltado de la conversacion abierta tras un repintado.
    if (currentSession) {
        const row = list.querySelector(`.session-item[data-id="${currentSession}"]`);
        if (row) row.classList.add('active');
    }
}

/* ======================================================================
   ARCHIVADOS
   Archivar no mueve ni borra el chat: escribe `archivedAt` en el documento.
   Tiene que ser asi porque el nodo de memoria de n8n sigue escribiendo
   mensajes en ese mismo documento; moverlo le borraria al bot el historial
   del cliente. Si el cliente vuelve a escribir, el servidor lo devuelve solo
   a la bandeja, porque entonces la conversacion no habia terminado.
   ====================================================================== */
const ICON_ARCHIVE = '<rect x="2.5" y="3.5" width="19" height="5" rx="1.6"/>' +
    '<path d="M4.5 8.5v10a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-10"/><path d="M9.8 12.5h4.4"/>';
const ICON_RESTORE = '<path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 3.5V9H9"/>';

function renderArchived(opts = {}) {
    const list = document.getElementById('sessionsList');
    const all = archivedAll();

    sessionsCache = {};
    Object.keys(sessionsByCol).forEach(col =>
        (sessionsByCol[col] || []).forEach(s => { sessionsCache[s.id] = s; }));
    updateCounters();
    list.classList.toggle('no-anim', !!opts.quiet);

    if (!all.length) {
        list.innerHTML = '<div class="loading"><p>Todavía no has archivado ninguna conversación.<br>' +
            'Abre un chat y usa el botón de archivar.</p></div>';
        return;
    }

    const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    const shown = !q ? all : all.filter(s =>
        [s.name, s.sessionId, s.lastMessage].some(v => v && String(v).toLowerCase().includes(q)));

    if (!shown.length) {
        list.innerHTML = '<div class="loading"><p>Nada archivado coincide con “' + escapeHtml(q) + '”</p></div>';
        return;
    }

    list.innerHTML = shown.map((s, i) => {
        const isWeb = s.collection === 'wa_chats_web';
        return sessionCard(s, isWeb, i, {
            badge: `<span class="row-chip ${isWeb ? 'web' : 'wa'}">${isWeb ? 'Web' : 'WA'}</span>
                <button class="row-action always" onclick="event.stopPropagation();toggleArchive('${s.id}', false)"
                        title="Devolver a la bandeja" aria-label="Devolver a la bandeja">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">${ICON_RESTORE}</svg>
                </button>`
        });
    }).join('');

    if (currentSession) {
        const row = list.querySelector(`.session-item[data-id="${currentSession}"]`);
        if (row) row.classList.add('active');
    }
}

async function toggleArchive(id, archivar) {
    const s = findSession(id);
    const col = (s && s.collection) || currentSessionCol;
    try {
        const res = await fetch('/api/archive', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ collection: col, id, archived: archivar })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'el servidor respondió ' + res.status);

        if (s) {
            s.archived = archivar;
            s.archivedAt = archivar ? new Date().toISOString() : null;
            s.reopened = false;
        }
        // La conversacion abierta desaparece de la vista actual: se cierra.
        if (currentSession === id &&
            ((currentView === 'inbox' && archivar) || (currentView === 'archived' && !archivar))) {
            currentSession = null;
            closeDetail();
        } else if (currentSession === id) {
            updateArchiveBtn(archivar);
        }
        // El chat cambio de estado: la agenda tendra que releerse.
        contactsList = null;
        renderCurrentView();
        showToast(archivar ? 'Conversación archivada' : 'Devuelta a la bandeja');
    } catch (err) {
        showToast('No se pudo archivar: ' + err.message);
    }
}

function toggleArchiveCurrent() {
    if (!currentSession) return;
    const s = findSession(currentSession);
    toggleArchive(currentSession, !(s && s.archived));
}

function updateArchiveBtn(archivada) {
    const btn = document.getElementById('archiveBtn');
    const icon = document.getElementById('archiveIcon');
    if (!btn || !icon) return;
    btn.title = archivada ? 'Devolver a la bandeja' : 'Archivar conversación';
    btn.setAttribute('aria-label', btn.title);
    icon.innerHTML = archivada ? ICON_RESTORE : ICON_ARCHIVE;
}

/* ======================================================================
   INTERVENCION DEL ASESOR
   En Manual, el nodo "¿Modo Manual?" del workflow corta el paso al bot: el
   cliente deja de recibir respuestas automaticas y sus mensajes se siguen
   guardando en la memoria, para que al volver a Automatico el bot tenga el
   hilo completo. Solo aplica a WhatsApp: el widget web es peticion/respuesta
   y, si el bot no contesta, el visitante se queda esperando.
   ====================================================================== */
let currentMode = 'auto';
let currentPhone = null;

// WhatsApp Web solo sirve si conocemos un numero real. Las identidades nuevas
// de Meta (CO.1586524026432871) no traen telefono: ahi no hay a quien escribir.
function resolvePhone(data) {
    const d = String(data.phoneNumber || data.sessionId || '').replace(/\D/g, '');
    if (/^57\d{10}$/.test(d)) return d;
    if (/^3\d{9}$/.test(d)) return '57' + d;
    return null;
}

function paintMode() {
    const isWeb = currentSessionCol === 'wa_chats_web';
    document.getElementById('chatArea')
        .classList.toggle('manual', currentMode === 'manual' && !isWeb);
    document.getElementById('modeSwitch').querySelectorAll('button')
        .forEach(b => b.classList.toggle('on', b.dataset.mode === currentMode));
    document.getElementById('composerHint').textContent = currentMode === 'manual'
        ? 'El bot está en pausa para este cliente. Lo que escribas aquí le llega por WhatsApp.'
        : '';
}

function updateChatControls(data) {
    const isWeb = currentSessionCol === 'wa_chats_web';
    currentMode = data.mode === 'manual' ? 'manual' : 'auto';
    currentPhone = resolvePhone(data);

    // El chat web no admite ni modo manual ni escribirle: se ocultan.
    document.getElementById('modeSwitch').style.display = isWeb ? 'none' : '';

    const wa = document.getElementById('waWebBtn');
    if (currentPhone && !isWeb) {
        wa.style.display = '';
        wa.href = 'https://web.whatsapp.com/send?phone=' + currentPhone;
        wa.title = 'Escribir a +' + currentPhone + ' en WhatsApp Web';
    } else {
        wa.style.display = 'none';
    }

    paintMode();
}

async function setMode(mode) {
    if (!currentSession || mode === currentMode) return;
    try {
        const r = await fetch('/api/mode', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ collection: currentSessionCol, id: currentSession, mode })
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'el servidor respondió ' + r.status);

        currentMode = mode;
        const s = findSession(currentSession);
        if (s) s.mode = mode;
        paintMode();
        renderCurrentView();
        if (mode === 'manual') document.getElementById('composerText').focus();
        showToast(mode === 'manual'
            ? 'Bot en pausa: la conversación es tuya'
            : 'El bot vuelve a responder');
    } catch (err) {
        showToast('No se pudo cambiar el modo: ' + err.message);
    }
}

function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function composerKey(e) {
    // Enter envía, Shift+Enter salta de línea (como WhatsApp).
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

async function sendMessage() {
    const box = document.getElementById('composerText');
    const btn = document.getElementById('sendBtn');
    const texto = box.value.trim();
    if (!texto || !currentSession || btn.disabled) return;

    btn.disabled = true;
    try {
        const r = await fetch('/api/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ collection: currentSessionCol, id: currentSession, text: texto })
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'el servidor respondió ' + r.status);

        box.value = '';
        autoGrow(box);
        // Se recarga la conversación para ver el mensaje ya guardado, en vez de
        // pintarlo a mano y arriesgarse a mostrar algo que no quedó en la base.
        await openSession(currentSession, currentSessionCol);
        box.focus();
    } catch (err) {
        showToast('No se envió: ' + err.message);
    } finally {
        btn.disabled = false;
    }
}

/* ======================================================================
   PEDIDOS
   Vienen de la API de Siesa y viven en SQL Server, no en Mongo. El asesor
   solo puede tocar dos columnas: el numero de guia y el despacho. La
   sincronizacion nunca las pisa (ver el MERGE en pedidos.js).
   ====================================================================== */
let pedidosList = null;
let pedidosVerTodos = false;

function fechaCorta(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return '—';
    return d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: '2-digit' });
}

// Un pedido sin despachar cuya fecha de entrega ya paso necesita atencion.
function entregaVencida(p) {
    if (p.despachado || !p.fechaEntrega) return false;
    const d = new Date(p.fechaEntrega);
    return !isNaN(d) && d < new Date(new Date().toDateString());
}

async function renderPedidos(opts = {}) {
    const panel = document.getElementById('pedidosPanel');

    if (!pedidosList) {
        panel.innerHTML = '<div class="ped-vacio"><div class="spinner"></div><p>Cargando pedidos…</p></div>';
        try {
            const d = await fetchAPI('pedidos', pedidosVerTodos ? { todos: '1' } : {});
            if (!Array.isArray(d)) throw new Error((d && d.error) || 'respuesta inesperada del servidor');
            pedidosList = d;
        } catch (err) {
            panel.innerHTML = `<div class="ped-vacio"><p>No se pudieron cargar los pedidos.<br>
                <b>${escapeHtml(err.message)}</b></p></div>`;
            return;
        }
        if (currentView !== 'pedidos') return;   // cambiaron de vista mientras cargaba
    }

    const sinDespachar = pedidosList.filter(p => !p.despachado).length;
    const ultima = pedidosList.reduce((a, p) =>
        p.sincronizadoEn && (!a || new Date(p.sincronizadoEn) > new Date(a)) ? p.sincronizadoEn : a, null);

    const filas = pedidosList.map(p => `
        <tr class="${p.despachado ? 'despachado' : ''}" data-ped="${escapeAttr(p.id)}">
            <td class="ped-doc">${escapeHtml(p.idTipoDocto)}-${p.consecDocto}</td>
            <td class="ped-cliente">${escapeHtml(p.nombreCliente || '—')}</td>
            <td class="ped-fecha">${escapeHtml(fechaCorta(p.fechaRegistro))}</td>
            <td class="ped-fecha ${entregaVencida(p) ? 'vencida' : ''}">${escapeHtml(fechaCorta(p.fechaEntrega))}</td>
            <td>
                <input class="ped-guia" type="text" maxlength="100" placeholder="—"
                       value="${escapeAttr(p.noGuia || '')}"
                       onchange="guardarGuia('${escapeAttr(p.id)}', this)"
                       onkeydown="if(event.key==='Enter')this.blur()">
            </td>
            <td>
                <label class="ped-check">
                    <input type="checkbox" ${p.despachado ? 'checked' : ''}
                           onchange="marcarDespacho('${escapeAttr(p.id)}', this)">
                    <span class="caja">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"
                             stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
                    </span>
                    <span class="txt">${p.despachado ? 'Despachado' : 'Pendiente'}</span>
                </label>
            </td>
        </tr>`).join('');

    panel.innerHTML = `
        <div class="ped-head">
            <div>
                <h2>Pedidos</h2>
                <div class="sub">
                    ${pedidosList.length} ${pedidosList.length === 1 ? 'pedido' : 'pedidos'} ·
                    ${sinDespachar} sin despachar
                    ${ultima ? ' · última sincronización ' + escapeHtml(formatFullDate(ultima)) : ''}
                </div>
            </div>
            <div class="ped-actions">
                <button class="btn" onclick="alternarVerTodos()">
                    ${pedidosVerTodos ? 'Ver solo pendientes' : 'Ver todos'}
                </button>
                <button class="btn primary" id="btnSyncPedidos" onclick="sincronizarPedidos()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5V9H15"/>
                    </svg>
                    Sincronizar con Siesa
                </button>
            </div>
        </div>

        <div class="ped-wrap">
            ${!pedidosList.length ? '<div class="ped-vacio"><p>No hay pedidos.<br>Usa «Sincronizar con Siesa» para traerlos.</p></div>' : `
            <div class="ped-scroll">
                <table class="ped">
                    <thead>
                        <tr>
                            <th>Documento</th><th>Cliente</th><th>Registro</th>
                            <th>Entrega</th><th>No. guía</th><th>Despacho</th>
                        </tr>
                    </thead>
                    <tbody>${filas}</tbody>
                </table>
            </div>`}
        </div>`;
}

function alternarVerTodos() {
    pedidosVerTodos = !pedidosVerTodos;
    pedidosList = null;
    renderPedidos();
}

async function sincronizarPedidos() {
    const btn = document.getElementById('btnSyncPedidos');
    if (btn) { btn.disabled = true; btn.classList.add('spinning'); }
    try {
        const r = await fetch('/api/pedidos/sincronizar', { method: 'POST' });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'el servidor respondió ' + r.status);

        pedidosList = null;
        await renderPedidos();
        showToast(`${d.recibidos} pedidos de Siesa · ${d.nuevos} nuevos` +
                  (d.cerrados ? ` · ${d.cerrados} ya no pendientes` : ''));
    } catch (err) {
        showToast('No se pudo sincronizar: ' + err.message);
        if (btn) { btn.disabled = false; btn.classList.remove('spinning'); }
    }
}

function partirId(id) {
    // El id es "TIPO-CONSEC" y el tipo puede traer guiones, así que se parte
    // por el ÚLTIMO separador.
    const i = id.lastIndexOf('-');
    return { idTipoDocto: id.slice(0, i), consecDocto: Number(id.slice(i + 1)) };
}

async function actualizarPedido(id, cambio) {
    const r = await fetch('/api/pedidos/actualizar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...partirId(id), ...cambio })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'el servidor respondió ' + r.status);
}

async function marcarDespacho(id, el) {
    const valor = el.checked;
    el.disabled = true;
    try {
        await actualizarPedido(id, { despachado: valor });
        const p = (pedidosList || []).find(x => x.id === id);
        if (p) p.despachado = valor;

        // Se repinta solo la fila para no perder el scroll de la tabla.
        const fila = document.querySelector(`tr[data-ped="${CSS.escape(id)}"]`);
        if (fila) {
            fila.classList.toggle('despachado', valor);
            const txt = fila.querySelector('.ped-check .txt');
            if (txt) txt.textContent = valor ? 'Despachado' : 'Pendiente';
            const entrega = fila.querySelector('td.ped-fecha:nth-child(4)');
            if (entrega && p) entrega.classList.toggle('vencida', entregaVencida(p));
        }
        showToast(valor ? 'Pedido marcado como despachado' : 'Pedido devuelto a pendiente');
    } catch (err) {
        el.checked = !valor;   // revertir: no quedó guardado
        showToast('No se pudo guardar: ' + err.message);
    } finally {
        el.disabled = false;
    }
}

async function guardarGuia(id, el) {
    const valor = el.value.trim();
    const p = (pedidosList || []).find(x => x.id === id);
    if (p && (p.noGuia || '') === valor) return;   // no cambió nada
    try {
        await actualizarPedido(id, { noGuia: valor || null });
        if (p) p.noGuia = valor || null;
        el.classList.add('guardado');
        setTimeout(() => el.classList.remove('guardado'), 1200);
    } catch (err) {
        if (p) el.value = p.noGuia || '';   // devolver a lo último guardado
        showToast('No se pudo guardar la guía: ' + err.message);
    }
}

/* ======================================================================
   AGENDA DE CONTACTOS
   ====================================================================== */
async function loadContactsAgenda() {
    const data = await fetchAPI('contacts/list');
    if (!Array.isArray(data)) {
        throw new Error((data && data.error) || 'respuesta inesperada del servidor');
    }
    contactsList = data;
    return data;
}

function contactChannelLabel(c) {
    if (c.channel === 'web') return 'Chat Web';
    if (c.channel === 'whatsapp') return 'WhatsApp';
    return 'Sin canal registrado';
}

/* --- Filtro por canal de la agenda -------------------------------------
   `channel` lo deduce el servidor de la coleccion donde esta la conversacion
   cuando el registro es viejo y no lo trae (ver /api/contacts/list). Aun asi
   puede quedar en null: un contacto sin conversacion asociada. Esos solo
   aparecen bajo "Todos" y bajo su propio chip, que se muestra unicamente si
   existe alguno.                                                          */
let contactChannel = 'all';   // 'all' | 'whatsapp' | 'web' | 'none'

function contactsByChannel(ch) {
    if (!contactsList) return [];
    if (ch === 'all') return contactsList;
    if (ch === 'none') return contactsList.filter(c => !c.channel);
    return contactsList.filter(c => c.channel === ch);
}

function setContactChannel(el) {
    contactChannel = el.dataset.ch;
    document.querySelectorAll('#contactFilterBar .chip')
        .forEach(c => c.classList.toggle('on', c === el));
    renderContacts();
}

function updateContactFilterCounts() {
    const set = (id, n) => { const e = document.getElementById(id); if (e) e.textContent = n; };
    set('chn-all', contactsList ? contactsList.length : 0);
    set('chn-whatsapp', contactsByChannel('whatsapp').length);
    set('chn-web', contactsByChannel('web').length);

    // El chip de "sin canal" solo estorba si no hay ninguno.
    const sin = contactsByChannel('none').length;
    set('chn-none', sin);
    const btn = document.querySelector('#contactFilterBar .chip[data-ch="none"]');
    if (btn) btn.style.display = sin ? '' : 'none';
    // Si el filtro activo se queda sin registros tras un refresco, volver a
    // "Todos" en vez de dejar la agenda en blanco sin explicacion.
    if (!sin && contactChannel === 'none') resetContactChannel();
}

function resetContactChannel() {
    contactChannel = 'all';
    document.querySelectorAll('#contactFilterBar .chip')
        .forEach(c => c.classList.toggle('on', c.dataset.ch === 'all'));
}

// Lo mas util que se pueda mostrar bajo el nombre, en orden de preferencia.
function contactSubtitle(c) {
    if (c.phoneNumber) return '+' + c.phoneNumber;
    if (c.email) return c.email;
    if (c.username) return '@' + c.username;
    return formatSessionId(c.phone);
}

async function renderContacts(opts = {}) {
    const list = document.getElementById('sessionsList');

    if (!contactsList) {
        list.innerHTML = skeletonList();
        try {
            await loadContactsAgenda();
        } catch (err) {
            list.innerHTML = '<div class="loading"><p>Error: ' + escapeHtml(err.message) + '</p></div>';
            return;
        }
        // Pudieron cambiar de vista mientras cargaba.
        if (currentView !== 'contacts') return;
    }

    updateCounters();
    list.classList.toggle('no-anim', !!opts.quiet);

    if (!contactsList.length) {
        list.innerHTML = '<div class="loading"><p>Todavía no hay contactos.<br>' +
            'Se registran solos cuando un cliente escribe.</p></div>';
        return;
    }

    updateContactFilterCounts();

    // Primero el canal, luego la busqueda: asi el texto busca dentro de lo que
    // el filtro dejo a la vista, que es lo que el usuario esta viendo.
    const base = contactsByChannel(contactChannel);
    const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    const shown = !q ? base : base.filter(c =>
        [c.name, c.email, c.phoneNumber, c.username, c.phone]
            .some(v => v && String(v).toLowerCase().includes(q)));

    if (!shown.length) {
        const donde = contactChannel === 'whatsapp' ? ' de WhatsApp'
                    : contactChannel === 'web' ? ' del chat web'
                    : contactChannel === 'none' ? ' sin canal'
                    : '';
        list.innerHTML = '<div class="loading"><p>' + (q
            ? 'Ningún contacto' + donde + ' coincide con “' + escapeHtml(q) + '”'
            : 'No hay contactos' + donde + '.') + '</p></div>';
        return;
    }

    list.innerHTML = shown.map((c, i) => {
        const isWeb = c.channel === 'web';
        // Sin canal conocido no se puede afirmar que sea WhatsApp.
        const [chipCls, chipTxt] = isWeb ? ['web', 'Web']
                                 : c.channel === 'whatsapp' ? ['wa', 'WA']
                                 : ['none', '—'];
        const extras = [];
        if (c.chat) extras.push(c.chat.messageCount + ' mensajes');
        if (c.mediaCount) extras.push(c.mediaCount + (c.mediaCount === 1 ? ' archivo' : ' archivos'));
        return `
        <div class="session-item ${currentContact === c.id ? 'active' : ''}" data-contact="${c.id}"
             style="animation-delay:${Math.min(i * 22, 400)}ms" onclick="openContact('${c.id}')">
            <div class="session-avatar ${isWeb ? 'web' : ''}">${escapeHtml(getInitials(c.name || c.phoneNumber || c.phone))}</div>
            <div class="session-info">
                <div class="session-name">${escapeHtml(c.name || 'Sin nombre')}</div>
                <div class="session-contact">${escapeHtml(contactSubtitle(c))}</div>
                <div class="session-preview">${escapeHtml(extras.join('  ·  ') || 'Sin conversación')}</div>
            </div>
            <div class="session-meta">
                <div class="session-date">${formatDate(c.lastSeen || c.createdAt)}</div>
                <span class="row-chip ${chipCls}" title="${escapeAttr(contactChannelLabel(c))}">${chipTxt}</span>
            </div>
        </div>`;
    }).join('');
}

                <h2>${escapeHtml(c.name || 'Sin nombre')}</h2>

            ${campo('Nombre', c.name ? escapeHtml(c.name) : '')}

// Abre la conversacion del contacto, saltando a la vista donde de verdad esta.
function openContactChat(chatId, col) {
    const s = findSession(chatId);
    const btn = s && s.archived
        ? document.querySelector('.rail-btn[data-view="archived"]')
        : document.querySelector(`.rail-btn[data-col="${col}"]`);
    if (btn) (s && s.archived ? switchView : switchTab)(btn);
    openSession(chatId, col);
}

async function openSession(docId, colOverride) {
    const known = findSession(docId);
    const col = colOverride || (known && known.collection) || currentCollection;
    currentSession = docId;
    currentSessionCol = col;
    currentContact = null;

    document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
    const active = document.querySelector(`.session-item[data-id="${docId}"]`);
    if (active) active.classList.add('active');

    const area = document.getElementById('chatArea');
    area.classList.remove('has-contact');
    area.classList.add('has-chat');
    document.body.classList.add('viewing-chat');

    const isWeb = col === 'wa_chats_web';
    const thread = document.getElementById('thread');
    thread.innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando conversación…</p></div>';
    document.getElementById('jumpBtn').classList.remove('show');

    try {
        const data = await fetchAPI('messages', { collection: col, id: docId });
        const messages = data.messages || [];
        updateArchiveBtn(!!data.archivedAt);
        updateChatControls(data);
        const contactName = data.name;
        const sessionId = data.sessionId;
        const info = { name: contactName, sessionId, username: data.username };
        const displayName = sessionLabel(info, isWeb);
        const handle = contactIdentifier(info, isWeb);

        const avatar = document.getElementById('chatAvatar');
        avatar.textContent = getInitials(contactName || sessionId);
        avatar.className = 'session-avatar' + (isWeb ? ' web' : '');
        document.getElementById('chatName').textContent = displayName;

        const chips = [];
        if (handle && handle !== displayName) chips.push(['accent', handle]);
        if (data.phoneNumber && data.phoneNumber !== handle) chips.push(['', 'Tel ' + data.phoneNumber]);
        if (data.email) chips.push(['', data.email]);
        chips.push(['', messages.length + ' mensajes']);
        if (data.startedAt) chips.push(['', 'Inicio ' + formatFullDate(data.startedAt)]);
        if (data.lastSeen) chips.push(['', 'Último ' + formatFullDate(data.lastSeen)]);
        document.getElementById('chatInfo').innerHTML = chips
            .map(([cls, text]) => `<span class="meta-chip ${cls}">${escapeHtml(text)}</span>`)
            .join('');

        const userLabel = contactName || (isWeb ? 'Visitante' : (handle || 'Cliente'));
        const media = data.media || [];
        let mediaIdx = 0;

        let html = '';
        if (data.startedAt) {
            html += `<div class="date-sep"><span>${escapeHtml(getDateLabel(data.startedAt))}</span></div>`;
        }
        messages.forEach((m, i) => {
            const type = m.type || 'human';
            // Bot y asesor se guardan los dos como 'ai'; sentBy los separa.
            const esAsesor = m.sentBy === 'asesor';
            const label = type === 'ai' ? (esAsesor ? 'Asesor' : 'Bot KosXpress') : userLabel;
            let body;
            if (type === 'human' && IMG_MARKER.test(m.content)) {
                // Every stored file produces exactly one marker message, so the
                // Nth marker is the Nth file. The chat memory has no timestamps,
                // so this ordering is the only link between the two collections.
                body = renderMedia(media[mediaIdx++], m.content.replace(IMG_MARKER, ''));
            } else {
                body = formatMarkdown(m.content);
            }
            html += `
                <div class="msg ${type}${esAsesor ? ' asesor' : ''}" style="animation-delay:${Math.min(i * 26, 460)}ms">
                    <div class="msg-who">${escapeHtml(label)}</div>
                    <div class="msg-card">${body}</div>
                </div>`;
        });

        // Files with no marker: images received before the bot logged them, or
        // a marker that got filtered out of the transcript.
        if (mediaIdx < media.length) {
            html += `<div class="date-sep"><span>Archivos sin ubicar</span></div>`;
            media.slice(mediaIdx).forEach(file => {
                html += `
                    <div class="msg human">
                        <div class="msg-who">${escapeHtml(userLabel)}</div>
                        <div class="msg-card">${renderMedia(file, '')}</div>
                    </div>`;
            });
        }

        thread.innerHTML = html;
        const scroller = document.getElementById('chatScroll');
        scroller.scrollTop = scroller.scrollHeight;   // abre en lo mas reciente
        updateJumpBtn();

        // Leida. Se usa el conteo que acaba de devolver /api/messages, que es
        // el mismo filterMessages() de /api/sessions, y se refresca el cache
        // por si llegaron mensajes despues de cargar la lista.
        const cached = findSession(docId);
        if (cached) cached.messageCount = messages.length;
        markRead(cached || { id: docId, messageCount: messages.length });
        refreshRow(docId);
        updateCounters();
    } catch (err) {
        thread.innerHTML = '<div class="loading"><p>Error: ' + escapeHtml(err.message) + '</p></div>';
    }
}

function closeSession() {
    document.body.classList.remove('viewing-chat');
}

/* --- Volver a lo mas reciente ----------------------------------------- */
// Umbral en px: por debajo de esto se considera que ya estas en el final y el
// boton estorba.
const JUMP_THRESHOLD = 280;

function updateJumpBtn() {
    const sc = document.getElementById('chatScroll');
    const btn = document.getElementById('jumpBtn');
    if (!sc || !btn) return;
    const desdeElFinal = sc.scrollHeight - sc.scrollTop - sc.clientHeight;
    btn.classList.toggle('show', desdeElFinal > JUMP_THRESHOLD);
}

function scrollToLatest() {
    const sc = document.getElementById('chatScroll');
    if (sc) sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' });
}

function escapeHtml(text) {
    if (text === null || text === undefined || text === '') return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function escapeAttr(text) {
    return (text || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Resalta el termino buscado sobre texto ya escapado.
function highlight(text, q) {
    const safe = escapeHtml(truncate(text, 60));
    if (!q || !q.trim()) return safe;
    const needle = escapeHtml(q.trim()).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    try {
        return safe.replace(new RegExp(needle, 'gi'), m => `<mark>${m}</mark>`);
    } catch { return safe; }
}

// Written by "Parsear Imagen" in the n8n workflow. Changing the prefix there
// without changing it here silently turns the images back into plain text.
const IMG_MARKER = /^\[El cliente envió una imagen\]\s*/;

function formatBytes(n) {
    if (!n) return '';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function renderMedia(file, caption) {
    if (!file) {
        return `<span class="media-missing">Imagen no disponible</span>${
            caption ? '<br>' + formatMarkdown(caption) : ''}`;
    }
    const url = '/api/media/' + file.id;
    const cap = caption || file.caption || '';
    const meta = [formatBytes(file.sizeBytes), formatFullDate(file.receivedAt)]
        .filter(Boolean).join('  ·  ');
    const preview = (file.mimeType || '').startsWith('image/')
        ? `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${
            escapeAttr(cap || 'Arte enviado por el cliente')}" loading="lazy"></a>`
        : `<span class="media-missing">${escapeHtml(file.fileName || file.mimeType)}</span>`;

    return `
        <div class="msg-media">
            ${preview}
            <div class="media-bar">
                <span class="media-meta">${escapeHtml(meta)}</span>
                <a class="media-dl" href="${url}?download=1" download>Descargar</a>
            </div>
        </div>
        ${cap ? `<div class="msg-text">${formatMarkdown(cap)}</div>` : ''}
    `;
}

function formatMarkdown(text) {
    if (!text) return '';
    let html = escapeHtml(text);
    // Bold: **text**
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic: *text* (but not inside bold)
    html = html.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
    // Markdown tables. Las filas se acumulan aparte y se emiten como UN solo
    // bloque sin saltos de linea: si quedan "\n" entre <tr>, el paso final los
    // vuelve <br> dentro de la <table>, el navegador los expulsa fuera de ella
    // (foster parenting) y aparecen lineas en blanco sobre cada tabla.
    const lines = html.split('\n');
    let rows = null;
    const result = [];
    const closeTable = () => {
        if (!rows) return;
        // El wrapper .tbl le da su propio scroll horizontal a la tabla,
        // para que los catalogos anchos no desborden la conversacion.
        result.push('<div class="tbl"><table>' + rows.join('') + '</table></div>');
        rows = null;
    };
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith('|') && line.endsWith('|')) {
            // Skip separator rows (|---|---|)
            if (/^\|[\s\-:|]+\|$/.test(line)) continue;
            const cells = line.split('|').filter((_, idx, arr) => idx > 0 && idx < arr.length - 1).map(c => c.trim());
            if (!rows) {
                rows = ['<tr>' + cells.map(c => '<th>' + c + '</th>').join('') + '</tr>'];
            } else {
                rows.push('<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>');
            }
        } else {
            closeTable();
            result.push(line);
        }
    }
    closeTable();
    html = result.join('\n');
    // Line breaks
    html = html.replace(/\n/g, '<br>');
    // La tabla ya trae su propio margen; los <br> pegados a ella solo duplican
    // el espacio en blanco.
    html = html.replace(/(?:<br>\s*)+<div class="tbl">/g, '<div class="tbl">')
               .replace(/<\/table><\/div>(?:\s*<br>)+/g, '</table></div>');
    return html;
}

function setRailActive(el) {
    document.querySelectorAll('.rail-btn[data-col], .rail-btn[data-view]')
        .forEach(b => b.classList.remove('active'));
    el.classList.add('active');
}

function closeDetail() {
    const area = document.getElementById('chatArea');
    area.classList.remove('has-chat', 'has-contact', 'has-pedidos', 'manual');
    document.body.classList.remove('viewing-chat');
    currentMode = 'auto';
    currentPhone = null;
}

// Pinta el panel izquierdo segun la seccion elegida en el rail.
function renderCurrentView(opts = {}) {
    const search = document.getElementById('searchInput');
    const filterBar = document.getElementById('filterBar');
    const label = document.getElementById('channelLabel');

    // "Solo pendientes" y "marcar leidas" solo tienen sentido en la bandeja;
    // el filtro de canal, solo en la agenda.
    if (filterBar) filterBar.style.display = currentView === 'inbox' ? '' : 'none';
    const contactBar = document.getElementById('contactFilterBar');
    if (contactBar) contactBar.style.display = currentView === 'contacts' ? '' : 'none';

    // Pedidos es una tabla ancha: ocupa todo el ancho y no usa el panel izquierdo.
    document.body.classList.toggle('view-pedidos', currentView === 'pedidos');
    if (currentView === 'pedidos') {
        document.getElementById('chatArea').classList.add('has-pedidos');
        renderPedidos(opts);
        return;
    }

    if (currentView === 'contacts') {
        label.textContent = 'Agenda';
        search.placeholder = 'Buscar contacto';
        renderContacts(opts);
    } else if (currentView === 'archived') {
        label.textContent = 'Archivados';
        search.placeholder = 'Buscar en archivados';
        renderArchived(opts);
    } else {
        label.textContent = currentCollection === 'wa_chats_web' ? 'Chat Web' : 'WhatsApp';
        search.placeholder = 'Buscar en las conversaciones';
        renderSessions(opts);
    }
}

function switchTab(el) {
    setRailActive(el);
    currentView = 'inbox';
    currentCollection = el.dataset.col;
    currentSession = null;
    currentContact = null;

    closeDetail();
    document.getElementById('searchInput').value = '';

    // Las dos colecciones ya estan en memoria; el boton de actualizar es el
    // que vuelve a consultar el servidor.
    if (sessionsByCol[currentCollection]) renderCurrentView();
    else loadSessions();
}

function switchView(el) {
    setRailActive(el);
    currentView = el.dataset.view;
    currentSession = null;
    currentContact = null;

    closeDetail();
    document.getElementById('searchInput').value = '';

    // Pedidos y la agenda tienen su propia fuente de datos; las otras vistas
    // necesitan las conversaciones cargadas.
    const necesitaChats = currentView !== 'contacts' && currentView !== 'pedidos';
    if (necesitaChats && !sessionsByCol[currentCollection]) loadSessions();
    else renderCurrentView();
}

function handleSearch(q) {
    clearTimeout(searchTimeout);
    // La agenda y los archivados ya estan en memoria: se filtran sin ir al
    // servidor, asi el resultado es inmediato.
    if (currentView === 'pedidos') return;          // no usa el buscador
    if (currentView === 'contacts') return renderContacts();
    if (currentView === 'archived') return renderArchived();

    searchTimeout = setTimeout(async () => {
        if (!q.trim()) return loadSessions();

        const list = document.getElementById('sessionsList');
        list.innerHTML = skeletonList(4);

        try {
            const results = await fetchAPI('search', { collection: currentCollection, q });
            if (!results.length) {
                list.innerHTML = '<div class="loading"><p>Sin resultados para “' + escapeHtml(q) + '”</p></div>';
                return;
            }

            const grouped = {};
            results.forEach(m => {
                if (!grouped[m.id]) grouped[m.id] = { count: 0, preview: m.content, sessionId: m.sessionId };
                grouped[m.id].count++;
            });

            const isWeb = currentCollection === 'wa_chats_web';
            list.innerHTML = Object.entries(grouped).map(([docId, info], i) => {
                // El nombre del contacto solo esta en /api/sessions; lo tomamos
                // del cache para no mostrar el numero crudo en la busqueda.
                const cached = sessionsCache[docId] || {};
                const s = {
                    id: docId,
                    sessionId: info.sessionId,
                    name: cached.name || null,
                    username: cached.username || null
                };
                return sessionCard(s, isWeb, i, {
                    hideDate: true,
                    preview: highlight(info.preview, q),
                    badge: `<div class="session-count">${info.count} ${info.count === 1 ? 'coincidencia' : 'coincidencias'}</div>`
                });
            }).join('');
        } catch (err) {
            list.innerHTML = '<div class="loading"><p>Error: ' + escapeHtml(err.message) + '</p></div>';
        }
    }, 300);
}

/* --- Refresco automatico ----------------------------------------------
   Cada 5 minutos se vuelven a pedir las dos colecciones. Es un refresco
   silencioso: no pone el esqueleto de carga, no pierde la busqueda ni el
   filtro ni la conversacion abierta, y no marca nada como leido. Los mensajes
   nuevos suben solos el contador de pendientes porque messageCount crece.   */
const REFRESH_MS = 5 * 60 * 1000;
let refreshTimer = null;
let refreshing = false;

// Huella de la lista visible: si no cambia, no se repinta nada.
function sessionsSignature() {
    return (sessionsByCol[currentCollection] || [])
        .map(s => s.id + ':' + s.messageCount + ':' + (s.lastSeen || ''))
        .join('|');
}

function totalPending() {
    return channelUnread('wa_chats') + channelUnread('wa_chats_web');
}

async function refreshSessions(opts = {}) {
    if (refreshing) return;
    refreshing = true;
    const btn = document.getElementById('refreshBtn');
    if (btn) btn.classList.add('spinning');

    const before = sessionsSignature();
    const pendingBefore = totalPending();

    try {
        const [wa, web] = await Promise.all([
            fetchAPI('sessions', { collection: 'wa_chats' }),
            fetchAPI('sessions', { collection: 'wa_chats_web' })
        ]);
        // Un tropiezo de Mongo devuelve {error} con status 500. Conservar lo
        // que ya esta en pantalla y reintentar en 5 minutos es mejor que
        // vaciar la lista o dejar el estado corrupto.
        if (!Array.isArray(wa) || !Array.isArray(web)) return;
        sessionsByCol = { wa_chats: wa, wa_chats_web: web };

        // Con una busqueda en pantalla, repintar borraria los resultados:
        // solo se actualizan los contadores.
        if (currentView === 'inbox' && document.getElementById('searchInput').value.trim()) {
            updateCounters();
        } else if (opts.force || sessionsSignature() !== before) {
            renderCurrentView({ quiet: !!opts.quiet });
        } else {
            updateCounters();
        }

        const nuevas = totalPending() - pendingBefore;
        if (opts.quiet && nuevas > 0) {
            showToast(nuevas === 1 ? '1 conversación con mensajes nuevos'
                                   : nuevas + ' conversaciones con mensajes nuevos');
        }
    } catch {
        // Un fallo puntual de red no debe romper el ciclo ni ensuciar la vista;
        // el siguiente intento entra en 5 minutos.
    } finally {
        refreshing = false;
        if (btn) btn.classList.remove('spinning');
    }
}

function startAutoRefresh() {
    clearInterval(refreshTimer);
    refreshTimer = setInterval(() => refreshSessions({ quiet: true }), REFRESH_MS);
}

// Sin sentido consultar con la pestaña en segundo plano; al volver se refresca
// de inmediato en vez de esperar a que se cumpla el ciclo.
document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearInterval(refreshTimer);
    else { refreshSessions({ quiet: true }); startAutoRefresh(); }
});

function reloadAll() {
    // Manual: repinta siempre, para que se note que hizo algo.
    contactsList = null;          // la agenda tambien se vuelve a pedir
    // Los pedidos se releen de SQL, pero NO se sincroniza con Siesa: eso es
    // una accion explicita, con su propio boton.
    pedidosList = null;
    refreshSessions({ force: true });
    startAutoRefresh();   // reinicia la cuenta de los 5 minutos
}

/* --- Tema ------------------------------------------------------------- */
const SUN = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>';
const MOON = '<path d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5a8.6 8.6 0 1 0 10.8 10.8z"/>';

function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    document.getElementById('themeIcon').innerHTML = theme === 'dark' ? SUN : MOON;
    try { localStorage.setItem('kx-theme', theme); } catch {}
}

function toggleTheme() {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
}

/* --- Atajos ----------------------------------------------------------- */
document.addEventListener('keydown', e => {
    const input = document.getElementById('searchInput');
    if (e.key === '/' && document.activeElement !== input) {
        e.preventDefault();
        input.focus();
        input.select();
    } else if (e.key === 'Escape') {
        if (document.activeElement === input && input.value) {
            input.value = '';
            handleSearch('');
        } else {
            input.blur();
            closeSession();
        }
    }
});

/* --- Init ------------------------------------------------------------- */
let saved = 'light';
try { saved = localStorage.getItem('kx-theme') || 'light'; } catch {}
applyTheme(saved);
document.getElementById('chatScroll').addEventListener('scroll', updateJumpBtn, { passive: true });
loadSessions();
startAutoRefresh();
