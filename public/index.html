// Pinta el panel izquierdo segun la seccion elegida en el rail.
function renderCurrentView(opts = {}) {
    const search = document.getElementById('searchInput');
    const filterBar = document.getElementById('filterBar');
    const label = document.getElementById('channelLabel');

    // "Solo pendientes" y "marcar leidas" solo tienen sentido en la bandeja;
    // el filtro de canal, solo en la agenda.
    if (filterBar) filterBar.style.display = currentView === 'inbox' ? '' : 'none';
    const contactBar = document.getElementById('contactFilterBar');
    if (contactBar) contactBar.style.display = currentView === 'contacts' ? '' : 'none';
    const archBar = document.getElementById('archivedFilterBar');
    if (archBar) archBar.style.display = currentView === 'archived' ? '' : 'none';

    // Pedidos y Transportadoras son tablas anchas: ocupan todo el ancho y no
    // usan el panel izquierdo.
    document.body.classList.toggle('view-pedidos', currentView === 'pedidos');
    document.body.classList.toggle('view-trans', currentView === 'transportadoras');
    document.body.classList.toggle('view-pipeline', currentView === 'pipeline');
    document.body.classList.toggle('view-dash', currentView === 'dash');
    document.body.classList.toggle('view-usuarios', currentView === 'usuarios');
    if (currentView === 'usuarios') {
        document.getElementById('chatArea').classList.add('has-usuarios');
        renderUsuarios(opts);
        return;
    }
    if (currentView === 'pedidos') {
        document.getElementById('chatArea').classList.add('has-pedidos');
        renderPedidos(opts);
        return;
    }
    if (currentView === 'transportadoras') {
        document.getElementById('chatArea').classList.add('has-trans');
        renderTransportadoras(opts);
        return;
    }
    // El tablero tambien ocupa todo el ancho, pero a diferencia de las otras
    // dos se alimenta de las conversaciones que ya estan en memoria.
    if (currentView === 'pipeline') {
        document.getElementById('chatArea').classList.add('has-pipeline');
        renderPipeline(opts);
        return;
    }
    if (currentView === 'dash') {
        document.getElementById('chatArea').classList.add('has-dash');
        renderDash(opts);
        return;
    }

    if (currentView === 'contacts') {
        label.textContent = 'Agenda';
        search.placeholder = 'Buscar contacto';
        renderContacts(opts);
    } else if (currentView === 'archived') {
        label.textContent = 'Archivados';
        search.placeholder = 'Buscar en archivados';
        renderArchived(opts);
    } else {
        label.textContent = currentCollection === 'wa_chats_web' ? 'Chat Web' : 'WhatsApp';
        search.placeholder = 'Buscar en las conversaciones';
        renderSessions(opts);
    }
}

function switchTab(el) {
    setRailActive(el);
    currentView = 'inbox';
    currentCollection = el.dataset.col;
    currentSession = null;
    currentContact = null;

    closeDetail();
    document.getElementById('searchInput').value = '';

    // Las dos colecciones ya estan en memoria; el boton de actualizar es el
    // que vuelve a consultar el servidor.
    if (sessionsByCol[currentCollection]) renderCurrentView();
    else loadSessions();
}

function switchView(el) {
    setRailActive(el);
    currentView = el.dataset.view;
    currentSession = null;
    currentContact = null;

    closeDetail();
    document.getElementById('searchInput').value = '';

    // Pedidos, transportadoras, la agenda y el dashboard tienen su propia
    // fuente de datos; las otras vistas necesitan las conversaciones cargadas.
    const propias = ['contacts', 'pedidos', 'transportadoras', 'dash', 'usuarios'];
    const necesitaChats = !propias.includes(currentView);
    if (necesitaChats && !sessionsByCol[currentCollection]) loadSessions();
    else renderCurrentView();
}

function handleSearch(q) {
    clearTimeout(searchTimeout);
    // La agenda y los archivados ya estan en memoria: se filtran sin ir al
    // servidor, asi el resultado es inmediato.
    // Estas dos traen su propio buscador dentro de la tabla.
    if (currentView === 'pedidos' || currentView === 'transportadoras'
     || currentView === 'pipeline' || currentView === 'dash'
     || currentView === 'usuarios') return;
    if (currentView === 'contacts') return renderContacts();
    if (currentView === 'archived') return renderArchived();

    searchTimeout = setTimeout(async () => {
        if (!q.trim()) return loadSessions();

        const list = document.getElementById('sessionsList');
        list.innerHTML = skeletonList(4);

        try {
            const results = await fetchAPI('search', { collection: currentCollection, q });
            if (!results.length) {
                list.innerHTML = '<div class="loading"><p>Sin resultados para “' + escapeHtml(q) + '”</p></div>';
                return;
            }

            const grouped = {};
            results.forEach(m => {
                if (!grouped[m.id]) grouped[m.id] = { count: 0, preview: m.content, sessionId: m.sessionId };
                grouped[m.id].count++;
            });

            const isWeb = currentCollection === 'wa_chats_web';
            list.innerHTML = Object.entries(grouped).map(([docId, info], i) => {
                // El nombre del contacto solo esta en /api/sessions; lo tomamos
                // del cache para no mostrar el numero crudo en la busqueda.
                const cached = sessionsCache[docId] || {};
                const s = {
                    id: docId,
                    sessionId: info.sessionId,
                    name: cached.name || null,
                    username: cached.username || null
                };
                return sessionCard(s, isWeb, i, {
                    hideDate: true,
                    preview: highlight(info.preview, q),
                    badge: `<div class="session-count">${info.count} ${info.count === 1 ? 'coincidencia' : 'coincidencias'}</div>`
                });
            }).join('');
        } catch (err) {
            list.innerHTML = '<div class="loading"><p>Error: ' + escapeHtml(err.message) + '</p></div>';
        }
    }, 300);
}

/* --- Refresco automatico ----------------------------------------------
   Cada 5 minutos se vuelven a pedir las dos colecciones. Es un refresco
   silencioso: no pone el esqueleto de carga, no pierde la busqueda ni el
   filtro ni la conversacion abierta, y no marca nada como leido. Los mensajes
   nuevos suben solos el contador de pendientes porque messageCount crece.   */
const REFRESH_MS = 5 * 60 * 1000;
let refreshTimer = null;
let refreshing = false;

/* ======================================================================
   AVISOS — que el asesor se entere sin estar mirando

   El panel vive en una pestana de fondo todo el dia. Todo esto existe para
   que un mensaje nuevo se note desde OTRA pestana, y son cuatro canales a
   proposito, porque cada uno falla en un caso distinto:

     1. FAVICON. El icono se pone naranja con el numero de conversaciones sin
        leer. Cuando hay quince pestanas abiertas, el icono es lo unico que
        queda visible de esta: el titulo se corta a dos letras.
     2. TITULO. Alterna «(2) Fulano escribio» con el titulo normal. El texto
        que cambia es lo que se ve por el rabillo del ojo.
     3. SONIDO. Campanita sintetizada con WebAudio. Dos notas para un mensaje,
        tres ascendentes para una conversacion nueva, para distinguirlas sin
        mirar la pantalla. Sintetizada y no un .mp3: no hay archivo que subir
        al App Service, que se pueda quedar en 404 ni que dependa de un CDN.
     4. NOTIFICACION DE ESCRITORIO. La unica que llega con el navegador
        minimizado o detras de otra ventana. Es opcional y la pide la campana
        del rail, porque el permiso solo se puede pedir desde un clic.

   Cuatro decisiones que no son adorno:

   - EL PRIMER CARGUE NO AVISA. Se toma una foto de la bandeja como linea
     base; sin eso, abrir el panel dispararia un aviso por cada conversacion
     que ya estaba sin leer, y el asesor aprenderia a ignorarlos.
   - EL SONIDO ARRANCA BLOQUEADO. Chrome no deja sonar nada hasta que el
     usuario toca la pagina. Se reanuda con el primer clic o tecla, y si aun
     asi no pudo sonar cuando llego un aviso, el panel LO DICE: creer que hay
     una campana que no existe es peor que no tenerla.
   - SILENCIAR NO ES CEGAR. Con los avisos apagados el icono y el titulo
     siguen contando; lo que se apaga es el ruido.
   - CON VARIAS PESTANAS SUENA UNA. El aviso visual es de cada pestana, pero
     la campanita se coordina por localStorage.

   Limite conocido: en una pestana de fondo Chrome frena los temporizadores a
   uno por minuto, asi que el aviso puede llegar hasta ~1 min tarde. Bajar
   LATIDO_MS no lo arregla — eso necesitaria un Service Worker con push.
   ====================================================================== */
const LATIDO_MS = 15000;          // cada cuanto se pregunta si entro algo
const PARPADEO_MS = 900;
const AVISOS_KEY = 'kx-avisos';       // preferencia del asesor
const AVISO_LOCK = 'kx-aviso-sonado'; // coordinacion entre pestanas
const TITULO_BASE = document.title;

let avisosOn = true;
try { avisosOn = localStorage.getItem(AVISOS_KEY) !== 'off'; } catch {}

let fotoBandeja = null;   // id -> messageCount de la ultima revision. null = sin linea base
let parpadeoTimer = null;
let parpadeoFase = false;
let textoAviso = '';
let latidoTimer = null;
let ultimoPulso = null;
let fallosLatido = 0;
let sesionCaida = false;
let avisoSonidoDado = false;

/* --- Sonido ------------------------------------------------------------ */
let audioCtx = null;
function audio() {
    if (audioCtx) return audioCtx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { audioCtx = new AC(); } catch { return null; }
    return audioCtx;
}

// Dos osciladores por nota —la fundamental y su octava, mas floja— con una
// caida exponencial. Eso es lo que la hace sonar a campana y no a pitido de
// microondas, que es lo que uno acaba silenciando a los dos dias.
// Devuelve false si el navegador todavia tiene el audio bloqueado.
function campana(notas) {
    const ctx = audio();
    if (!ctx || ctx.state !== 'running') return false;
    notas.forEach((hz, i) => {
        const t0 = ctx.currentTime + i * 0.13;
        [[hz, 0.16], [hz * 2, 0.05]].forEach(par => {
            const osc = ctx.createOscillator();
            const gan = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = par[0];
            gan.gain.setValueAtTime(0.0001, t0);
            gan.gain.exponentialRampToValueAtTime(par[1], t0 + 0.012);
            gan.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
            osc.connect(gan).connect(ctx.destination);
            osc.start(t0);
            osc.stop(t0 + 0.62);
        });
    });
    return true;
}

// El contexto se crea suspendido y solo un gesto del usuario lo reanuda. Sirve
// cualquiera: abrir un chat, escribir, pulsar la campana.
function despertarAudio() {
    const ctx = audio();
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
}
['pointerdown', 'keydown'].forEach(ev =>
    document.addEventListener(ev, despertarAudio, { passive: true }));

// Dos pestanas del panel ven el mismo mensaje; que suene una. El candado va en
// localStorage porque es lo que comparten, y lleva la firma del aviso para que
// dos mensajes distintos seguidos no se tapen entre si.
function tocaSonar(firma) {
    try {
        const prev = JSON.parse(localStorage.getItem(AVISO_LOCK) || 'null');
        if (prev && prev.f === firma && Date.now() - prev.t < 6000) return false;
        localStorage.setItem(AVISO_LOCK, JSON.stringify({ f: firma, t: Date.now() }));
    } catch {}
    return true;
}

function avisarSonidoBloqueado() {
    if (avisoSonidoDado) return;
    avisoSonidoDado = true;
    showToast('Llegó un mensaje pero el navegador tiene el sonido bloqueado. Pulsa la campana del rail para activarlo.');
}

/* --- Icono de la pestana ----------------------------------------------- */
// Se dibuja en un canvas en vez de tener PNG sueltos porque el numero cambia.
// A 16 px una chapita en la esquina no se lee, asi que el estado con
// pendientes voltea el icono ENTERO: naranja KOS con el numero grande. El
// parpadeo alterna ese naranja con el navy, y ese cambio de color completo se
// ve incluso de reojo.
const iconoLink = document.createElement('link');
iconoLink.rel = 'icon';
document.head.appendChild(iconoLink);

function cajaRedonda(g, lado, r) {
    g.beginPath();
    g.moveTo(r, 0);
    g.arcTo(lado, 0, lado, lado, r);
    g.arcTo(lado, lado, 0, lado, r);
    g.arcTo(0, lado, 0, 0, r);
    g.arcTo(0, 0, lado, 0, r);
    g.closePath();
}

function dibujarIcono(n, encendido, lado) {
    lado = lado || 64;
    const c = document.createElement('canvas');
    c.width = c.height = lado;
    const g = c.getContext('2d');

    cajaRedonda(g, lado, lado * 0.26);
    g.fillStyle = encendido ? '#F28C30' : '#00203f';
    g.fill();

    g.fillStyle = '#fff';
    if (n > 0) {
        const txt = n > 9 ? '9+' : String(n);
        g.font = '700 ' + Math.round(lado * (txt.length > 1 ? 0.5 : 0.64)) + 'px Outfit, system-ui, sans-serif';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillText(txt, lado / 2, lado * 0.55);
    } else {
        // En reposo, una burbuja de chat: el panel sigue siendo reconocible
        // entre las pestanas aunque no haya nada pendiente.
        const m = lado * 0.22, an = lado - m * 2, al = an * 0.72, r = lado * 0.14;
        g.beginPath();
        g.moveTo(m + r, m);
        g.arcTo(m + an, m, m + an, m + al, r);
        g.arcTo(m + an, m + al, m, m + al, r);
        g.lineTo(m + an * 0.42, m + al);
        g.lineTo(m + an * 0.22, m + al + lado * 0.13);
        g.lineTo(m + an * 0.26, m + al);
        g.arcTo(m, m + al, m, m, r);
        g.arcTo(m, m, m + an, m, r);
        g.closePath();
        g.fill();
    }
    return c.toDataURL('image/png');
}

// Icono y titulo salen siempre del mismo sitio, para que no puedan
// contradecirse: el numero es `totalPending()`, el mismo que pinta la bandeja.
function pintarPestana() {
    const n = typeof totalPending === 'function' ? totalPending() : 0;
    const destello = !!parpadeoTimer && parpadeoFase;
    try { iconoLink.href = dibujarIcono(n, destello); } catch {}
    document.title = (destello && textoAviso) ? textoAviso
        : (n > 0 ? '(' + n + ') ' + TITULO_BASE : TITULO_BASE);
}

function empezarParpadeo(texto) {
    textoAviso = texto;
    if (parpadeoTimer) return;   // ya estaba parpadeando: solo cambia el texto
    parpadeoFase = true;
    parpadeoTimer = setInterval(() => { parpadeoFase = !parpadeoFase; pintarPestana(); }, PARPADEO_MS);
    pintarPestana();
}

// Volver a la pestana ya es «me di cuenta»: se apaga el parpadeo, pero el
// numero del icono se queda mientras haya conversaciones sin leer. El parpadeo
// avisa de un hecho; el numero describe un estado, y se apaga al leer.
function calmarPestana() {
    clearInterval(parpadeoTimer);
    parpadeoTimer = null;
    parpadeoFase = false;
    textoAviso = '';
    pintarPestana();
}

/* --- Notificacion de escritorio ---------------------------------------- */
function avisoEscritorio(titulo, cuerpo, id, col) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    try {
        const n = new Notification(titulo, {
            body: cuerpo || '',
            icon: dibujarIcono(totalPending(), true, 192),
            // Un aviso por conversacion: el nuevo reemplaza al anterior de ese
            // mismo chat en vez de apilar cinco avisos del mismo cliente.
            tag: id || 'kx-chatroom',
            renotify: true
        });
        n.onclick = () => {
            window.focus();
            calmarPestana();
            if (id) openSession(id, col);
            n.close();
        };
    } catch {}
}

/* --- Deteccion --------------------------------------------------------- */
// Compara la bandeja con la foto anterior y anuncia lo que entro. Se llama
// despues de CADA refresco, venga del latido o del ciclo de 5 minutos.
function revisarNovedades() {
    const chats = Object.keys(sessionsByCol).flatMap(c => sessionsByCol[c] || []);
    const ahora = {};
    const nuevos = [];

    chats.forEach(s => {
        ahora[s.id] = s.messageCount || 0;
        if (!fotoBandeja) return;               // primer cargue: solo linea base
        if (s.archived) return;                 // archivada y sin respuesta del cliente
        const antes = fotoBandeja[s.id];
        if (antes !== undefined && (s.messageCount || 0) <= antes) return;
        // Si ya esta leida no hay nada que avisar. Este es el caso de mi propio
        // mensaje: al enviarlo, openSession lo marca leido de inmediato.
        if (unreadCount(s) <= 0) return;
        // Y si la tengo abierta delante, la estoy viendo llegar.
        if (s.id === currentSession && !document.hidden) return;
        nuevos.push({ s: s, esNueva: antes === undefined });
    });

    const primeraVez = !fotoBandeja;
    fotoBandeja = ahora;
    if (primeraVez || !nuevos.length) return pintarPestana();
    anunciar(nuevos);
}

function anunciar(nuevos) {
    const hayConversacionNueva = nuevos.some(x => x.esNueva);
    const uno = nuevos.length === 1 ? nuevos[0].s : null;
    const quien = uno ? sessionLabel(uno, uno.collection === 'wa_chats_web') : null;
    const texto = uno
        ? (nuevos[0].esNueva ? 'Nueva conversación · ' + quien : quien + ' escribió')
        : nuevos.length + ' conversaciones con mensajes nuevos';

    // Lo visual va siempre, incluso silenciado: silenciar es no hacer ruido.
    empezarParpadeo(texto);

    if (!avisosOn) return;

    if (tocaSonar(nuevos.map(x => x.s.id + ':' + x.s.messageCount).join('|'))) {
        // Tres notas ascendentes = alguien nuevo; dos = un conocido que
        // escribio. Se distinguen sin mirar la pantalla, que es el punto.
        if (!campana(hayConversacionNueva ? [660, 880, 1320] : [880, 1320])) {
            avisarSonidoBloqueado();
        }
    }

    avisoEscritorio(uno ? texto : 'KosXpress · ChatRoom',
                    uno ? truncate(uno.lastMessage, 120) : texto,
                    uno ? uno.id : null,
                    uno ? uno.collection : null);
}

/* --- La campana del rail ------------------------------------------------ */
const CAMPANA_ON = '<path d="M18 8.5a6 6 0 1 0-12 0c0 5.2-2.2 6.7-2.2 6.7h16.4S18 13.7 18 8.5z"/>' +
                   '<path d="M13.7 19.2a2 2 0 0 1-3.4 0"/>';
const CAMPANA_OFF = '<path d="M18 8.5a6 6 0 0 0-8.6-5.4M5.4 6.1A6 6 0 0 0 6 8.5c0 5.2-2.2 6.7-2.2 6.7h12.4"/>' +
                    '<path d="M13.7 19.2a2 2 0 0 1-3.4 0"/><path d="M3 3l18 18"/>';

function pintarCampana() {
    const btn = document.getElementById('btnAvisos');
    if (!btn) return;
    const icono = document.getElementById('avisosIcono');
    if (icono) icono.innerHTML = avisosOn ? CAMPANA_ON : CAMPANA_OFF;

    const caido = fallosLatido >= 3;
    const sinPermiso = ('Notification' in window) && Notification.permission !== 'granted';
    btn.classList.toggle('avisos-off', !avisosOn);
    btn.classList.toggle('avisos-error', caido);

    const tip = btn.querySelector('.rail-tip');
    if (tip) {
        tip.textContent = sesionCaida ? 'Sesión expirada: vuelve a entrar'
            : caido ? 'Sin conexión: nadie está vigilando'
            : !avisosOn ? 'Avisos silenciados'
            : sinPermiso ? 'Avisos activos · sin aviso de escritorio'
            : 'Avisos activos';
    }
}

function alternarAvisos() {
    avisosOn = !avisosOn;
    try { localStorage.setItem(AVISOS_KEY, avisosOn ? 'on' : 'off'); } catch {}
    pintarCampana();

    if (!avisosOn) {
        calmarPestana();
        return showToast('Avisos silenciados. El icono de la pestaña sigue contando.');
    }

    // Encender es el gesto que el navegador estaba esperando: aqui se
    // desbloquea el audio y se pide el permiso de escritorio, dos cosas que
    // solo se pueden hacer dentro de un clic. La campanita de prueba no es
    // coqueteria: es la unica forma de que el asesor sepa YA si va a sonar.
    despertarAudio();
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().then(pintarCampana).catch(() => {});
    }
    setTimeout(() => {
        if (!campana([880, 1320])) avisarSonidoBloqueado();
    }, 150);
    showToast('Avisos activados');
}

/* --- Latido ------------------------------------------------------------ */
// /api/latido devuelve ~50 bytes que resumen la coleccion `contacts`. Mientras
// no cambien, no se pide nada mas; cuando cambian, se baja la bandeja completa
// y `revisarNovedades()` decide si hay algo que anunciar.
async function latir() {
    try {
        const d = await fetchAPI('latido');
        // La sesion caduca y /api/* empieza a responder 401. Es un fallo real
        // —nadie esta vigilando— pero por una causa que el asesor puede
        // arreglar en diez segundos, asi que se distingue del corte de red:
        // rotularlo «sin conexion» lo mandaria a revisar el internet.
        if (d && d.login) {
            sesionCaida = true;
            fallosLatido = 3;
            pintarCampana();
            return;
        }
        if (!d || !d.pulso) throw new Error('respuesta sin pulso');
        if (fallosLatido || sesionCaida) { fallosLatido = 0; sesionCaida = false; pintarCampana(); }
        if (ultimoPulso === null) { ultimoPulso = d.pulso; return; }
        if (d.pulso === ultimoPulso) return;
        ultimoPulso = d.pulso;
        await refreshSessions({ quiet: true });
    } catch {
        // Un fallo suelto es un bache de red y no merece ruido. Varios seguidos
        // significan que nadie esta vigilando, y eso el asesor tiene que verlo:
        // el modo de fallo peligroso aqui es el silencioso.
        if (++fallosLatido === 3) pintarCampana();
    }
}

function arrancarLatido() {
    // Sin acceso a las conversaciones no hay nada que vigilar, y el latido
    // seria un 403 cada quince segundos hasta que alguien cierre la pestana.
    if (!puedeVerChats()) return;
    clearInterval(latidoTimer);
    latidoTimer = setInterval(latir, LATIDO_MS);
}

// Huella de la lista visible: si no cambia, no se repinta nada.
function sessionsSignature() {
    // Archivados y Pipeline mezclan los dos canales: si la huella solo mirara
    // el canal visible, un mensaje nuevo del otro no repintaria nada. La etapa
    // entra en la huella para que un movimiento hecho en otro equipo se vea al
    // siguiente refresco.
    const cols = (currentView === 'archived' || currentView === 'pipeline')
        ? Object.keys(sessionsByCol)
        : [currentCollection];
    return cols
        .flatMap(col => (sessionsByCol[col] || []).map(s =>
            s.id + ':' + s.messageCount + ':' + (s.lastSeen || '') + ':' + plEtapaDe(s)))
        .join('|');
}

function totalPending() {
    return channelUnread('wa_chats') + channelUnread('wa_chats_web');
}

async function refreshSessions(opts = {}) {
    if (!puedeVerChats()) return;
    if (refreshing) return;
    refreshing = true;
    const btn = document.getElementById('refreshBtn');
    if (btn) btn.classList.add('spinning');

    const before = sessionsSignature();
    const pendingBefore = totalPending();

    try {
        const [wa, web] = await Promise.all([
            fetchAPI('sessions', { collection: 'wa_chats' }),
            fetchAPI('sessions', { collection: 'wa_chats_web' })
        ]);
        // Un tropiezo de Mongo devuelve {error} con status 500. Conservar lo
        // que ya esta en pantalla y reintentar en 5 minutos es mejor que
        // vaciar la lista o dejar el estado corrupto.
        if (!Array.isArray(wa) || !Array.isArray(web)) return;
        sessionsByCol = { wa_chats: wa, wa_chats_web: web };

        // Con una busqueda en pantalla, repintar borraria los resultados:
        // solo se actualizan los contadores.
        if (currentView === 'inbox' && document.getElementById('searchInput').value.trim()) {
            updateCounters();
        } else if (opts.force || sessionsSignature() !== before) {
            renderCurrentView({ quiet: !!opts.quiet });
        } else {
            updateCounters();
        }

        // Los avisos de pestana se evaluan aqui y no en el latido, para que
        // tambien cubran el refresco de 5 minutos y el boton de actualizar: si
        // el latido se cae, el aviso sigue llegando, solo que mas tarde.
        revisarNovedades();

        const nuevas = totalPending() - pendingBefore;
        if (opts.quiet && nuevas > 0) {
            showToast(nuevas === 1 ? '1 conversación con mensajes nuevos'
                                   : nuevas + ' conversaciones con mensajes nuevos');
        }
    } catch {
        // Un fallo puntual de red no debe romper el ciclo ni ensuciar la vista;
        // el siguiente intento entra en 5 minutos.
    } finally {
        refreshing = false;
        if (btn) btn.classList.remove('spinning');
    }
}

function startAutoRefresh() {
    clearInterval(refreshTimer);
    refreshTimer = setInterval(() => refreshSessions({ quiet: true }), REFRESH_MS);
}

// En segundo plano se para el refresco COMPLETO —bajarse las dos colecciones
// para repintar una vista que nadie esta mirando no tiene sentido— pero el
// latido sigue: la pestana de fondo es justamente donde el asesor necesita
// enterarse, y el latido son 50 bytes. Al volver se refresca de inmediato en
// vez de esperar a que se cumpla el ciclo.
document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearInterval(refreshTimer);
    else {
        calmarPestana();
        refreshSessions({ quiet: true });
        startAutoRefresh();
    }
});

// Minimizar la ventana o taparla con otra aplicacion no siempre marca la
// pagina como oculta, asi que volver a ella tambien cuenta como «ya lo vi».
window.addEventListener('focus', calmarPestana);

function reloadAll() {
    // Manual: repinta siempre, para que se note que hizo algo.
    contactsList = null;          // la agenda tambien se vuelve a pedir
    // Los pedidos se releen de SQL. Ir a Siesa lo decide la sincronizacion
    // automatica cuando se repinte la vista, que respeta su propia espera: el
    // boton de refrescar es de todo el panel y no tiene por que saltarsela.
    pedidosList = null;
    transList = null;
    // El dashboard se recalcula entero: es un resumen, y un resumen viejo
    // despues de pulsar "actualizar" es peor que no tenerlo.
    dashData = null;
    dashCargadoEn = 0;
    refreshSessions({ force: true });
    startAutoRefresh();   // reinicia la cuenta de los 5 minutos
}

const SUN = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>';

function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    document.getElementById('themeIcon').innerHTML = theme === 'dark' ? SUN : MOON;
    try { localStorage.setItem('kx-theme', theme); } catch {}
}

function toggleTheme() {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
}

/* --- Atajos ----------------------------------------------------------- */
document.addEventListener('keydown', e => {
    const input = document.getElementById('searchInput');
    // Escribir "/" dentro de un campo es escribir "/", no abrir el buscador:
    // si no, una nota o un mensaje con una fecha salta al buscador a media
    // palabra.
    const enCampo = /^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '');
    if (e.key === '/' && !enCampo) {
        e.preventDefault();
        input.focus();
        input.select();
    } else if (e.key === 'Escape') {
        // El menu de una tarjeta es lo ultimo que se abrio: es lo que el
        // Escape viene a cerrar.
        const menu = document.getElementById('plMenu');
        if (menu && menu.classList.contains('show')) return plSalirMenu();
        if (document.activeElement === input && input.value) {
            input.value = '';
            handleSearch('');
        } else {
            input.blur();
            closeSession();
        }
    }
});


/* =======================================================================
   SESION Y PERMISOS

   El rail esconde lo que la persona no tiene, pero eso es comodidad, no
   seguridad: quien sepa la URL de la API puede escribirla a mano. Lo que de
   verdad protege son las guardas de server.js (auth.conModulo), y esconder el
   boton solo evita el clic que iba a terminar en un 403.

   El catalogo de modulos NO esta escrito aqui: llega en /api/auth/sesion junto
   con lo que tiene la persona. Asi un modulo nuevo aparece en el centro de
   usuarios sin tocar este archivo, y no puede haber una casilla que el
   servidor no conozca.
   ======================================================================= */
let sesion = null;            // el usuario que esta mirando
let MODULOS_PANEL = [];       // el catalogo, tal cual lo manda el servidor

// Que modulo hace falta para cada boton del rail. `inbox` y `archived` son la
// misma llave porque los archivados son las mismas conversaciones con una
// bandera puesta: separarlos daria un permiso que no significa nada.
const MODULO_DE_VISTA = {
    inbox:           'conversaciones',
    archived:        'conversaciones',
    dash:            'dashboard',
    pipeline:        'pipeline',
    pedidos:         'pedidos',
    transportadoras: 'transportadoras',
    contacts:        'contactos',
    usuarios:        'usuarios'
};

function tieneModulo(clave) {
    return !!sesion && (sesion.modulos || []).includes(clave);
}

// El tablero del Pipeline se arma con /api/sessions, asi que quien tiene el
// embudo tiene que poder leer las conversaciones aunque no tenga la bandeja.
// Es la misma regla que aplica el servidor en esa ruta.
function puedeVerChats() {
    return tieneModulo('conversaciones') || tieneModulo('pipeline');
}

async function arrancar() {
    let d;
    try {
        const r = await fetch('/api/auth/sesion');
        if (!r.ok) return alLogin();
        d = await r.json();
    } catch {
        // Sin respuesta no hay forma de saber si hay sesion; el login es el
        // sitio correcto para que la persona lo vuelva a intentar.
        return alLogin();
    }

    sesion = d.usuario;
    MODULOS_PANEL = d.modulos || [];
    // La clave temporal sin cambiar es un estado del que solo se sale en el
    // login: el servidor tampoco deja hacer nada mas hasta que se cambie.
    if (sesion.debeCambiar) return alLogin();

    aplicarPermisos();
}

function aplicarPermisos() {
    aplicarPermisosRail();
    arrancarVista();
    // Se llama aqui, con la sesion ya resuelta, porque el latido vigila las
    // conversaciones y hay usuarios que no las tienen (la funcion se guarda
    // sola, pero al arrancar el panel `sesion` todavia era null).
    arrancarLatido();
}

function aplicarPermisosRail() {
    const yo = document.getElementById('railYo');
    if (yo) {
        yo.style.display = '';
        document.getElementById('railYoIni').textContent = getInitials(sesion.nombre);
        document.getElementById('railYoTip').textContent = sesion.nombre + ' · Salir';
    }

    // Los dos canales van juntos: son la misma llave.
    document.querySelectorAll('.rail-btn[data-col]').forEach(b => {
        b.style.display = tieneModulo('conversaciones') ? '' : 'none';
    });
    document.querySelectorAll('.rail-btn[data-view]').forEach(b => {
        const mod = MODULO_DE_VISTA[b.dataset.view];
        b.style.display = (!mod || tieneModulo(mod)) ? '' : 'none';
    });
}

function arrancarVista() {
    // La primera vista es la bandeja si la tiene; si no, el primer boton que le
    // quedo visible. Abrir siempre en la bandeja dejaria a quien solo tiene
    // Pedidos mirando una lista que su usuario no puede pedir.
    if (tieneModulo('conversaciones')) {
        loadSessions();
        startAutoRefresh();
        return;
    }

    // El sidebar no se esconde aqui aunque no haya bandeja: Contactos y
    // Archivados lo usan para su propia lista, y cada vista ancha (Pedidos,
    // Pipeline, Usuarios…) ya lo oculta con su clase `view-*`.
    const primero = [...document.querySelectorAll('.rail-btn[data-view]')]
        .find(b => b.style.display !== 'none');
    if (primero) {
        switchView(primero);
        // El tablero si necesita las conversaciones, y switchView las pide.
        if (puedeVerChats()) startAutoRefresh();
        return;
    }

    // Nadie deberia quedar asi, pero un usuario sin modulos existe: es la forma
    // de dejar a alguien creado y sin acceso todavia. Decirlo es mejor que
    // mostrar un panel vacio que parece roto.
    document.getElementById('chatArea').innerHTML =
        '<div class="empty-state"><div class="empty-mark">KX</div>' +
        '<h2>Sin acceso a ninguna sección</h2>' +
        '<p>Tu usuario existe pero todavía no tiene módulos asignados. ' +
        'Pídele a quien administra el panel que te dé acceso.</p></div>';
}

async function salirSesion() {
    if (!confirm('¿Cerrar la sesión de ' + (sesion ? sesion.nombre : 'este usuario') + '?')) return;
    try { await fetch('/api/auth/salir', { method: 'POST' }); } catch {}
    location.replace('/login.html');
}

/* =======================================================================
   CENTRO DE USUARIOS

   Tarjeta por persona, casilla por modulo. Cada clic guarda de una vez y de
   forma optimista —la casilla cambia antes de que conteste el servidor y se
   devuelve sola con un aviso si la escritura falla—, igual que el tablero del
   Pipeline y por la misma razon: un boton de guardar al final de una tarjeta
   con siete casillas es un boton que alguien va a olvidar.

   Las reglas que el servidor rechaza (quitarse uno mismo Usuarios,
   desactivarse, borrar al ultimo administrador) se pintan deshabilitadas aqui
   ADEMAS de comprobarse alla: el panel las muestra, el servidor las cumple.
   ======================================================================= */
let usrLista = null;      // usuarios traidos del servidor
let usrLog = null;        // registro de cambios
let usrNueva = null;      // la tarjeta de alta, mientras se escribe
let usrClaveTemporal = '1234';

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-10"/></svg>';

// Los nombres de las acciones del registro. La clave es lo que se guarda en
// Mongo (accion), el valor lo que lee una persona.
const ACCIONES = {
    'sesion.entrar':             'Entró al panel',
    'sesion.clave':              'Cambió su contraseña',
    'chat.archivar':             'Archivó una conversación',
    'chat.desarchivar':          'Sacó una conversación del archivo',
    'chat.modo':                 'Cambió el modo del bot',
    'chat.enviar':               'Le escribió al cliente',
    'pipeline.mover':            'Movió una tarjeta de etapa',
    'pipeline.nota':             'Escribió una nota',
    'pipeline.nota.borrar':      'Borró una nota',
    'pedidos.actualizar':        'Actualizó un pedido',
    'pedidos.notificar':         'Avisó el despacho al cliente',
    'pedidos.sincronizar':       'Sincronizó con Siesa',
    'transportadoras.crear':     'Creó una transportadora',
    'transportadoras.editar':    'Editó una transportadora',
    'transportadoras.eliminar':  'Eliminó una transportadora',
    'usuarios.crear':            'Creó un usuario',
    'usuarios.editar':           'Cambió permisos de un usuario',
    'usuarios.clave':            'Reinició una contraseña',
    'usuarios.eliminar':         'Eliminó un usuario'
};

function usrHace(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return '—';
    const min = (Date.now() - d.getTime()) / 60000;
    if (min < 1) return 'hace un momento';
    if (min < 60) return 'hace ' + Math.floor(min) + ' min';
    if (min < 1440) return 'hace ' + Math.floor(min / 60) + ' h';
    if (min < 10080) return 'hace ' + Math.floor(min / 1440) + ' d';
    return d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: '2-digit' });
}

// Las tildes se cambian con un mapa y no con normalize('NFD') + un rango de
// marcas combinantes: ese rango son caracteres invisibles dentro del codigo, y
// basta con que un editor o un copiado los normalice para que la expresion deje
// de hacer nada sin que se note.
const USR_TILDES = { 'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ú': 'u', 'ü': 'u', 'ñ': 'n' };

// Sugerencia de usuario a partir del nombre: "Diana Nieto" -> "dianan". Es la
// forma que ya se venia usando; se puede corregir a mano antes de crear.
function usrSugerir(nombre) {
    const partes = String(nombre || '').toLowerCase()
        .replace(/[^a-z ]/g, c => USR_TILDES[c] || ' ')
        .trim().split(/ +/);
    if (!partes[0]) return '';
    return (partes[0] + (partes[1] ? partes[1][0] : '')).slice(0, 30);
}

async function postUsuarios(ruta, cuerpo) {
    const r = await fetch('/api/usuarios/' + ruta, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cuerpo || {})
    });
    if (r.status === 401) return alLogin();
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'el servidor respondió ' + r.status);
    return d;
}

// La tarjeta de alta vive SOLO en el DOM hasta que se guarda, como la fila
// nueva de Transportadoras: sin esto, cualquier repintado borraria lo escrito.
function usrSincronizarNueva() {
    if (!usrNueva) return;
    const nom = document.getElementById('usrNuevoNombre');
    const usu = document.getElementById('usrNuevoUsuario');
    if (nom) usrNueva.nombre = nom.value;
    if (usu) usrNueva.usuario = usu.value;
}

function usrChipModulo(m, activos, deshabilitada, onchange) {
    const on = activos.includes(m.clave);
    return `<label class="usr-mod ${on ? 'on' : ''} ${deshabilitada ? 'fija' : ''}"
                   title="${escapeAttr(m.descripcion || '')}">
        <input type="checkbox" ${on ? 'checked' : ''} ${deshabilitada ? 'disabled' : ''}
               onchange="${onchange}">
        <span class="caja">${CHECK_SVG}</span>${escapeHtml(m.nombre)}
    </label>`;
}

function usrTarjeta(u) {
    const yo = sesion && u.usuario === sesion.usuario;

    const modulos = MODULOS_PANEL.map(m => {
        // Quitarse uno mismo el acceso a Usuarios deja el panel sin quien
        // administre — y sin forma de arreglarlo desde el panel. Es la misma
        // regla que aplica el servidor; aqui solo se pinta.
        const fija = yo && m.clave === 'usuarios' && u.modulos.includes('usuarios');
        return usrChipModulo(m, u.modulos, fija,
            `usrModulo('${u.usuario}','${m.clave}',this)`);
    }).join('');

    return `<div class="usr-card ${u.activo ? '' : 'inactivo'} ${yo ? 'yo' : ''}" data-usr="${escapeAttr(u.usuario)}">
        <div class="usr-top">
            <div class="usr-ini">${escapeHtml(getInitials(u.nombre))}</div>
            <div class="usr-id">
                <div class="usr-nombre">${escapeHtml(u.nombre)}</div>
                <div class="usr-sub"><b>${escapeHtml(u.usuario)}</b> · ${u.ultimoIngreso
                    ? 'entró ' + usrHace(u.ultimoIngreso) : 'nunca ha entrado'}</div>
            </div>
            ${yo ? '<span class="usr-yo-pin">Tú</span>' : ''}
            <button class="usr-sw ${u.activo ? 'on' : ''}" ${yo ? 'disabled' : ''}
                    onclick="usrActivo('${u.usuario}', this)"
                    title="${yo ? 'No puedes desactivar tu propio usuario'
                              : u.activo ? 'Desactivar' : 'Activar'}"
                    aria-label="Activo"></button>
        </div>

        <div class="usr-modulos">${modulos}</div>

        <div class="usr-pie">
            ${u.debeCambiar ? '<span class="usr-estado">Clave temporal sin cambiar</span>' : ''}
            <div class="usr-acciones">
                <button class="usr-mini" onclick="usrReiniciar('${u.usuario}')">Reiniciar contraseña</button>
                <button class="usr-mini borrar" ${yo ? 'disabled' : ''}
                        onclick="usrEliminar('${u.usuario}')">Eliminar</button>
            </div>
        </div>
    </div>`;
}

function usrTarjetaNueva() {
    const modulos = MODULOS_PANEL.map(m =>
        usrChipModulo(m, usrNueva.modulos, false, `usrModuloNuevo('${m.clave}',this)`)).join('');

    return `<div class="usr-card nueva">
        <div class="usr-alta">
            <div class="campo">
                <label for="usrNuevoNombre">Nombre completo</label>
                <input type="text" id="usrNuevoNombre" placeholder="Diana Nieto"
                       value="${escapeAttr(usrNueva.nombre)}"
                       oninput="usrNombreEscrito(this.value)">
            </div>
            <div class="campo">
                <label for="usrNuevoUsuario">Usuario</label>
                <input type="text" id="usrNuevoUsuario" class="usuario" placeholder="dianan"
                       value="${escapeAttr(usrNueva.usuario)}" autocapitalize="none" spellcheck="false"
                       oninput="usrNueva.usuario = this.value; usrNueva.tocado = true;">
            </div>
        </div>

        <div class="usr-modulos">${modulos}</div>

        <div class="usr-pie">
            <span class="usr-estado">Entrará con la clave ${escapeHtml(usrClaveTemporal)}</span>
            <div class="usr-acciones">
                <button class="usr-mini" onclick="usrDescartar()">Descartar</button>
                <button class="btn primary" onclick="usrCrear()">Crear usuario</button>
            </div>
        </div>
    </div>`;
}

function usrFilaLog(l) {
    const detalle = l.detalle && Object.keys(l.detalle).length
        ? JSON.stringify(l.detalle) : '';
    return `<tr>
        <td class="cuando" title="${escapeAttr(formatFullDate(l.en) || l.en || '')}">${usrHace(l.en)}</td>
        <td class="quien">${escapeHtml(l.nombre || l.usuario || '—')}</td>
        <td class="que">${escapeHtml(ACCIONES[l.accion] || l.accion)}</td>
        <td class="donde" title="${escapeAttr(detalle)}">${escapeHtml(l.objetivo || '')}</td>
    </tr>`;
}

async function renderUsuarios(opts = {}) {
    const panel = document.getElementById('usuariosPanel');
    usrSincronizarNueva();

    if (!usrLista) {
        panel.innerHTML = '<div class="ped-vacio"><div class="spinner"></div><p>Cargando usuarios…</p></div>';
        try {
            const d = await fetchAPI('usuarios');
            if (!d || !Array.isArray(d.usuarios)) {
                throw new Error((d && d.error) || 'respuesta inesperada del servidor');
            }
            usrLista = d.usuarios;
            if (Array.isArray(d.modulos) && d.modulos.length) MODULOS_PANEL = d.modulos;
            if (d.claveTemporal) usrClaveTemporal = d.claveTemporal;
        } catch (err) {
            panel.innerHTML = `<div class="ped-vacio"><p>No se pudieron cargar los usuarios.<br>
                <b>${escapeHtml(err.message)}</b></p></div>`;
            return;
        }
        if (currentView !== 'usuarios') return;   // cambiaron de vista mientras cargaba
    }

    // El registro se pide aparte y no bloquea: la lista de usuarios se pinta
    // igual si la coleccion de auditoria todavia no existe.
    if (!usrLog) {
        fetchAPI('auditoria', { limite: 60 }).then(d => {
            usrLog = Array.isArray(d) ? d : [];
            const cuerpo = document.getElementById('usrLogCuerpo');
            if (cuerpo) cuerpo.innerHTML = usrLog.length
                ? usrLog.map(usrFilaLog).join('')
                : '<tr class="ped-sinres"><td colspan="4">Todavía no hay cambios registrados.</td></tr>';
        }).catch(() => {});
    }

    const activos = usrLista.filter(u => u.activo).length;

    panel.innerHTML = `
        <div class="ped-head">
            <div>
                <h2>Usuarios</h2>
                <div class="sub">
                    ${usrLista.length} ${usrLista.length === 1 ? 'usuario' : 'usuarios'} ·
                    ${activos} ${activos === 1 ? 'activo' : 'activos'}
                </div>
            </div>
            <div class="ped-actions">
                <button class="btn primary" onclick="usrAgregar()" ${usrNueva ? 'disabled' : ''}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                         stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
                    Agregar usuario
                </button>
            </div>
        </div>

        <div class="usr-grid">
            ${usrLista.map(usrTarjeta).join('')}
            ${usrNueva ? usrTarjetaNueva() : ''}
        </div>

        <p class="usr-nota">
            Cada casilla es una sección del panel. Los cambios se guardan solos al hacer clic.
            Quien se crea aquí entra con la contraseña temporal <code>${escapeHtml(usrClaveTemporal)}</code>
            y el panel le pide una propia en el primer ingreso; «Reiniciar contraseña» la devuelve a
            esa temporal y cierra las sesiones que esa persona tenga abiertas.
            Nadie puede quitarse a sí mismo el acceso a <b>Usuarios</b>, desactivarse ni
            eliminarse: esos controles salen bloqueados en tu propia tarjeta, que es lo que
            garantiza que el panel nunca se quede sin quien lo administre.
        </p>

        <div class="usr-log-tit">
            <h3>Registro de cambios</h3>
            <span class="sub">lo último que se hizo en el portal, con nombre propio</span>
        </div>
        <div class="ped-wrap">
            <div class="ped-scroll">
                <table class="ped usr-log">
                    <thead>
                        <tr><th>Cuándo</th><th>Quién</th><th>Qué hizo</th><th>Dónde</th></tr>
                    </thead>
                    <tbody id="usrLogCuerpo">${
                        usrLog ? (usrLog.length ? usrLog.map(usrFilaLog).join('')
                            : '<tr class="ped-sinres"><td colspan="4">Todavía no hay cambios registrados.</td></tr>')
                        : '<tr class="ped-sinres"><td colspan="4">Cargando…</td></tr>'
                    }</tbody>
                </table>
            </div>
        </div>`;
}

function usrAgregar() {
    usrNueva = { nombre: '', usuario: '', tocado: false, modulos: MODULOS_PANEL.map(m => m.clave) };
    renderUsuarios().then(() => {
        const i = document.getElementById('usrNuevoNombre');
        if (i) i.focus();
    });
}

function usrDescartar() {
    usrSincronizarNueva();
    if (usrNueva && (usrNueva.nombre.trim() || usrNueva.usuario.trim()) &&
        !confirm('¿Descartar este usuario sin crearlo?')) return;
    usrNueva = null;
    renderUsuarios();
}

// El usuario se sugiere mientras nadie lo haya escrito a mano. En cuanto se
// corrige, deja de moverse solo: nada mas molesto que un campo que se
// reescribe encima de lo que uno acaba de teclear.
function usrNombreEscrito(v) {
    if (!usrNueva) return;
    usrNueva.nombre = v;
    if (usrNueva.tocado) return;
    usrNueva.usuario = usrSugerir(v);
    const i = document.getElementById('usrNuevoUsuario');
    if (i) i.value = usrNueva.usuario;
}

function usrModuloNuevo(clave, el) {
    if (!usrNueva) return;
    usrSincronizarNueva();
    usrNueva.modulos = el.checked
        ? [...new Set([...usrNueva.modulos, clave])]
        : usrNueva.modulos.filter(c => c !== clave);
    el.closest('.usr-mod').classList.toggle('on', el.checked);
}

async function usrCrear() {
    usrSincronizarNueva();
    const nombre = (usrNueva.nombre || '').trim();
    const usuario = (usrNueva.usuario || '').trim().toLowerCase();
    if (!nombre || !usuario) return showToast('Escribe el nombre y el usuario');

    try {
        const d = await postUsuarios('guardar', { usuario, nombre, modulos: usrNueva.modulos });
        usrLista.push(d.usuario);
        usrLista.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' }));
        usrNueva = null;
        usrLog = null;                 // el alta acaba de entrar al registro
        await renderUsuarios();
        showToast(d.usuario.nombre + ' entra con la clave ' + usrClaveTemporal);
    } catch (err) {
        showToast('No se pudo crear: ' + err.message);
    }
}

// Guardar es optimista: la casilla ya cambio en pantalla cuando sale la
// peticion. Si el servidor la rechaza se repinta la lista entera desde lo que
// hay en memoria, que es la verdad anterior al clic.
async function usrModulo(usuario, clave, el) {
    const u = (usrLista || []).find(x => x.usuario === usuario);
    if (!u) return;

    const previos = [...u.modulos];
    u.modulos = el.checked
        ? [...new Set([...u.modulos, clave])]
        : u.modulos.filter(c => c !== clave);
    el.closest('.usr-mod').classList.toggle('on', el.checked);

    try {
        const d = await postUsuarios('guardar', { usuario, modulos: u.modulos });
        Object.assign(u, d.usuario);
        usrLog = null;
        // Se repinta porque un cambio de permisos mueve las reglas de las otras
        // tarjetas: quitarle Usuarios a alguien puede dejar a otro como unico
        // administrador, y esa casilla tiene que quedar bloqueada de una vez.
        renderUsuarios();
        // Quien se cambia sus propios permisos ve el rail al instante; el
        // servidor ya los reevalua en cada peticion, esto es solo la pintura.
        if (sesion && usuario === sesion.usuario) {
            sesion.modulos = u.modulos;
            aplicarPermisosRail();
        }
    } catch (err) {
        u.modulos = previos;
        renderUsuarios();
        showToast('No se pudo guardar: ' + err.message);
    }
}

async function usrActivo(usuario, btn) {
    const u = (usrLista || []).find(x => x.usuario === usuario);
    if (!u) return;
    const nuevo = !u.activo;
    if (!nuevo && !confirm('¿Desactivar a ' + u.nombre + '? No podrá entrar al panel hasta que lo actives otra vez.')) return;

    btn.disabled = true;
    try {
        const d = await postUsuarios('guardar', { usuario, activo: nuevo });
        Object.assign(u, d.usuario);
        usrLog = null;
        await renderUsuarios();
        showToast(u.nombre + (nuevo ? ' puede entrar de nuevo' : ' ya no puede entrar'));
    } catch (err) {
        btn.disabled = false;
        showToast('No se pudo guardar: ' + err.message);
    }
}

async function usrReiniciar(usuario) {
    const u = (usrLista || []).find(x => x.usuario === usuario);
    if (!u) return;
    if (!confirm('¿Reiniciar la contraseña de ' + u.nombre + ' a "' + usrClaveTemporal +
                 '"?\n\nSe cerrarán las sesiones que tenga abiertas y el panel le pedirá una nueva al entrar.')) return;

    try {
        await postUsuarios('clave', { usuario });
        u.debeCambiar = true;
        usrLog = null;
        await renderUsuarios();
        showToast('Contraseña de ' + u.nombre + ' reiniciada a ' + usrClaveTemporal);
    } catch (err) {
        showToast('No se pudo reiniciar: ' + err.message);
    }
}

async function usrEliminar(usuario) {
    const u = (usrLista || []).find(x => x.usuario === usuario);
    if (!u) return;
    if (!confirm('¿Eliminar a ' + u.nombre + '?\n\nNo podrá entrar más. Lo que hizo sigue en el registro de cambios.')) return;

    try {
        await postUsuarios('eliminar', { usuario });
        usrLista = usrLista.filter(x => x.usuario !== usuario);
        usrLog = null;
        await renderUsuarios();
        showToast(u.nombre + ' eliminado');
    } catch (err) {
        showToast('No se pudo eliminar: ' + err.message);
    }
}

/* --- Init ------------------------------------------------------------- */
let saved = 'light';
try { saved = localStorage.getItem('kx-theme') || 'light'; } catch {}
applyTheme(saved);
document.getElementById('chatScroll').addEventListener('scroll', updateJumpBtn, { passive: true });
// Nada se pide antes de saber quien esta mirando: /api/auth/sesion decide que
// botones existen y cual es la primera vista. Sin sesion, arrancar() manda al
// login y no llega a pedir conversaciones que el servidor iba a negar.
arrancar();

// Los avisos arrancan con el panel: el icono de la pestana se dibuja aunque no
// haya nada pendiente, para que la pestana sea reconocible entre las demas.
// El latido NO se arranca aqui: depende de que la persona tenga acceso a las
// conversaciones, y eso solo se sabe cuando responde /api/auth/sesion.
pintarCampana();
pintarPestana();
</script>
