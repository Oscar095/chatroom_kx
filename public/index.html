// sustituye. NO se le pega el numero al final cuando falta el marcador, como
// hace urlRastreo() en server.js: alli el destinatario es el cliente y una URL
// aproximada es mejor que ninguna; aqui el asesor solo quiere ver la pagina.
function urlConGuia(url, guia) {
    if (!url) return '';
    return url.includes('{guia}') ? url.replace('{guia}', encodeURIComponent(guia)) : url;
}

function filaTransportadora(t) {
    return `
        <tr data-trans="${t.id}">
            <td class="col-nombre">
                <input class="trans-inp nombre" type="text" maxlength="120" placeholder="Nombre"
                       value="${escapeAttr(t.nombre)}"
                       onchange="guardarTransportadora(${t.id}, 'nombre', this)"
                       onkeydown="if(event.key==='Enter')this.blur()">
            </td>
            <td>
                <input class="trans-inp url" type="text" maxlength="500" placeholder="https://…/rastreo?guia={guia}"
                       value="${escapeAttr(t.urlRastreo)}"
                       onchange="guardarTransportadora(${t.id}, 'urlRastreo', this)"
                       onkeydown="if(event.key==='Enter')this.blur()">
            </td>
            <td>
                <div class="trans-acciones">
                    <button class="trans-mini" title="Abrir la página de rastreo"
                            onclick="abrirRastreo(${t.id})">${ICONO_ABRIR}</button>
                    <button class="trans-mini borrar" title="Eliminar del directorio"
                            onclick="eliminarTransportadora(${t.id})">${ICONO_BORRAR}</button>
                </div>
            </td>
        </tr>`;
}

function filaNuevaTransportadora(n) {
    return `
        <tr class="trans-nueva" data-nueva="${n.tmp}">
            <td class="col-nombre">
                <input class="trans-inp nombre" type="text" maxlength="120" placeholder="Nombre de la transportadora"
                       value="${escapeAttr(n.nombre)}" onkeydown="if(event.key==='Enter')guardarNueva(${n.tmp})">
            </td>
            <td>
                <input class="trans-inp url" type="text" maxlength="500" placeholder="https://…/rastreo?guia={guia}"
                       value="${escapeAttr(n.urlRastreo)}" onkeydown="if(event.key==='Enter')guardarNueva(${n.tmp})">
            </td>
            <td>
                <div class="trans-acciones">
                    <button class="trans-mini" title="Guardar" onclick="guardarNueva(${n.tmp})">${ICONO_CHECK}</button>
                    <button class="trans-mini borrar" title="Descartar" onclick="descartarNueva(${n.tmp})">${ICONO_EQUIS}</button>
                </div>
            </td>
        </tr>`;
}

// Lo que se lleva escrito en una fila de alta solo existe en el DOM. Antes de
// repintar hay que devolverlo al arreglo, o buscar algo en la tabla borraria
// una transportadora a medio escribir.
function sincronizarNuevas() {
    transNuevas.forEach(n => {
        const fila = document.querySelector(`tr[data-nueva="${n.tmp}"]`);
        if (!fila) return;
        n.nombre = fila.querySelector('.trans-inp.nombre').value;
        n.urlRastreo = fila.querySelector('.trans-inp.url').value;
    });
}

function cuerpoTransportadoras() {
    const filas = transFiltradas().map(filaTransportadora).join('') +
                  transNuevas.map(filaNuevaTransportadora).join('');
    // Las filas de alta se muestran siempre, con filtro o sin el: esconder una
    // que se esta escribiendo seria perder lo escrito.
    if (filas) return filas;
    return `<tr class="ped-sinres"><td colspan="3">Ninguna transportadora coincide con “${escapeHtml(transQuery)}”</td></tr>`;
}

// Al teclear se repinta SOLO el cuerpo: repintar el panel entero destruiria el
// buscador y se perderia el foco en cada letra.
function filtrarTransportadoras(v) {
    sincronizarNuevas();
    transQuery = v;
    const tbody = document.querySelector('#transPanel table.trans tbody');
    if (!tbody) return;
    tbody.innerHTML = cuerpoTransportadoras();
    const cont = document.getElementById('transCount');
    if (cont) {
        cont.textContent = transQuery.trim()
            ? transFiltradas().length + ' de ' + (transList || []).length : '';
    }
}

async function renderTransportadoras(opts = {}) {
    const panel = document.getElementById('transPanel');
    // Aqui tambien, y no solo en el buscador: el refresco automatico de cada 5
    // minutos entra por renderCurrentView() y repintaria encima de una fila de
    // alta a medio escribir.
    sincronizarNuevas();

    if (!transList) {
        panel.innerHTML = '<div class="ped-vacio"><div class="spinner"></div><p>Cargando transportadoras…</p></div>';
        try {
            const d = await fetchAPI('transportadoras');
            if (!Array.isArray(d)) throw new Error((d && d.error) || 'respuesta inesperada del servidor');
            transList = d;
        } catch (err) {
            panel.innerHTML = `<div class="ped-vacio"><p>No se pudieron cargar las transportadoras.<br>
                <b>${escapeHtml(err.message)}</b></p></div>`;
            return;
        }
        if (currentView !== 'transportadoras') return;   // cambiaron de vista mientras cargaba
    }

    const visibles = transFiltradas();
    const vacio = !transList.length && !transNuevas.length;

    panel.innerHTML = `
        <div class="ped-head">
            <div>
                <h2>Transportadoras</h2>
                <div class="sub">
                    ${transList.length} ${transList.length === 1 ? 'transportadora' : 'transportadoras'}
                    con página de rastreo
                </div>
            </div>
            <div class="ped-actions">
                <div class="ped-search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
                    </svg>
                    <input type="text" id="transSearch" autocomplete="off"
                           placeholder="Buscar transportadora"
                           value="${escapeAttr(transQuery)}"
                           oninput="filtrarTransportadoras(this.value)">
                    <span class="ped-count" id="transCount">${transQuery.trim()
                        ? visibles.length + ' de ' + transList.length : ''}</span>
                </div>
                <button class="btn primary" onclick="agregarTransportadora()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                         stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
                    Agregar transportadora
                </button>
            </div>
        </div>

        <div class="ped-wrap">
            ${vacio ? `<div class="ped-vacio"><p>Todavía no hay transportadoras.<br>
                Usa «Agregar transportadora» para crear la primera.</p></div>` : `
            <div class="ped-scroll">
                <table class="ped trans">
                    <thead>
                        <tr>
                            <th class="col-nombre">Transportadora</th>
                            <th>URL de rastreo</th>
                            <th class="col-acciones">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>${cuerpoTransportadoras()}</tbody>
                </table>
            </div>`}
        </div>

        <p class="trans-nota">
            Escribe la URL con <code>{guia}</code> donde va el número de guía — por ejemplo
            <code>https://www.tcc.com/rastreo?guia={guia}</code>. Es el mismo convenio que usa el
            aviso de despacho, así que el día que un pedido salga por otra transportadora la URL
            ya queda lista. Si la página no recibe la guía por la URL, déjala sin el marcador y
            se abrirá tal cual.
        </p>`;
}

function agregarTransportadora() {
    sincronizarNuevas();
    const tmp = ++transSeq;
    transNuevas.push({ tmp, nombre: '', urlRastreo: '' });
    renderTransportadoras().then(() => {
        // La fila se agrega para escribir en ella: el foco va al nombre.
        const inp = document.querySelector(`tr[data-nueva="${tmp}"] .trans-inp.nombre`);
        if (inp) inp.focus();
    });
}

async function postTransportadora(cuerpo) {
    const r = await fetch('/api/transportadoras/guardar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cuerpo)
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'el servidor respondió ' + r.status);
    return d;
}

async function guardarNueva(tmp) {
    sincronizarNuevas();
    const n = transNuevas.find(x => x.tmp === tmp);
    if (!n) return;

    const nombre = (n.nombre || '').trim();
    const urlRastreo = (n.urlRastreo || '').trim();
    if (!nombre || !urlRastreo) {
        showToast('Escribe el nombre y la URL de rastreo');
        return;
    }

    try {
        const d = await postTransportadora({ nombre, urlRastreo });
        transList.push(d.transportadora);
        // Mismo orden que trae el servidor, para que no salte de sitio al recargar.
        transList.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
        transNuevas = transNuevas.filter(x => x.tmp !== tmp);
        await renderTransportadoras();
        showToast(d.transportadora.nombre + ' agregada');
    } catch (err) {
        showToast('No se pudo agregar: ' + err.message);
    }
}

function descartarNueva(tmp) {
    sincronizarNuevas();
    const n = transNuevas.find(x => x.tmp === tmp);
    // Solo se pregunta si hay algo escrito que perder.
    if (n && (n.nombre.trim() || n.urlRastreo.trim()) &&
        !confirm('¿Descartar esta transportadora sin guardar?')) return;
    transNuevas = transNuevas.filter(x => x.tmp !== tmp);
    renderTransportadoras();
}

async function guardarTransportadora(id, campo, el) {
    const t = (transList || []).find(x => x.id === id);
    const valor = el.value.trim();
    if (t && (t[campo] || '') === valor) return;   // no cambió nada

    try {
        const d = await postTransportadora({ id, [campo]: valor });
        if (t) Object.assign(t, d.transportadora);
        // Se muestra lo que quedó en la base, no lo que se tecleó.
        el.value = d.transportadora[campo] || '';
        el.classList.add('guardado');
        setTimeout(() => el.classList.remove('guardado'), 1200);
    } catch (err) {
        // Se devuelve a lo último guardado: dejar en pantalla un valor que la
        // base rechazó haría creer que quedó puesto.
        if (t) el.value = t[campo] || '';
        el.classList.add('error');
        setTimeout(() => el.classList.remove('error'), 1600);
        showToast('No se pudo guardar: ' + err.message);
    }
}

// Abre lo que está GUARDADO, no lo que hay en el input: así el botón comprueba
// la URL que de verdad quedó en la base.
function abrirRastreo(id) {
    const t = (transList || []).find(x => x.id === id);
    if (!t || !t.urlRastreo) return;
    window.open(urlConGuia(t.urlRastreo, GUIA_EJEMPLO), '_blank', 'noopener');
}

async function eliminarTransportadora(id) {
    const t = (transList || []).find(x => x.id === id);
    if (!t) return;
    if (!confirm('¿Eliminar “' + t.nombre + '” del directorio?')) return;

    try {
        const r = await fetch('/api/transportadoras/eliminar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'el servidor respondió ' + r.status);

        transList = transList.filter(x => x.id !== id);
        sincronizarNuevas();
        await renderTransportadoras();
        showToast(t.nombre + ' eliminada');
    } catch (err) {
        showToast('No se pudo eliminar: ' + err.message);
    }
}

/* ======================================================================
   AGENDA DE CONTACTOS
   ====================================================================== */
/* --- Pipeline ----------------------------------------------------------
   El embudo de venta, en tablero de arrastrar y soltar.

   No tiene fuente de datos propia: se arma con las MISMAS sesiones que ya
   trajo /api/sessions para la bandeja, que desde ahora vienen con su campo
   `pipeline`. De ahi salen tres cosas gratis: una conversacion nueva aparece
   en "Sin asignar" por el solo hecho de existir, el refresco de cada cinco
   minutos tambien refresca el tablero, y no hay un segundo cache que se pueda
   desincronizar con el de la bandeja.

   Las etapas las manda el servidor (/api/pipeline/etapas) y no estan escritas
   aqui: son las mismas con las que /api/pipeline/mover valida, asi que no
   pueden desincronizarse. Lo unico que el tablero pone de su lado es el color
   de cada etapa, que vive en el CSS por clave.                             */

let plEtapas = null;          // catalogo del servidor, en orden de columnas
let plQuery = '';
let plCanal = 'all';          // 'all' | 'whatsapp' | 'web'
let plAbiertos = {};          // carriles terminales desplegados, por clave
// Tarjeta en vuelo. Mientras haya una, el tablero no se repinta: repintar en
// mitad de un arrastre le quita al navegador el nodo que esta moviendo y el
// drop no llega a ocurrir.
let plArrastrando = null;
let plMenuTarjeta = null;     // { id, col } de la tarjeta con el menu abierto

// Cuantas tarjetas cerradas se listan al desplegar un carril. Son historico:
// crecen para siempre y nadie revisa mas alla de las ultimas.
const PL_TOPE_CERRADAS = 30;

function plEtapa(clave) {
    return (plEtapas || []).find(e => e.clave === clave) || null;
}

// La etapa de una conversacion. Un chat sin `pipeline` y uno en `sin_asignar`
// son lo mismo, igual que en el servidor: por eso nada tiene que ingestarse.
function plEtapaDe(s) {
    return (s && s.pipeline && s.pipeline.etapa) || 'sin_asignar';
}

/* Las conversaciones que el tablero considera suyas, de los dos canales.

   Lo archivado SIN etapa no entra: son conversaciones que ya se cerraron a
   mano, y meterlas llenaria "Sin asignar" de ruido el primer dia. Lo
   archivado CON etapa si entra, con su marca: una venta en produccion no
   puede desaparecer del embudo porque alguien archivo el chat. Archivar y el
   pipeline son dos banderas distintas y ninguna manda sobre la otra.      */
function plBase() {
    return Object.keys(sessionsByCol)
        .flatMap(col => sessionsByCol[col] || [])
        .filter(s => !(s.archived && plEtapaDe(s) === 'sin_asignar'));
}

function plTarjetas() {
    const base = porCanal(plBase(), plCanal);
    const q = plQuery.trim().toLowerCase();
    if (!q) return base;
    return base.filter(s => [s.name, s.sessionId, s.lastMessage, s.pipeline && s.pipeline.nota]
        .some(v => v && String(v).toLowerCase().includes(q)));
}

function plDeEtapa(lista, clave) {
    return lista.filter(s => plEtapaDe(s) === clave);
}

// Conversaciones que nadie ha clasificado. Es el pendiente propio del tablero
// y enciende el punto del rail, igual que los mensajes sin leer en la bandeja.
function plSinAsignar() {
    return plDeEtapa(plBase(), 'sin_asignar').length;
}

function plCerradas() {
    return plBase().filter(s => { const e = plEtapa(plEtapaDe(s)); return e && e.terminal; }).length;
}

/* --- Pintado ----------------------------------------------------------- */

async function renderPipeline(opts = {}) {
    const panel = document.getElementById('pipelinePanel');
    if (plArrastrando) return;   // ver el comentario de plArrastrando

    if (!plEtapas) {
        panel.innerHTML = '<div class="pl-vacio"><div class="spinner"></div><p>Cargando el tablero…</p></div>';
        try {
            const d = await fetchAPI('pipeline/etapas');
            if (!Array.isArray(d) || !d.length) {
                throw new Error((d && d.error) || 'respuesta inesperada del servidor');
            }
            plEtapas = d;
        } catch (err) {
            panel.innerHTML = `<div class="pl-vacio"><p>No se pudo cargar el tablero.<br>
                <b>${escapeHtml(err.message)}</b></p></div>`;
            return;
        }
        if (currentView !== 'pipeline') return;   // cambiaron de vista mientras cargaba
    }

    updateCounters();

    panel.innerHTML = `
        <div class="ped-head">
            <div>
                <h2>Pipeline</h2>
                <div class="sub" id="plSub">${plResumen()}</div>
            </div>
            <div class="ped-actions">
                <div class="ped-search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
                    </svg>
                    <input type="text" id="plSearch" autocomplete="off"
                           placeholder="Buscar cliente o nota"
                           value="${escapeAttr(plQuery)}"
                           oninput="plFiltrar(this.value)">
                    <span class="ped-count" id="plCount"></span>
                </div>
                <button class="pl-chip ${plCanal === 'all' ? 'on' : ''}" data-ch="all"
                        onclick="plSetCanal(this)">Todos</button>
                <button class="pl-chip ${plCanal === 'whatsapp' ? 'on' : ''}" data-ch="whatsapp"
                        onclick="plSetCanal(this)">WhatsApp</button>
                <button class="pl-chip ${plCanal === 'web' ? 'on' : ''}" data-ch="web"
                        onclick="plSetCanal(this)">Web</button>
            </div>
        </div>
        <div class="pl-board" id="plBoard">${plTableroHTML()}</div>`;
}

// Repinta solo el tablero y los contadores. El repintado completo recrea el
// buscador y le quita el foco a media palabra.
function plPintarTablero() {
    const board = document.getElementById('plBoard');
    if (!board || plArrastrando) return;
    board.innerHTML = plTableroHTML();
    const sub = document.getElementById('plSub');
    if (sub) sub.innerHTML = plResumen();
    const cont = document.getElementById('plCount');
    if (cont) cont.textContent = plQuery.trim() ? plTarjetas().length + ' de ' + plBase().length : '';
    updateCounters();
}

function plResumen() {
    const sin = plSinAsignar();
    const total = plBase().length - plCerradas();
    const cerradas = plCerradas();
    return `${total} ${total === 1 ? 'conversación activa' : 'conversaciones activas'}` +
           (sin ? ` · <b>${sin} sin asignar</b>` : '') +
           (cerradas ? ` · ${cerradas} ${cerradas === 1 ? 'cerrada' : 'cerradas'}` : '');
}

function plTableroHTML() {
    const lista = plTarjetas();
    const activas = (plEtapas || []).filter(e => !e.terminal);
    const terminales = (plEtapas || []).filter(e => e.terminal);
    // El lado lo decide el servidor y no una clave escrita aqui: el que se
    // pierde sale por la izquierda, el que se gana por la derecha.
    const izq = terminales.filter(e => e.lado === 'izquierda');
    const der = terminales.filter(e => e.lado !== 'izquierda');

    return izq.map(e => plCarrilHTML(e, lista)).join('') +
           activas.map(e => plColumnaHTML(e, plDeEtapa(lista, e.clave))).join('') +
           der.map(e => plCarrilHTML(e, lista)).join('');
}

// Mas reciente arriba: el cliente que acaba de escribir es el que hay que
// atender, no el que lleva mas tiempo en la columna.
function plOrdenar(cards) {
    return cards.slice().sort((a, b) =>
        new Date(b.lastSeen || b.startedAt || 0) - new Date(a.lastSeen || a.startedAt || 0));
}

const PL_DROP = etapa => `ondragover="plSobre(event,this)" ondragleave="plFuera(event,this)" ` +
                         `ondrop="plSoltar(event,'${etapa}')"`;

function plColumnaHTML(etapa, cards) {
    const orden = plOrdenar(cards);
    return `
    <section class="pl-col" data-etapa="${etapa.clave}" ${PL_DROP(etapa.clave)}>
        <header class="pl-col-head" title="${escapeAttr(etapa.descripcion || '')}">
            <div class="pl-bar"></div>
            <div class="pl-col-tit">${escapeHtml(etapa.nombre)}<span class="pl-col-n">${orden.length}</span></div>
        </header>
        <div class="pl-col-body scroll">
            ${orden.length ? orden.map(plTarjetaHTML).join('') : `
                <div class="pl-vacia">${etapa.clave === 'sin_asignar'
                    ? 'Nada sin asignar.<br>Todo lo que entre cae aquí.'
                    : 'Arrastra una tarjeta hasta aquí.'}</div>`}
        </div>
    </section>`;
}

const PL_ICONO_CERRAR = {
    despachado: '<path d="M4 12.5l5 5 11-11"/>',
    desiste: '<circle cx="12" cy="12" r="8.5"/><path d="M6.2 6.2l11.6 11.6"/>'
};

// Un carril terminal: plegado es una franja estrecha que acepta el drop;
// desplegado se comporta como una columna mas para poder reabrir una tarjeta.
function plCarrilHTML(etapa, lista) {
    const cards = plOrdenar(plDeEtapa(lista, etapa.clave));
    const icono = PL_ICONO_CERRAR[etapa.clave] || '<circle cx="12" cy="12" r="8.5"/>';

    if (!plAbiertos[etapa.clave]) {
        return `
        <div class="pl-lane" data-etapa="${etapa.clave}" ${PL_DROP(etapa.clave)}
             onclick="plToggleCarril('${etapa.clave}')"
             title="${escapeAttr(etapa.descripcion || '')} — clic para ver las tarjetas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">${icono}</svg>
            <div class="pl-lane-tit">${escapeHtml(etapa.nombre)}</div>
            <div class="pl-lane-n">${cards.length}</div>
        </div>`;
    }

    const visibles = cards.slice(0, PL_TOPE_CERRADAS);
    return `
    <section class="pl-col cerrada" data-etapa="${etapa.clave}" ${PL_DROP(etapa.clave)}>
        <header class="pl-col-head" style="cursor:pointer" onclick="plToggleCarril('${etapa.clave}')"
                title="Plegar">
            <div class="pl-bar"></div>
            <div class="pl-col-tit">${escapeHtml(etapa.nombre)}<span class="pl-col-n">${cards.length}</span></div>
        </header>
        <div class="pl-col-body scroll">
            ${visibles.length ? visibles.map(plTarjetaHTML).join('') : `
                <div class="pl-vacia">Todavía no hay nada cerrado aquí.</div>`}
            ${cards.length > visibles.length
                ? `<div class="pl-vacia">y ${cards.length - visibles.length} más, más antiguas</div>` : ''}
        </div>
    </section>`;
}

function plTarjetaHTML(s) {
    const isWeb = s.collection === 'wa_chats_web';
    const p = s.pipeline || {};
    const sub = contactIdentifier(s, isWeb);
    const nuevos = unreadCount(s);
    return `
    <article class="pl-card" draggable="true" data-id="${s.id}"
             ondragstart="plDragStart(event,'${s.id}','${s.collection}')"
             ondragend="plDragEnd()"
             onclick="plAbrirChat('${s.id}','${s.collection}')"
             title="Abrir la conversación">
        <div class="pl-card-top">
            <div class="session-avatar ${isWeb ? 'web' : ''}">${escapeHtml(getInitials(s.name || s.sessionId))}</div>
            <div class="pl-card-id">
                <div class="pl-card-nom">${escapeHtml(sessionLabel(s, isWeb))}</div>
                ${sub ? `<div class="pl-card-sub">${escapeHtml(sub)}</div>` : ''}
            </div>
            <button class="pl-mas" onclick="plAbrirMenu(event,'${s.id}','${s.collection}')"
                    title="Mover o anotar" aria-label="Mover o anotar">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
                    <circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/>
                </svg>
            </button>
        </div>
        <div class="pl-card-msg">${s.lastType === 'ai' ? '<b>Bot:</b> ' : ''}${escapeHtml(truncate(s.lastMessage, 90))}</div>
        ${p.nota ? `<div class="pl-nota">${escapeHtml(p.nota)}</div>` : ''}
        <div class="pl-card-pie">
            <span class="pl-tag ${isWeb ? 'web' : 'wa'}">${isWeb ? 'Web' : 'WA'}</span>
            ${s.mode === 'manual' ? '<span class="pl-tag manual">Manual</span>' : ''}
            ${s.archived ? '<span class="pl-tag arch">Archivada</span>' : ''}
            <span title="Último mensaje: ${escapeAttr(formatFullDate(s.lastSeen || s.startedAt))}">${formatDate(s.lastSeen || s.startedAt)}</span>
            ${plEdadHTML(p.desde)}
            ${nuevos ? `<span class="pl-nuevos" title="mensajes sin leer">${nuevos}</span>` : ''}
        </div>
    </article>`;
}

// Cuanto lleva la tarjeta parada en su etapa: la pregunta que se le hace a un
// embudo. A partir de una semana se enciende, porque eso ya es un olvido.
function plEdadHTML(desde) {
    if (!desde) return '';
    const dias = Math.floor((Date.now() - new Date(desde).getTime()) / 86400000);
    if (!Number.isFinite(dias) || dias < 0) return '';
    const txt = dias === 0 ? 'hoy' : dias === 1 ? '1 día aquí' : dias + ' días aquí';
    return `<span class="sep">·</span><span class="pl-edad${dias >= 7 ? ' viejo' : ''}"
        title="En esta etapa desde ${escapeAttr(formatFullDate(desde))}">${txt}</span>`;
}

/* --- Filtros ----------------------------------------------------------- */

function plFiltrar(v) {
    plQuery = v;
    plPintarTablero();
}

function plSetCanal(el) {
    plCanal = el.dataset.ch;
    document.querySelectorAll('#pipelinePanel .pl-chip').forEach(c => c.classList.toggle('on', c === el));
    plPintarTablero();
}

function plToggleCarril(clave) {
    plAbiertos[clave] = !plAbiertos[clave];
    plPintarTablero();
}

/* --- Arrastrar y soltar ------------------------------------------------
   DnD nativo del navegador, sin libreria: el panel no tiene build. El precio
   es que en pantallas tactiles no existe, y por eso el menu de la tarjeta
   ofrece lo mismo con un toque.                                           */

function plDragStart(ev, id, col) {
    plArrastrando = { id, col };
    ev.dataTransfer.effectAllowed = 'move';
    // Firefox no inicia el arrastre si no hay datos en el portapapeles.
    try { ev.dataTransfer.setData('text/plain', id); } catch {}
    const card = ev.currentTarget;
    // En el mismo tick, la miniatura que captura el navegador saldria ya
    // translucida; en el siguiente, solo se apaga la tarjeta de origen.
    setTimeout(() => card.classList.add('arrastrando'), 0);
}

function plLimpiarArrastre() {
    plArrastrando = null;
    document.querySelectorAll('.pl-col.sobre, .pl-lane.sobre').forEach(e => e.classList.remove('sobre'));
    document.querySelectorAll('.pl-card.arrastrando').forEach(e => e.classList.remove('arrastrando'));
}

function plDragEnd() { plLimpiarArrastre(); }

function plSobre(ev, el) {
    if (!plArrastrando) return;
    ev.preventDefault();               // sin esto el navegador no permite soltar
    ev.dataTransfer.dropEffect = 'move';
    el.classList.add('sobre');
}

function plFuera(ev, el) {
    // Pasar por encima de una tarjeta hija dispara dragleave en la columna; sin
    // esta comprobacion el resaltado parpadea todo el recorrido.
    if (!el.contains(ev.relatedTarget)) el.classList.remove('sobre');
}

function plSoltar(ev, etapa) {
    ev.preventDefault();
    const t = plArrastrando;
    // Se limpia ANTES de mover: mover repinta el tablero, y si el nodo que se
    // esta arrastrando desaparece antes de tiempo el dragend no llega nunca y
    // el tablero se queda congelado.
    plLimpiarArrastre();
    if (t) plMover(t.id, t.col, etapa);
}

/* --- Mover y anotar ---------------------------------------------------- */

async function plPost(ruta, cuerpo) {
    const r = await fetch('/api/pipeline/' + ruta, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cuerpo)
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'el servidor respondió ' + r.status);
    return d;
}

/* Mueve la tarjeta de etapa.

   Es optimista: la tarjeta salta de columna antes de que conteste el servidor
   y vuelve a su sitio si la escritura falla. Esperar la respuesta en la accion
   que mas se repite hace que el tablero se sienta pegajoso, y aqui el riesgo
   es bajo: lo unico que se pierde ante un fallo es el movimiento, que queda
   deshecho a la vista con un aviso.                                        */
async function plMover(id, col, etapa, opts = {}) {
    const s = findSession(id);
    const destino = plEtapa(etapa);
    if (!s || !destino) return;

    const previo = s.pipeline || { etapa: 'sin_asignar', desde: null, nota: null, cerradoEn: null };
    if (previo.etapa === etapa) return;

    const ahora = new Date().toISOString();
    s.pipeline = {
        etapa,
        desde: ahora,
        nota: previo.nota || null,
        cerradoEn: destino.terminal ? ahora : null
    };
    plPintarTablero();

    try {
        await plPost('mover', { collection: col, id, etapa });
    } catch (err) {
        s.pipeline = previo;
        plPintarTablero();
        showToast('No se pudo mover: ' + err.message);
        return;
    }

    const quien = sessionLabel(s, col === 'wa_chats_web');
    if (opts.deshaciendo) {
        showToast(quien + ' vuelve a ' + destino.nombre);
    } else if (destino.terminal) {
        // Cerrar saca la tarjeta del tablero: hay que poder desandarlo sin
        // tener que ir a buscarla al carril.
        showToast(quien + ' · ' + destino.nombre + ', fuera del tablero',
            { texto: 'Deshacer', fn: () => plMover(id, col, previo.etapa, { deshaciendo: true }) });
    } else {
        showToast(quien + ' → ' + destino.nombre);
    }
}

/* --- Menu de la tarjeta ------------------------------------------------ */

function plAbrirMenu(ev, id, col) {
    ev.stopPropagation();     // el clic en la tarjeta abre la conversacion
    const s = findSession(id);
    if (!s || !plEtapas) return;

    plMenuTarjeta = { id, col };
    const actual = plEtapaDe(s);
    const menu = document.getElementById('plMenu');

    menu.innerHTML = `
        <h4>Mover a</h4>
        ${plEtapas.map(e => `
            <button class="pl-op ${e.clave === actual ? 'actual' : ''}" data-etapa="${e.clave}"
                    onclick="plMoverDesdeMenu('${e.clave}')"
                    title="${escapeAttr(e.descripcion || '')}">
                <i></i>${escapeHtml(e.nombre)}
            </button>`).join('')}
        <hr>
        <h4>Nota</h4>
        <input class="pl-nota-inp" id="plNotaInp" maxlength="280"
               placeholder="Qué se está esperando…"
               value="${escapeAttr((s.pipeline && s.pipeline.nota) || '')}"
               onkeydown="if(event.key==='Enter'){event.preventDefault();plSalirMenu();}">
        <hr>
        <button class="pl-op" onclick="plAbrirChatDesdeMenu()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 20.5l1.5-4.9A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/>
            </svg>
            Abrir la conversación
        </button>`;

    menu.classList.add('show');

    // Se ancla al boton y se mete a la fuerza dentro de la ventana: las
    // columnas de los extremos y las tarjetas del fondo lo dejarian cortado.
    const r = ev.currentTarget.getBoundingClientRect();
    const ancho = menu.offsetWidth;
    const alto = menu.offsetHeight;
    const left = Math.max(10, Math.min(r.right - ancho, window.innerWidth - ancho - 10));
    const abajo = r.bottom + 6;
    const top = abajo + alto > window.innerHeight - 10
        ? Math.max(10, r.top - alto - 6)
        : abajo;
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
}

function plCerrarMenu() {
    plMenuTarjeta = null;
    document.getElementById('plMenu').classList.remove('show');
}

// Salida normal del menu: guarda la nota si cambio y cierra. La nota no tiene
// boton de guardar a proposito — un campo de una linea con boton propio dentro
// de un menu es una trampa: se escribe, se cierra y se pierde.
function plSalirMenu() {
    plGuardarNota();
    plCerrarMenu();
}

function plMoverDesdeMenu(etapa) {
    const t = plMenuTarjeta;
    plGuardarNota();
    plCerrarMenu();
    if (t) plMover(t.id, t.col, etapa);
}

function plAbrirChatDesdeMenu() {
    const t = plMenuTarjeta;
    plGuardarNota();
    plCerrarMenu();
    if (t) plAbrirChat(t.id, t.col);
}

// Guarda la nota solo si cambio. Tambien es optimista: la tarjeta la muestra
// enseguida y se revierte si el servidor la rechaza.
function plGuardarNota() {
    if (!plMenuTarjeta) return;
    const inp = document.getElementById('plNotaInp');
    if (!inp) return;
    const { id, col } = plMenuTarjeta;
    const s = findSession(id);
    if (!s) return;

    const previa = (s.pipeline && s.pipeline.nota) || '';
    const texto = inp.value.trim();
    if (texto === previa) return;

    s.pipeline = Object.assign({ etapa: 'sin_asignar', desde: null, cerradoEn: null },
        s.pipeline, { nota: texto || null });
    plPintarTablero();

    plPost('nota', { collection: col, id, nota: texto }).catch(err => {
        s.pipeline = Object.assign({}, s.pipeline, { nota: previa || null });
        plPintarTablero();
        showToast('No se pudo guardar la nota: ' + err.message);
    });
}

// Abre la conversacion en la vista donde de verdad esta (bandeja o
// archivados), igual que hace la agenda. Salir del tablero para leer y volver
// por el rail es preferible a montar el chat encima del tablero.
function plAbrirChat(id, col) {
    plCerrarMenu();
    openContactChat(id, col);
}

// Un clic fuera cierra el menu, guardando lo que se haya escrito. El boton que
// lo abre corta la propagacion, asi que abrirlo no lo cierra en el acto.
document.addEventListener('click', ev => {
    const menu = document.getElementById('plMenu');
    if (!menu || !menu.classList.contains('show')) return;
    if (!menu.contains(ev.target)) plSalirMenu();
});

/* --- Dashboard ---------------------------------------------------------
   Los indicadores. Todo viene de una sola ruta (/api/dashboard), que calcula
   en el servidor: hacer las cuentas aqui obligaria a bajar las conversaciones
   enteras al navegador y a mantener dos versiones de cada formula.

   Las graficas son SVG escrito a mano. No hay libreria a proposito: el panel
   no tiene build, y meter una desde un CDN seria la primera dependencia de un
   tercero en tiempo de ejecucion — con su riesgo de que el dia que el CDN
   falle, el dashboard se quede en blanco.

   Regla de la vista: cada tarjeta dice en su pie SOBRE QUE ventana esta
   calculada. Hay dos y no se pueden mezclar — lo que PASO en el periodo
   elegido (leads, conversion, ciclo) y lo que ES hoy (embudo, estancadas,
   pedidos) —; un numero de embudo rotulado como si fuera del mes seria un
   dato falso con aspecto de dato bueno.                                    */

let dashData = null;
let dashDias = 90;            // ventana del periodo; 0 = todo el historico
let dashGran = 'mes';         // granularidad de la grafica de leads
let dashCargadoEn = 0;
let dashCargando = false;

// Cada cuanto se vuelve a pedir al entrar a la vista. El refresco general del
// panel es de 5 minutos y estos numeros no cambian mas rapido que eso.
const DASH_FRESCO_MS = 2 * 60 * 1000;

const DASH_PERIODOS = [
    { dias: 30,  rotulo: '30 días' },
    { dias: 90,  rotulo: '90 días' },
    { dias: 365, rotulo: '12 meses' },
    { dias: 0,   rotulo: 'Todo' }
];

async function renderDash(opts = {}) {
    const panel = document.getElementById('dashPanel');
    const viejo = Date.now() - dashCargadoEn > DASH_FRESCO_MS;

    if (!dashData || viejo) {
        if (!dashData) {
            panel.innerHTML = '<div class="pl-vacio"><div class="spinner"></div><p>Calculando indicadores…</p></div>';
        }
        if (dashCargando) return;
        dashCargando = true;
        try {
            const d = await fetchAPI('dashboard', { dias: dashDias });
            if (!d || d.error) throw new Error((d && d.error) || 'respuesta inesperada del servidor');
            dashData = d;
            dashCargadoEn = Date.now();
        } catch (err) {
            // Con datos viejos en pantalla es mejor dejarlos y avisar que
            // vaciar la vista: unos numeros de hace dos minutos sirven, una
            // pantalla en blanco no.
            if (!dashData) {
                panel.innerHTML = `<div class="pl-vacio"><p>No se pudieron calcular los indicadores.<br>
                    <b>${escapeHtml(err.message)}</b></p></div>`;
                return;
            }
            showToast('No se pudo actualizar el dashboard: ' + err.message);
        } finally {
            dashCargando = false;
        }
        if (currentView !== 'dash') return;   // cambiaron de vista mientras cargaba
    }
    dashPintar();
}

function dashPintar() {
    const d = dashData;
    if (!d) return;
    document.getElementById('dashPanel').innerHTML = `
        <div class="ped-head">
            <div>
                <h2>Dashboard</h2>
                <div class="sub">${dashSubtitulo()}</div>
            </div>
            <div class="ped-actions">
                ${DASH_PERIODOS.map(p => `
                    <button class="pl-chip ${dashDias === p.dias ? 'on' : ''}" data-dias="${p.dias}"
                            onclick="dashSetDias(this)">${p.rotulo}</button>`).join('')}
            </div>
        </div>
        <div class="dash-grid">
            ${dashKpis(d)}
            ${dashLeads(d)}
            ${dashEmbudo(d)}
            ${dashCanal(d)}
            ${dashTiempos(d)}
            ${dashPedidos(d)}
            ${dashEstancadas(d)}
            ${dashOperacion(d)}
        </div>`;
}

function dashSubtitulo() {
    const p = DASH_PERIODOS.find(x => x.dias === dashDias);
    const cuando = dashCargadoEn ? ' · actualizado ' + formatTime(new Date(dashCargadoEn).toISOString()) : '';
    return (dashDias ? 'Últimos ' + (p ? p.rotulo.toLowerCase() : dashDias + ' días') : 'Todo el histórico') + cuando;
}

function dashSetDias(el) {
    dashDias = Number(el.dataset.dias);
    dashData = null;          // el periodo cambia las cuentas: hay que repedirlas
    dashCargadoEn = 0;
    renderDash();
}

function dashSetGran(el) {
    dashGran = el.dataset.gran;
    dashPintar();             // la serie ya esta en memoria, no se vuelve a pedir
}

/* --- Piezas sueltas ---------------------------------------------------- */

function dashDelta(v, sufijo = 'vs. periodo anterior') {
    if (v === null || v === undefined) {
        return `<span class="delta plano" title="No hay un periodo anterior con datos para comparar">—</span>`;
    }
    const clase = v > 0 ? 'sube' : v < 0 ? 'baja' : 'plano';
    const flecha = v > 0 ? '▲' : v < 0 ? '▼' : '=';
    return `<span class="delta ${clase}" title="${escapeAttr(sufijo)}">${flecha} ${v > 0 ? '+' : ''}${v}%</span>`;
}

function dashDias1(n) {
    if (n === null || n === undefined) return '—';
    if (n < 1) return Math.round(n * 24) + ' h';
    return (Math.round(n * 10) / 10) + ' d';
}

const MESES_CORTOS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

// Las fechas de la serie son cadenas 'YYYY-MM-DD' YA en hora de Colombia (el
// servidor las corrige antes de agrupar). Se parten a mano y no con new Date()
// porque `new Date('2026-08-11')` es medianoche UTC y en Bogota eso es el 10.
function dashPartes(iso) {
    const [a, m, d] = iso.split('-').map(Number);
    return { a, m, d };
}

/* Agrupa la serie diaria en dias, semanas o meses.

   La serie llega siempre completa —del primer lead a hoy— y el cambio de
   granularidad se resuelve aqui, sin volver al servidor. En "dia" se recortan
   los ultimos 45: mas barras que eso en el ancho de una tarjeta no se leen. */
function dashAgrupar(serie, gran) {
    if (gran === 'dia') {
        return serie.slice(-45).map(x => {
            const p = dashPartes(x.dia);
            return { k: x.dia, etiqueta: String(p.d), titulo: `${p.d} ${MESES_CORTOS[p.m - 1]}`, wa: x.wa, web: x.web };
        });
    }
    const cubos = new Map();
    for (const x of serie) {
        const p = dashPartes(x.dia);
        let k, etiqueta, titulo;
        if (gran === 'mes') {
            k = x.dia.slice(0, 7);
            etiqueta = MESES_CORTOS[p.m - 1];
            titulo = MESES_CORTOS[p.m - 1] + ' ' + p.a;
        } else {
            // Semana que empieza el lunes.
            const f = new Date(Date.UTC(p.a, p.m - 1, p.d));
            f.setUTCDate(f.getUTCDate() - ((f.getUTCDay() + 6) % 7));
            k = f.toISOString().slice(0, 10);
            etiqueta = f.getUTCDate() + ' ' + MESES_CORTOS[f.getUTCMonth()];
            titulo = 'semana del ' + etiqueta;
        }
        if (!cubos.has(k)) cubos.set(k, { k, etiqueta, titulo, wa: 0, web: 0 });
        const c = cubos.get(k);
        c.wa += x.wa; c.web += x.web;
    }
    return [...cubos.values()].sort((a, b) => a.k.localeCompare(b.k));
}

/* Barras verticales apiladas, en un sistema de coordenadas fijo de 520x190
   que el navegador escala al ancho de la tarjeta. El ancho de barra se adapta
   al numero de columnas y las etiquetas se saltean para que nunca se pisen:
   asi la misma funcion sirve para 2 meses y para 45 dias.                  */
function dashBarrasSVG(items) {
    const W = 520, H = 190, PB = 22, PT = 8, PL = 28;
    if (!items.length) return '<div class="dash-vacio">Todavía no hay leads que graficar.</div>';

    const max = Math.max(1, ...items.map(x => x.wa + x.web));
    const alto = H - PB - PT;
    const slot = (W - PL) / items.length;
    const bw = Math.max(3, Math.min(30, slot * 0.62));
    const paso = Math.ceil(items.length / 11);
    const y = v => PT + alto - (alto * v / max);

    // Tres lineas de referencia: 0, la mitad y el maximo. Mas rejilla en una
    // tarjeta de este tamano estorba mas de lo que ayuda.
    const marcas = [0, Math.round(max / 2), max].filter((v, i, a) => a.indexOf(v) === i);
    const rejilla = marcas.map(v => `
        <line class="eje" x1="${PL}" x2="${W}" y1="${y(v)}" y2="${y(v)}"></line>
        <text class="rot" x="${PL - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join('');

    const barras = items.map((x, i) => {
        const cx = PL + slot * i + (slot - bw) / 2;
        const total = x.wa + x.web;
        const hWa = alto * x.wa / max, hWeb = alto * x.web / max;
        const yWeb = y(total), yWa = y(x.wa);
        const rot = i % paso === 0
            ? `<text class="rot" x="${cx + bw / 2}" y="${H - 7}" text-anchor="middle">${escapeHtml(x.etiqueta)}</text>` : '';
        return `<g>
            <title>${escapeAttr(x.titulo)}: ${total} ${total === 1 ? 'lead' : 'leads'} · ${x.wa} WhatsApp, ${x.web} Web</title>
            ${total === 0
                ? `<rect class="barra-hueca" x="${cx}" y="${y(0) - 2}" width="${bw}" height="2" rx="1"></rect>`
                : `${x.web ? `<rect class="barra-web" x="${cx}" y="${yWeb}" width="${bw}" height="${hWeb}" rx="2"></rect>` : ''}
                   ${x.wa ? `<rect class="barra-wa" x="${cx}" y="${yWa}" width="${bw}" height="${hWa}" rx="2"></rect>` : ''}`}
            ${rot}
        </g>`;
    }).join('');

    return `<svg class="dash-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Leads por periodo">
        ${rejilla}${barras}
    </svg>`;
}

// Barras horizontales. `color` pinta --pl cuando la fila no corresponde a una
// etapa del pipeline (que ya trae el suyo por data-etapa desde el CSS).
function dashBarrasH(filas, opts = {}) {
    if (!filas.length) return '<div class="dash-vacio">Sin datos.</div>';
    const max = Math.max(1, ...filas.map(f => f.valor || 0));
    return filas.map(f => `
        <div class="barra-fila ${f.valor ? '' : 'apagada'}"
             ${f.clave ? `data-etapa="${f.clave}"` : ''}
             ${f.color ? `style="--pl:${f.color}"` : ''}>
            <div class="barra-rot"><i></i><span title="${escapeAttr(f.titulo || f.nombre)}">${escapeHtml(f.nombre)}</span></div>
            <div class="barra-val">${escapeHtml(f.texto !== undefined ? f.texto : String(f.valor))}${
                f.extra ? ` <em>${escapeHtml(f.extra)}</em>` : ''}</div>
            <div class="barra-pista"><div class="barra-llena" style="width:${(f.valor || 0) / max * 100}%"></div></div>
        </div>`).join('');
}

async function loadContactsAgenda() {
    const data = await fetchAPI('contacts/list');
    if (!Array.isArray(data)) {
        throw new Error((data && data.error) || 'respuesta inesperada del servidor');
    }
    contactsList = data;
    return data;
}

function contactChannelLabel(c) {
    if (c.channel === 'web') return 'Chat Web';
    if (c.channel === 'whatsapp') return 'WhatsApp';
    return 'Sin canal registrado';
}

/* --- Filtro por canal de la agenda -------------------------------------
   `channel` lo deduce el servidor de la coleccion donde esta la conversacion
   cuando el registro es viejo y no lo trae (ver /api/contacts/list). Aun asi
   puede quedar en null: un contacto sin conversacion asociada. Esos solo
   aparecen bajo "Todos" y bajo su propio chip, que se muestra unicamente si
   existe alguno.                                                          */
let contactChannel = 'all';   // 'all' | 'whatsapp' | 'web' | 'none'

// El canal de un contacto viene en `channel`; el de una conversacion se
// deduce de la coleccion en la que esta. Un solo repartidor sirve para las dos.
function canalDe(x) {
    if (x && x.channel !== undefined) return x.channel || null;
    return x && x.collection === 'wa_chats_web' ? 'web' : 'whatsapp';
}

function porCanal(lista, ch) {
    if (!Array.isArray(lista)) return [];
    if (ch === 'all') return lista;
    if (ch === 'none') return lista.filter(x => !canalDe(x));
    return lista.filter(x => canalDe(x) === ch);
}

function contactsByChannel(ch) {
    return porCanal(contactsList, ch);
}

/* --- Filtro de canal de los archivados --------------------------------- */
let archivedChannel = 'all';

function setArchivedChannel(el) {
    archivedChannel = el.dataset.ch;
    document.querySelectorAll('#archivedFilterBar .chip')
        .forEach(c => c.classList.toggle('on', c === el));
    renderArchived();
}

function updateArchivedFilterCounts() {
    const all = archivedAll();
    const set = (id, n) => { const e = document.getElementById(id); if (e) e.textContent = n; };
    set('arn-all', all.length);
    set('arn-whatsapp', porCanal(all, 'whatsapp').length);
    set('arn-web', porCanal(all, 'web').length);
}

function setContactChannel(el) {
    contactChannel = el.dataset.ch;
    document.querySelectorAll('#contactFilterBar .chip')
        .forEach(c => c.classList.toggle('on', c === el));
    renderContacts();
}

function updateContactFilterCounts() {
    const set = (id, n) => { const e = document.getElementById(id); if (e) e.textContent = n; };
    set('chn-all', contactsList ? contactsList.length : 0);
    set('chn-whatsapp', contactsByChannel('whatsapp').length);
    set('chn-web', contactsByChannel('web').length);

    // El chip de "sin canal" solo estorba si no hay ninguno.
    const sin = contactsByChannel('none').length;
    set('chn-none', sin);
    const btn = document.querySelector('#contactFilterBar .chip[data-ch="none"]');
    if (btn) btn.style.display = sin ? '' : 'none';
    // Si el filtro activo se queda sin registros tras un refresco, volver a
    // "Todos" en vez de dejar la agenda en blanco sin explicacion.
    if (!sin && contactChannel === 'none') resetContactChannel();
}

function resetContactChannel() {
    contactChannel = 'all';
    document.querySelectorAll('#contactFilterBar .chip')
        .forEach(c => c.classList.toggle('on', c.dataset.ch === 'all'));
}

// Lo mas util que se pueda mostrar bajo el nombre, en orden de preferencia.
function contactSubtitle(c) {
    if (c.phoneNumber) return '+' + c.phoneNumber;
    if (c.email) return c.email;
    if (c.username) return '@' + c.username;
    return formatSessionId(c.phone);
}

async function renderContacts(opts = {}) {
    const list = document.getElementById('sessionsList');

    if (!contactsList) {
        list.innerHTML = skeletonList();
        try {
            await loadContactsAgenda();
        } catch (err) {
            list.innerHTML = '<div class="loading"><p>Error: ' + escapeHtml(err.message) + '</p></div>';
            return;
        }
        // Pudieron cambiar de vista mientras cargaba.
        if (currentView !== 'contacts') return;
    }

    updateCounters();
    list.classList.toggle('no-anim', !!opts.quiet);

    if (!contactsList.length) {
        list.innerHTML = '<div class="loading"><p>Todavía no hay contactos.<br>' +
            'Se registran solos cuando un cliente escribe.</p></div>';
        return;
    }

    updateContactFilterCounts();

    // Primero el canal, luego la busqueda: asi el texto busca dentro de lo que
    // el filtro dejo a la vista, que es lo que el usuario esta viendo.
    const base = contactsByChannel(contactChannel);
    const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    const shown = !q ? base : base.filter(c =>
        [c.name, c.email, c.phoneNumber, c.username, c.phone]
            .some(v => v && String(v).toLowerCase().includes(q)));

    if (!shown.length) {
        const donde = contactChannel === 'whatsapp' ? ' de WhatsApp'
                    : contactChannel === 'web' ? ' del chat web'
                    : contactChannel === 'none' ? ' sin canal'
                    : '';
        list.innerHTML = '<div class="loading"><p>' + (q
            ? 'Ningún contacto' + donde + ' coincide con “' + escapeHtml(q) + '”'
            : 'No hay contactos' + donde + '.') + '</p></div>';
        return;
    }

    list.innerHTML = shown.map((c, i) => {
        const isWeb = c.channel === 'web';
        // Sin canal conocido no se puede afirmar que sea WhatsApp.
        const [chipCls, chipTxt] = isWeb ? ['web', 'Web']
                                 : c.channel === 'whatsapp' ? ['wa', 'WA']
                                 : ['none', '—'];
        const extras = [];
        if (c.chat) extras.push(c.chat.messageCount + ' mensajes');
        if (c.mediaCount) extras.push(c.mediaCount + (c.mediaCount === 1 ? ' archivo' : ' archivos'));
        return `
        <div class="session-item ${currentContact === c.id ? 'active' : ''}" data-contact="${c.id}"
             style="animation-delay:${Math.min(i * 22, 400)}ms" onclick="openContact('${c.id}')">
            <div class="session-avatar ${isWeb ? 'web' : ''}">${escapeHtml(getInitials(c.name || c.phoneNumber || c.phone))}</div>
            <div class="session-info">
                <div class="session-name">${escapeHtml(c.name || 'Sin nombre')}</div>
                <div class="session-contact">${escapeHtml(contactSubtitle(c))}</div>
                <div class="session-preview">${escapeHtml(extras.join('  ·  ') || 'Sin conversación')}</div>
            </div>
            <div class="session-meta">
                <div class="session-date">${formatDate(c.lastSeen || c.createdAt)}</div>
                <span class="row-chip ${chipCls}" title="${escapeAttr(contactChannelLabel(c))}">${chipTxt}</span>
            </div>
        </div>`;
    }).join('');
}

function openContact(id) {
    const c = (contactsList || []).find(x => x.id === id);
    if (!c) return;

    currentContact = id;
    currentSession = null;

    document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
    const row = document.querySelector(`.session-item[data-contact="${id}"]`);
    if (row) row.classList.add('active');

    const area = document.getElementById('chatArea');
    area.classList.remove('has-chat');
    area.classList.add('has-contact');
    document.body.classList.add('viewing-chat');

    const isWeb = c.channel === 'web';
    const wa = c.phoneNumber ? c.phoneNumber.replace(/^57/, '') : null;
    const campo = (k, v, cls) => `
        <div class="contact-field">

    document.getElementById('contactPanel').innerHTML = `
        <div class="contact-hero">
            <button class="icon-btn back-btn" onclick="closeSession()" aria-label="Volver">

                     stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="session-avatar ${isWeb ? 'web' : ''}">${escapeHtml(getInitials(c.name || c.phoneNumber || c.phone))}</div>
            <div>
                <h2>${escapeHtml(c.name || 'Sin nombre')}</h2>
                <div class="sub">
                    <span class="row-chip ${isWeb ? 'web' : 'wa'}">${isWeb ? 'Chat Web' : 'WhatsApp'}</span>
                    <span>${c.lastSeen ? 'Último mensaje ' + escapeHtml(formatFullDate(c.lastSeen))
                                       : 'Sin actividad registrada'}</span>
                </div>
            </div>
        </div>

        <div class="contact-card">
            ${campo('Nombre', c.name ? escapeHtml(c.name) : '')}
            ${campo('Celular', wa
                ? `<a href="https://wa.me/57${escapeAttr(wa)}" target="_blank" rel="noopener">+57 ${escapeHtml(wa)}</a>`
                : '')}
            ${campo('Correo', c.email
                ? `<a href="mailto:${escapeAttr(c.email)}">${escapeHtml(c.email)}</a>`
                : '')}
            ${campo('Usuario WhatsApp', c.username ? '@' + escapeHtml(c.username) : '')}
            ${campo('Canal', escapeHtml(contactChannelLabel(c)))}
            ${campo('Identidad de sesión', escapeHtml(c.phone), 'mono')}
            ${campo('Registrado', escapeHtml(formatFullDate(c.createdAt)))}
            ${campo('Archivos enviados', c.mediaCount
                ? c.mediaCount + (c.mediaCount === 1 ? ' archivo' : ' archivos') : '')}
        </div>

        <div class="contact-actions">
            ${c.chat ? `<button class="btn primary" onclick="openContactChat('${c.chat.id}','${c.chat.collection}')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 20.5l1.5-4.9A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/>
                </svg>
                Ver conversación (${c.chat.messageCount})
            </button>` : ''}
            ${wa ? `<a class="btn" href="https://wa.me/57${escapeAttr(wa)}" target="_blank" rel="noopener">Escribir por WhatsApp</a>` : ''}
            ${c.email ? `<a class="btn" href="mailto:${escapeAttr(c.email)}">Enviar correo</a>` : ''}
        </div>

        <p class="contact-note">
            <b>Identidad de sesión</b> es la llave con la que el bot guarda la conversación
            —${isWeb ? 'el identificador que genera el widget de la página'
                     : 'el número o el user_id que manda WhatsApp'}—, no un teléfono.
            El número real del cliente es el de <b>Celular</b>.
        </p>`;
}

// Abre la conversacion del contacto, saltando a la vista donde de verdad esta.
function openContactChat(chatId, col) {
    const s = findSession(chatId);
    const btn = s && s.archived
        ? document.querySelector('.rail-btn[data-view="archived"]')
        : document.querySelector(`.rail-btn[data-col="${col}"]`);
    if (btn) (s && s.archived ? switchView : switchTab)(btn);
    openSession(chatId, col);
}

async function openSession(docId, colOverride) {
    const known = findSession(docId);
    const col = colOverride || (known && known.collection) || currentCollection;
    currentSession = docId;
    currentSessionCol = col;
    currentContact = null;

    document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
    const active = document.querySelector(`.session-item[data-id="${docId}"]`);
    if (active) active.classList.add('active');

    const area = document.getElementById('chatArea');
    area.classList.remove('has-contact');
    area.classList.add('has-chat');
    document.body.classList.add('viewing-chat');

    const isWeb = col === 'wa_chats_web';
    const thread = document.getElementById('thread');
    thread.innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando conversación…</p></div>';
    document.getElementById('jumpBtn').classList.remove('show');

    try {
        const data = await fetchAPI('messages', { collection: col, id: docId });
        const messages = data.messages || [];
        updateArchiveBtn(!!data.archivedAt);
        updateChatControls(data);
        const contactName = data.name;
        const sessionId = data.sessionId;
        const info = { name: contactName, sessionId, username: data.username };
        const displayName = sessionLabel(info, isWeb);
        const handle = contactIdentifier(info, isWeb);

        const avatar = document.getElementById('chatAvatar');
        avatar.textContent = getInitials(contactName || sessionId);
        avatar.className = 'session-avatar' + (isWeb ? ' web' : '');
        document.getElementById('chatName').textContent = displayName;

        const chips = [];
        if (handle && handle !== displayName) chips.push(['accent', handle]);
        if (data.phoneNumber && data.phoneNumber !== handle) chips.push(['', 'Tel ' + data.phoneNumber]);
        if (data.email) chips.push(['', data.email]);
        chips.push(['', messages.length + ' mensajes']);
        if (data.startedAt) chips.push(['', 'Inicio ' + formatFullDate(data.startedAt)]);
        if (data.lastSeen) chips.push(['', 'Último ' + formatFullDate(data.lastSeen)]);
        document.getElementById('chatInfo').innerHTML = chips
            .map(([cls, text]) => `<span class="meta-chip ${cls}">${escapeHtml(text)}</span>`)
            .join('');

        const userLabel = contactName || (isWeb ? 'Visitante' : (handle || 'Cliente'));
        const media = data.media || [];
        let mediaIdx = 0;

        let html = '';
        if (data.startedAt) {
            html += `<div class="date-sep"><span>${escapeHtml(
                getDateLabel(data.startedAt) + ' · ' + formatTime(data.startedAt))}</span></div>`;
        }
        messages.forEach((m, i) => {
            const type = m.type || 'human';
            // Bot y asesor se guardan los dos como 'ai'; sentBy los separa.
            const esAsesor = m.sentBy === 'asesor';
            const label = type === 'ai' ? (esAsesor ? 'Asesor' : 'Bot KosXpress') : userLabel;
            let body, sello = '';
            if (type === 'human' && IMG_MARKER.test(m.content)) {
                // Every stored file produces exactly one marker message, so the
                // Nth marker is the Nth file. The chat memory has no timestamps,
                // so this ordering is the only link between the two collections.
                const file = media[mediaIdx++];
                body = renderMedia(file, m.content.replace(IMG_MARKER, ''));
                // El archivo si trae hora real; el mensaje de texto, no.
                if (file) sello = stampFor(file.receivedAt, data.startedAt);
            } else {
                body = formatMarkdown(m.content);
            }
            html += `
                <div class="msg ${type}${esAsesor ? ' asesor' : ''}" style="animation-delay:${Math.min(i * 26, 460)}ms">
                    <div class="msg-who">${escapeHtml(label)}</div>
                    <div class="msg-card">${body}</div>
                    ${sello ? `<div class="msg-time">${escapeHtml(sello)}</div>` : ''}
                </div>`;
        });

        // Files with no marker: images received before the bot logged them, or
        // a marker that got filtered out of the transcript.
        if (mediaIdx < media.length) {
            html += `<div class="date-sep"><span>Archivos sin ubicar</span></div>`;
            media.slice(mediaIdx).forEach(file => {
                const sello = stampFor(file.receivedAt, data.startedAt);
                html += `
                    <div class="msg human">
                        <div class="msg-who">${escapeHtml(userLabel)}</div>
                        <div class="msg-card">${renderMedia(file, '')}</div>
                        ${sello ? `<div class="msg-time">${escapeHtml(sello)}</div>` : ''}
                    </div>`;
            });
        }

        // Cierre del hilo. `lastSeen` es lo unico que dice cuando fue el ultimo
        // movimiento: la memoria del bot no guarda hora por mensaje.
        if (data.lastSeen) {
            html += `<div class="date-sep"><span>${escapeHtml(
                'Último mensaje · ' + getDateLabel(data.lastSeen) + ' · ' + formatTime(data.lastSeen)
            )}</span></div>`;
        }

        thread.innerHTML = html;
        const scroller = document.getElementById('chatScroll');
        scroller.scrollTop = scroller.scrollHeight;   // abre en lo mas reciente
        updateJumpBtn();

        // Leida. Se usa el conteo que acaba de devolver /api/messages, que es
        // el mismo filterMessages() de /api/sessions, y se refresca el cache
        // por si llegaron mensajes despues de cargar la lista.
        const cached = findSession(docId);
        if (cached) cached.messageCount = messages.length;
        markRead(cached || { id: docId, messageCount: messages.length });
        refreshRow(docId);
        updateCounters();
    } catch (err) {
        thread.innerHTML = '<div class="loading"><p>Error: ' + escapeHtml(err.message) + '</p></div>';
    }
}

    document.body.classList.remove('viewing-chat');

/* --- Volver a lo mas reciente ----------------------------------------- */
// Umbral en px: por debajo de esto se considera que ya estas en el final y el
// boton estorba.
const JUMP_THRESHOLD = 280;

function updateJumpBtn() {
    const sc = document.getElementById('chatScroll');
    const btn = document.getElementById('jumpBtn');
    if (!sc || !btn) return;
    const desdeElFinal = sc.scrollHeight - sc.scrollTop - sc.clientHeight;
    btn.classList.toggle('show', desdeElFinal > JUMP_THRESHOLD);
}

function scrollToLatest() {
    const sc = document.getElementById('chatScroll');
    if (sc) sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' });
}

function escapeHtml(text) {
    if (text === null || text === undefined || text === '') return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function escapeAttr(text) {
    return (text || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Resalta el termino buscado sobre texto ya escapado.
function highlight(text, q) {
    const safe = escapeHtml(truncate(text, 60));
    if (!q || !q.trim()) return safe;
    const needle = escapeHtml(q.trim()).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    try {
        return safe.replace(new RegExp(needle, 'gi'), m => `<mark>${m}</mark>`);
    } catch { return safe; }
}

// Written by "Parsear Imagen" in the n8n workflow. Changing the prefix there
// without changing it here silently turns the images back into plain text.
const IMG_MARKER = /^\[El cliente envió una imagen\]\s*/;

function formatBytes(n) {
    if (!n) return '';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function renderMedia(file, caption) {
    if (!file) {
        return `<span class="media-missing">Imagen no disponible</span>${
            caption ? '<br>' + formatMarkdown(caption) : ''}`;
    }
    const url = '/api/media/' + file.id;
    const cap = caption || file.caption || '';
    const meta = [formatBytes(file.sizeBytes), formatFullDate(file.receivedAt)]
        .filter(Boolean).join('  ·  ');
    const preview = (file.mimeType || '').startsWith('image/')
        ? `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${
            escapeAttr(cap || 'Arte enviado por el cliente')}" loading="lazy"></a>`
        : `<span class="media-missing">${escapeHtml(file.fileName || file.mimeType)}</span>`;

    return `
        <div class="msg-media">
            ${preview}
            <div class="media-bar">
                <span class="media-meta">${escapeHtml(meta)}</span>
                <a class="media-dl" href="${url}?download=1" download>Descargar</a>
            </div>
        </div>
        ${cap ? `<div class="msg-text">${formatMarkdown(cap)}</div>` : ''}
    `;
}

function formatMarkdown(text) {
    if (!text) return '';
    let html = escapeHtml(text);
    // Bold: **text**
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic: *text* (but not inside bold)
    html = html.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
    // Markdown tables. Las filas se acumulan aparte y se emiten como UN solo
    // bloque sin saltos de linea: si quedan "\n" entre <tr>, el paso final los
    // vuelve <br> dentro de la <table>, el navegador los expulsa fuera de ella
    // (foster parenting) y aparecen lineas en blanco sobre cada tabla.
    const lines = html.split('\n');
    let rows = null;
    const result = [];
    const closeTable = () => {
        if (!rows) return;
        // El wrapper .tbl le da su propio scroll horizontal a la tabla,
        // para que los catalogos anchos no desborden la conversacion.
        result.push('<div class="tbl"><table>' + rows.join('') + '</table></div>');
        rows = null;
    };
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith('|') && line.endsWith('|')) {
            // Skip separator rows (|---|---|)
            if (/^\|[\s\-:|]+\|$/.test(line)) continue;
            const cells = line.split('|').filter((_, idx, arr) => idx > 0 && idx < arr.length - 1).map(c => c.trim());
            if (!rows) {
                rows = ['<tr>' + cells.map(c => '<th>' + c + '</th>').join('') + '</tr>'];
            } else {
                rows.push('<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>');
            }
        } else {
            closeTable();
            result.push(line);
        }
    }
    closeTable();
    html = result.join('\n');
    // Line breaks
    html = html.replace(/\n/g, '<br>');
    // La tabla ya trae su propio margen; los <br> pegados a ella solo duplican
    // el espacio en blanco.
    html = html.replace(/(?:<br>\s*)+<div class="tbl">/g, '<div class="tbl">')
               .replace(/<\/table><\/div>(?:\s*<br>)+/g, '</table></div>');
    return html;
}

function setRailActive(el) {
