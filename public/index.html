        .anillo-sub { fill: var(--ink-muted); font-size: 6.5px; text-anchor: middle; font-family: var(--font); }
        .anillo-datos { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
        .anillo-dato { font-size: 12.5px; color: var(--ink-soft); }
        .anillo-dato b {
            display: block;
            font-size: 17px; font-weight: 600; color: var(--ink);
            font-variant-numeric: tabular-nums;
        }

        /* --- Lista de estancadas ----------------------------------------- */
        .dash-lista { display: flex; flex-direction: column; }
        .dash-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 6px;
            border-radius: 9px;
            cursor: pointer;
            transition: background .14s;
        }
        .dash-item:hover { background: var(--surface-2); }
        .dash-item + .dash-item { border-top: 1px solid var(--line); }
        .dash-item .session-avatar { width: 28px; height: 28px; border-radius: 9px; font-size: 10.5px; }
        .dash-item-id { min-width: 0; flex: 1; }
        .dash-item-nom {
            font-size: 13px; font-weight: 500; color: var(--ink);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .dash-item-sub { font-size: 11px; color: var(--ink-muted); display: flex; align-items: center; gap: 6px; }
        .dash-item-sub i { width: 7px; height: 7px; border-radius: 50%; background: var(--pl, var(--ink-muted)); }
        .dash-dias {
            font-family: var(--mono); font-size: 11.5px; font-weight: 600;
            color: var(--kos-orange-deep);
            background: color-mix(in srgb, var(--kos-orange) 13%, transparent);
            border-radius: 99px; padding: 2px 8px;
            white-space: nowrap;
        }

        /* --- Cuadricula de datos sueltos --------------------------------- */
        .mini-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
            gap: 12px 10px;
        }
        .mini-dato { min-width: 0; }
        .mini-dato b {
            display: block;
            font-size: 18px; font-weight: 600; color: var(--ink);
            font-variant-numeric: tabular-nums;
        }
        .mini-dato span { font-size: 11px; color: var(--ink-muted); line-height: 1.35; display: block; margin-top: 2px; }

        /* --- Avisos dentro de una tarjeta -------------------------------- */
        .dash-alertas { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
        .dash-alerta {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 11.5px; font-weight: 600;
            padding: 4px 10px; border-radius: 99px;
            border: 1px solid color-mix(in srgb, var(--kos-orange) 40%, transparent);
            background: color-mix(in srgb, var(--kos-orange) 11%, transparent);
            color: var(--kos-orange-deep);
        }
        .dash-alerta.ok {
            border-color: color-mix(in srgb, #12A66B 35%, transparent);
            background: color-mix(in srgb, #12A66B 11%, transparent);
            color: #0f8f5f;
        }
        .dash-alerta b { font-family: var(--mono); }

        /* Un bloque que no se pudo calcular NO se oculta: se dice por que. Un
           indicador ausente sin explicacion se lee como un cero. */
        .dash-roto {
            font-size: 12px; line-height: 1.55;
            color: var(--ink-muted);
            background: var(--surface-2);
            border: 1px dashed var(--line-strong);
            border-radius: var(--r-md);
            padding: 12px 13px;
        }
        .dash-roto b { color: var(--ink-soft); }
        .dash-roto code {
            font-family: var(--mono); font-size: 11px;
            word-break: break-word;
        }

        .dash-vacio {
            font-size: 12.5px; line-height: 1.55;
            color: var(--ink-muted);
            padding: 10px 2px;
        }

        .contact-note {
            margin-top: 22px;
            font-size: 12.5px; line-height: 1.6;
            color: var(--ink-muted);
            max-width: 660px;
        }

        /* ================================================================
           USUARIOS — quien entra y a que
           Tabla no: tarjetas. Los permisos son siete casillas por persona, y
           en una tabla eso son siete columnas que nadie lee de corrido; en
           una tarjeta se leen como lo que son, la lista de lo que esa
           persona puede abrir.
           ================================================================ */
        body.view-usuarios .sidebar { display: none; }
        .chat-area.has-usuarios .usuarios-panel { display: block; }
        .chat-area.has-usuarios .empty-state { display: none; }

        .usuarios-panel {
            display: none;
            position: relative; z-index: 2;
            flex: 1;
            overflow: auto;
            padding: 28px 30px 40px;
        }

        .usr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 14px;
        }

        .usr-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-sm);
            padding: 16px 17px 14px;
            display: flex; flex-direction: column;
            transition: border-color .15s, opacity .15s;
        }
        .usr-card.inactivo { opacity: .62; }
        .usr-card.inactivo .usr-nombre { text-decoration: line-through; }
        /* La propia tarjeta se marca: es la unica en la que hay casillas que el
           servidor va a rechazar, y verlo antes evita el clic inutil. */
        .usr-card.yo { border-color: var(--kos-blue-soft); }
        .usr-card.nueva { border-style: dashed; border-color: var(--kos-blue); }

        .usr-top { display: flex; align-items: center; gap: 11px; }
        .usr-ini {
            width: 38px; height: 38px; flex-shrink: 0;
            border-radius: 12px;
            display: grid; place-items: center;
            background: var(--grad-blue);
            color: #fff;
            font-size: 13px; font-weight: 700; letter-spacing: .3px;
        }
        .usr-card.inactivo .usr-ini { background: var(--line-strong); color: var(--ink-muted); }
        .usr-id { min-width: 0; flex: 1; }
        .usr-nombre {
            font-size: 15px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .usr-sub {
            font-size: 12px; color: var(--ink-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .usr-sub b { font-family: var(--mono); font-weight: 500; color: var(--ink-soft); }

        .usr-yo-pin {
            font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .5px;
            color: var(--kos-blue-deep);
            background: rgba(0,159,227,.12);
            padding: 3px 7px; border-radius: 99px;
            flex-shrink: 0;
        }

        /* Interruptor de activo. Es el unico control de la tarjeta que apaga a
           la persona entera, asi que no se disfraza de casilla. */
        .usr-sw {
            position: relative;
            width: 40px; height: 22px; flex-shrink: 0;
            border-radius: 99px;
            border: 1px solid var(--line-strong);
            background: var(--surface-2);
            cursor: pointer;
            transition: background .18s, border-color .18s;
        }
        .usr-sw::after {
            content: '';
            position: absolute; top: 2px; left: 2px;
            width: 16px; height: 16px;
            border-radius: 50%;
            background: var(--ink-muted);
            transition: transform .18s, background .18s;
        }
        .usr-sw.on { background: rgba(18,166,107,.18); border-color: #12A66B; }
        .usr-sw.on::after { transform: translateX(18px); background: #12A66B; }
        .usr-sw:disabled { opacity: .45; cursor: not-allowed; }

        .usr-modulos {
            margin-top: 14px;
            padding-top: 13px;
            border-top: 1px solid var(--line);
            display: flex; flex-wrap: wrap; gap: 6px;
        }
        .usr-mod {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 12.5px;
            padding: 6px 10px 6px 8px;
            border: 1px solid var(--line);
            border-radius: 99px;
            background: var(--surface-2);
            color: var(--ink-soft);
            cursor: pointer;
            user-select: none;
            transition: background .15s, border-color .15s, color .15s, opacity .15s;
        }
        .usr-mod input { position: absolute; opacity: 0; width: 0; height: 0; }
        .usr-mod .caja {
            width: 15px; height: 15px; flex-shrink: 0;
            border-radius: 5px;
            border: 1.5px solid var(--line-strong);
            background: var(--surface);
            display: grid; place-items: center;
            transition: background .15s, border-color .15s;
        }
        .usr-mod .caja svg { width: 10px; height: 10px; opacity: 0; color: #fff; }
        .usr-mod.on {
            border-color: var(--kos-blue-soft);
            background: rgba(0,159,227,.09);
            color: var(--kos-blue-deep);
            font-weight: 500;
        }
        .usr-mod.on .caja { background: var(--kos-blue); border-color: var(--kos-blue); }
        .usr-mod.on .caja svg { opacity: 1; }
        .usr-mod:hover:not(.fija) { border-color: var(--kos-blue); }
        /* `fija` = el servidor la va a rechazar (quitarse uno mismo Usuarios).
           Se deja visible y no se esconde: la regla se entiende viendola. */
        .usr-mod.fija { opacity: .75; cursor: not-allowed; }
        .usr-mod.guardando { opacity: .5; }

        .usr-pie {
            margin-top: 13px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
            display: flex; align-items: center; gap: 8px;
            flex-wrap: wrap;
        }
        .usr-estado {
            font-size: 11.5px; font-weight: 600;
            padding: 4px 9px; border-radius: 99px;
            border: 1px solid color-mix(in srgb, var(--kos-orange) 40%, transparent);
            background: color-mix(in srgb, var(--kos-orange) 11%, transparent);
            color: var(--kos-orange-deep);
        }
        .usr-acciones { margin-left: auto; display: flex; gap: 6px; }
        .usr-mini {
            font-size: 12px;
            padding: 6px 10px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: var(--surface);
            color: var(--ink-soft);
            font-family: var(--font);
            cursor: pointer;
            transition: color .15s, border-color .15s, background .15s;
        }
        .usr-mini:hover:not(:disabled) {
            color: var(--kos-blue-deep);
            border-color: var(--kos-blue-soft);
            background: rgba(0,159,227,.07);
        }
        .usr-mini.borrar:hover:not(:disabled) {
            color: var(--kos-orange-deep);
            border-color: var(--kos-orange);
            background: rgba(242,140,48,.09);
        }
        .usr-mini:disabled { opacity: .35; cursor: not-allowed; }

        .usr-alta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .usr-alta .campo { display: flex; flex-direction: column; gap: 5px; }
        .usr-alta label {
            font-size: 10.5px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .5px;
            color: var(--ink-muted);
        }
        .usr-alta input {
            padding: 9px 11px;
            border: 1px solid var(--line);
            border-radius: var(--r-sm);
            background: var(--surface-2);
            font-family: var(--font); font-size: 13.5px;
            color: var(--ink);
        }
        .usr-alta input:focus {
            outline: none; background: var(--surface);
            border-color: var(--kos-blue);
            box-shadow: 0 0 0 3px rgba(0,159,227,.12);
        }
        .usr-alta input.usuario { font-family: var(--mono); font-size: 12.5px; }

        .usr-nota {
            margin-top: 20px;
            font-size: 12.5px; line-height: 1.65;
            color: var(--ink-muted);
            max-width: 760px;
        }
        .usr-nota code {
            font-family: var(--mono); font-size: 11.5px;
            padding: 1px 5px; border-radius: 5px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            color: var(--ink-soft);
        }

        /* --- Registro de cambios --- */
        .usr-log-tit {
            margin: 30px 0 12px;
            display: flex; align-items: baseline; gap: 10px;
        }
        .usr-log-tit h3 { font-size: 15px; font-weight: 600; }
        .usr-log-tit .sub { font-size: 12.5px; color: var(--ink-muted); }
        table.usr-log { min-width: 700px; }
        table.usr-log td.cuando {
            white-space: nowrap;
            font-size: 12.5px;
            color: var(--ink-soft);
        }
        table.usr-log td.quien { font-weight: 500; white-space: nowrap; }
        table.usr-log td.que { color: var(--ink-soft); }
        table.usr-log td.donde {
            font-family: var(--mono); font-size: 11.5px;
            color: var(--ink-muted);
            max-width: 320px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* Chip de sesion del rail: quien esta usando el panel. */
        .rail-yo {
            width: 34px; height: 34px;
            border-radius: 11px;
            border: 0;
            display: grid; place-items: center;
            background: var(--grad-brand);
            color: #fff;
            font-family: var(--font);
            font-size: 11.5px; font-weight: 700; letter-spacing: .3px;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: filter .15s, transform .15s;
        }
        .rail-yo:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .rail-yo .rail-tip { left: 46px; }
        .rail-yo:hover .rail-tip { opacity: 1; transform: translateX(0); }

    </style>
</head>
<body>

<!-- ===================== RAIL ===================== -->
<nav class="rail">
    <div class="brand-mark" title="KosXpress"><img src="logo-kosxpress.jpg" alt="KosXpress"></div>

    <button class="rail-btn" data-view="dash" onclick="switchView(this)" aria-label="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 20.5h17"/>
            <path d="M6.5 20.5v-6M11 20.5V7.5M15.5 20.5v-9M20 20.5V4.5"/>
        </svg>
        <span class="rail-tip">Dashboard</span>
    </button>

    <div class="rail-sep"></div>

    <button class="rail-btn active" data-col="wa_chats" onclick="switchTab(this)" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 20.5l1.5-4.9A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/>
            <path d="M8.6 8.3c.2-.5.4-.5.7-.5h.5c.2 0 .4 0 .6.5l.7 1.6c.1.3 0 .5-.1.7l-.4.5c-.2.2-.3.3-.1.6a7 7 0 0 0 3 2.6c.3.1.5.1.7-.1l.6-.7c.2-.2.4-.2.6-.1l1.6.8c.3.1.4.3.4.5a1.9 1.9 0 0 1-1.3 1.6c-.6.2-1.4.2-3.4-.7a10 10 0 0 1-4.3-4.2c-.6-1.1-.7-2-.6-2.6a2 2 0 0 1 .8-1.1z" fill="currentColor" stroke="none"/>
        </svg>
        <i class="dot"></i>
        <span class="rail-tip">WhatsApp</span>
    </button>

    <button class="rail-btn" data-col="wa_chats_web" onclick="switchTab(this)" aria-label="Chat Web">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="3.5" width="19" height="13" rx="2.2"/>
            <path d="M8 20.5h8M12 16.5v4"/>
            <path d="M6.5 7.5h5M6.5 10.5h8"/>
        </svg>
        <i class="dot"></i>
        <span class="rail-tip">Chat Web</span>
    </button>

    <div class="rail-sep"></div>

    <button class="rail-btn" data-view="pipeline" onclick="switchView(this)" aria-label="Pipeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="4.6" height="16" rx="1.4"/>
            <rect x="9.7" y="4" width="4.6" height="11" rx="1.4"/>
            <rect x="16.4" y="4" width="4.6" height="6.5" rx="1.4"/>
        </svg>
        <i class="dot"></i>
        <span class="rail-tip">Pipeline</span>
    </button>

    <button class="rail-btn" data-view="archived" onclick="switchView(this)" aria-label="Archivados">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="3.5" width="19" height="5" rx="1.6"/>
            <path d="M4.5 8.5v10a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-10"/>
            <path d="M9.8 12.5h4.4"/>
        </svg>
        <span class="rail-tip">Archivados</span>
    </button>

    <button class="rail-btn" data-view="pedidos" onclick="switchView(this)" aria-label="Pedidos">

<!-- Menu de una tarjeta del Pipeline. Vive fuera del tablero porque las
     columnas tienen overflow y ahi dentro quedaria recortado. -->

<div class="toast" id="toast">
    <i></i><span id="toastText"></span>

<script>
let currentCollection = 'wa_chats';
let currentSession = null;
// La coleccion de la conversacion abierta. En "Archivados" se mezclan los dos
// canales, asi que no siempre coincide con currentCollection.
let currentSessionCol = 'wa_chats';
// 'inbox' (un canal), 'archived' (los dos canales) o 'contacts' (la agenda).
let currentView = 'inbox';
let contactsList = null;
let currentContact = null;
let searchTimeout = null;
// id -> sesion, para que los resultados de busqueda puedan mostrar el nombre
// del contacto (/api/search solo devuelve sessionId).
let sessionsCache = {};
// Sesiones por coleccion. Se cargan las dos aunque solo se vea una, para poder
// encender el punto de pendientes del canal que no estas mirando.
let sessionsByCol = {};
let pendingOnly = false;

/* --- Estado de lectura -------------------------------------------------
   server.js es de solo lectura sobre Atlas (ver CLAUDE.md), asi que lo leido
   vive en el navegador. Por conversacion se guarda { r, p }:
     r = cuantos mensajes estaban leidos
     p = el r anterior, para que "marcar como no leido" pueda devolverse ahi
   No leidos = messageCount - r. Una conversacion que nunca se abrio tiene
   r = 0, o sea que entra como pendiente completa.
   Consecuencia: el estado es por navegador, no se comparte entre equipos.  */
const READS_KEY = 'kx-reads';
let reads = {};
try { reads = JSON.parse(localStorage.getItem(READS_KEY) || '{}') || {}; } catch { reads = {}; }
function saveReads() { try { localStorage.setItem(READS_KEY, JSON.stringify(reads)); } catch {} }

function unreadCount(s) {
    if (!s) return 0;
    const st = reads[s.id];
    return Math.max(0, (s.messageCount || 0) - (st ? st.r : 0));
}

function findSession(id) {
    for (const col of Object.keys(sessionsByCol)) {
        const hit = (sessionsByCol[col] || []).find(s => s.id === id);
        if (hit) return hit;
    }
    return null;
}

// Lo archivado no cuenta como pendiente: ya se cerro con el cliente.
function channelUnread(col) {
    return (sessionsByCol[col] || []).filter(s => !s.archived && unreadCount(s) > 0).length;
}

// Bandeja del canal visible, sin lo archivado.
function inboxOf(col) {
    return (sessionsByCol[col] || []).filter(s => !s.archived);
}

// La carpeta de archivados es una sola para los dos canales, ordenada por
// cuando se archivo cada conversacion.
function archivedAll() {
    return Object.keys(sessionsByCol)
        .flatMap(col => (sessionsByCol[col] || []).filter(s => s.archived))
        .sort((a, b) => new Date(b.archivedAt || 0) - new Date(a.archivedAt || 0));
}

function markRead(s) {
    const st = reads[s.id] || { r: 0, p: 0 };
    if (st.r === s.messageCount) {
        // Ya estaba al dia antes de abrirla: el punto de retorno pasa a ser
        // "sin pendientes". Si no, quedaria el de la primera lectura y marcarla
        // como no leida mostraria la conversacion entera como mensajes nuevos.
        if (st.p !== st.r) { reads[s.id] = { r: st.r, p: st.r }; saveReads(); }
        return;
    }
    reads[s.id] = { r: s.messageCount, p: st.r };
    saveReads();
}

function markUnread(id) {
    const s = findSession(id);
    if (!s) return;
    const st = reads[id] || { r: 0, p: 0 };
    // Vuelve al conteo previo a la ultima apertura: si habian llegado 3
    // mensajes nuevos, quedan esos 3 pendientes otra vez.
    let target = st.p;
    // Si ya estaba al dia antes de abrirla, deja al menos uno pendiente; si no,
    // el boton no cambiaria nada visible.
    if (target >= s.messageCount) target = s.messageCount - 1;
    target = Math.max(0, target);
    reads[id] = { r: target, p: target };
    saveReads();

    if (pendingOnly) renderSessions();
    else { refreshRow(id); updateCounters(); }
    showToast('Marcado como no leído');
}

function markUnreadCurrent() {
    if (currentSession) markUnread(currentSession);
}

function markAllRead() {
    const all = inboxOf(currentCollection);
    let n = 0;
    all.forEach(s => { if (unreadCount(s) > 0) { markRead(s); n++; } });
    if (!n) return;
    renderSessions();
    showToast(n === 1 ? '1 conversación marcada como leída'
                      : n + ' conversaciones marcadas como leídas');
}

function togglePendingFilter() {
    pendingOnly = !pendingOnly;
    document.getElementById('filterChip').classList.toggle('on', pendingOnly);
    const input = document.getElementById('searchInput');
    if (input.value.trim()) input.value = '';   // el filtro reemplaza la busqueda
    renderSessions();
}

// Actualiza el contador de una sola fila, sin repintar la lista (repintar
// perderia el resaltado de la conversacion abierta y relanzaria la animacion).
function refreshRow(id) {
    const row = document.querySelector(`.session-item[data-id="${id}"]`);
    const s = findSession(id);
    if (!row || !s) return;
    const n = unreadCount(s);
    row.classList.toggle('unread', n > 0);
    const badge = row.querySelector('.session-count');
    if (badge) {
        badge.textContent = n;
        badge.style.display = n > 0 ? '' : 'none';
    }
}

function updateCounters() {
    const pend = channelUnread(currentCollection);
    const label = document.getElementById('pendingLabel');
    if (label) {
        if (currentView === 'contacts') {
            const n = (contactsList || []).length;
            label.textContent = n ? n + (n === 1 ? ' contacto' : ' contactos') : '';
        } else if (currentView === 'archived') {
            const n = archivedAll().length;
            label.textContent = n ? n + (n === 1 ? ' archivada' : ' archivadas') : '';
        } else if (currentView === 'pipeline') {
            const n = plSinAsignar();
            label.textContent = n ? n + ' sin asignar' : '';
        } else {
            label.textContent = pend ? pend + (pend === 1 ? ' pendiente' : ' pendientes') : '';
        }
    }
    toggleActivity('wa_chats', channelUnread('wa_chats') > 0);
    toggleActivity('wa_chats_web', channelUnread('wa_chats_web') > 0);
    // El pendiente del tablero no son mensajes sin leer sino conversaciones
    // que nadie ha clasificado: eso es lo que enciende su punto en el rail.
    const plBtn = document.querySelector('.rail-btn[data-view="pipeline"]');
    if (plBtn) plBtn.classList.toggle('has-activity', plSinAsignar() > 0);
    const readAll = document.getElementById('readAllChip');
    if (readAll) readAll.disabled = pend === 0;
    updateTile('wa', 'wa_chats');
    updateTile('web', 'wa_chats_web');
    // El icono de la pestana cuenta lo mismo que la bandeja, y por eso se
    // repinta desde aqui: leer una conversacion lo baja en el acto, sin
    // esperar al siguiente refresco.
    if (typeof pintarPestana === 'function') pintarPestana();
}

// Las tarjetas del pie cuentan PERSONAS sin responder (conversaciones con al
// menos un mensaje sin leer), no mensajes.
function updateTile(key, col) {
    const tile = document.getElementById('tile-' + key);
    const val = document.getElementById('pend-' + key);
    const sub = document.getElementById('pend-' + key + '-sub');
    if (!tile || !val || !sub) return;

    const total = (sessionsByCol[col] || []).length;
    const pending = channelUnread(col);

    val.textContent = pending;
    sub.textContent = pending > 0 ? 'sin responder'
                    : total ? 'todo al día'
                    : 'sin chats';
    tile.classList.toggle('pending', pending > 0);
}

let toastTimer = null;
// Accion opcional del aviso: { texto, fn }. La usa el Pipeline para deshacer
// un cierre, que es lo unico del panel que saca algo de la vista de golpe.
let toastAccion = null;

function showToast(msg, accion) {
    const el = document.getElementById('toast');
    document.getElementById('toastText').textContent = msg;

    const btn = document.getElementById('toastBtn');
    toastAccion = accion || null;
    if (btn) {
        btn.style.display = accion ? '' : 'none';
        btn.textContent = accion ? accion.texto : '';
    }
    el.classList.toggle('con-accion', !!accion);

    el.classList.add('show');
    clearTimeout(toastTimer);
    // Con boton dura mas: hay que leerlo y decidir, no solo enterarse.
    toastTimer = setTimeout(() => ocultarToast(), accion ? 8000 : 2600);
}

function ocultarToast() {
    toastAccion = null;
    const el = document.getElementById('toast');
    el.classList.remove('show', 'con-accion');
}

function toastAccionClick() {
    const a = toastAccion;
    ocultarToast();
    clearTimeout(toastTimer);
    if (a) a.fn();
}

async function fetchAPI(endpoint, params = {}) {
    const query = new URLSearchParams(params);
    const res = await fetch('/api/' + endpoint + '?' + query.toString());
    // Un 401 aqui es la sesion vencida (dura 12 h) o cerrada desde otro lado.
    // Sin esto, el panel se llenaria de errores de "respuesta inesperada" en
    // vez de mandar a escribir la clave otra vez.
    if (res.status === 401) return alLogin();
    return await res.json();
}

// Devuelve una promesa que nunca resuelve, a proposito: quien la esperaba se
// queda quieto mientras el navegador cambia de pagina, en vez de seguir
// pintando con datos que no llegaron.
function alLogin() {
    location.replace('/login.html');
    return new Promise(() => {});
}

function formatSessionId(id) {
    if (!id) return 'Desconocido';
    if (id.length > 20) return id.substring(0, 8) + '...' + id.substring(id.length - 6);
    return id;
}

function formatPhone(sessionId) {
    if (!sessionId) return '?';
    const digits = sessionId.replace(/\D/g, '');
    if (digits.length >= 10) return '+' + digits;
    return sessionId;
}

function getInitials(name) {
    if (!name) return '?';
    // If it's a name (has letters), use first letters
    const words = String(name).trim().split(/\s+/);
    if (words.length >= 2 && /[a-zA-Z]/.test(words[0])) {
        return (words[0][0] + words[1][0]).toUpperCase();
    }
    if (/[a-zA-Z]/.test(name)) return String(name).charAt(0).toUpperCase();
    // If digits (phone), use last 2
    const digits = String(name).replace(/\D/g, '');
    if (digits.length >= 2) return digits.slice(-2);
    return String(name).charAt(0).toUpperCase();
}

// Compact stamp for the session list: time today, weekday this week, else date.
function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const now = new Date();
    if (d.toDateString() === now.toDateString()) {
        return d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
    }
    if (now - d < 604800000) return d.toLocaleDateString('es-CO', { weekday: 'short' });
    return d.toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: '2-digit' });
}

function formatFullDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString('es-CO', {
        day: 'numeric', month: 'long', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
    });
}

function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
}

// Sello para la esquina de un mensaje. Si cae el mismo dia que el inicio de la
// conversacion basta la hora; si no, se antepone el dia.
function stampFor(iso, refIso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const ref = refIso ? new Date(refIso) : null;
    if (ref && !isNaN(ref) && d.toDateString() === ref.toDateString()) return formatTime(iso);
    return d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short' }) + ' · ' + formatTime(iso);
}

function getDateLabel(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const now = new Date();
    if (d.toDateString() === now.toDateString()) return 'Hoy';
    const yesterday = new Date(now);
    yesterday.setDate(yesterday.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) return 'Ayer';
    return d.toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' });
}

function truncate(text, max) {
    if (!text) return '...';
    return text.length > max ? text.substring(0, max) + '...' : text;
}

// A session can arrive without a sessionId (older records saved before the
// WhatsApp user_id fallback existed). Never render a bare "null".
function sessionLabel(s, isWeb) {
    if (s.name) return s.name;
    if (!s.sessionId) return 'Sin identificar';
    return isWeb ? formatSessionId(s.sessionId) : contactIdentifier(s, isWeb);
}

// What to show as the contact's handle. Meta sends a phone number for most
// contacts, but for the newer user_id identities there is no phone at all —
// only a username. Show whichever exists rather than a fake number.
function contactIdentifier(s, isWeb) {
    if (isWeb) return s.sessionId ? formatSessionId(s.sessionId) : '';
    if (s.username) return '@' + s.username;
    if (!s.sessionId) return '';
    if (/^\d+$/.test(s.sessionId)) return formatPhone(s.sessionId);
    return 'ID: ' + s.sessionId;   // user_id identity, no phone available
}

function toggleActivity(col, on) {
    const btn = document.querySelector(`.rail-btn[data-col="${col}"]`);
    if (btn) btn.classList.toggle('has-activity', !!on);
}

function skeletonList(n = 6) {
    let html = '';
    for (let i = 0; i < n; i++) {
        html += `<div class="sk-item">
            <div class="sk sk-avatar"></div>
            <div><div class="sk sk-line"></div><div class="sk sk-line"></div></div>
        </div>`;
    }
    return html;
}

function sessionCard(s, isWeb, index, opts = {}) {
    const displayName = sessionLabel(s, isWeb);
    const subtitle = s.name ? contactIdentifier(s, isWeb) : '';
    const delay = Math.min(index * 22, 400);
    const unread = unreadCount(s);
    // El contador queda siempre en el DOM aunque este oculto: refreshRow lo
    // muestra u oculta sin tener que repintar la fila entera.
    const badge = opts.badge !== undefined
        ? opts.badge
        : `<div class="session-count new"${unread ? '' : ' style="display:none"'}>${unread}</div>
           <button class="row-action" onclick="event.stopPropagation();markUnread('${s.id}')"
                   title="Marcar como no leído" aria-label="Marcar como no leído">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                   <path d="M2.5 12S6 5.5 12 5.5c1.6 0 3 .5 4.2 1.2M21.5 12s-1.2 2.2-3.3 4"/>
                   <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3.5 3.5l17 17"/>
               </svg>
           </button>`;
    const stamp = opts.hideDate ? '' :
        `<div class="session-date" title="${escapeAttr(formatFullDate(s.lastSeen || s.startedAt))}">${formatDate(s.lastSeen || s.startedAt)}</div>`;
    // El chip de Manual avisa desde la lista que el bot está en pausa ahí, sin
    // tener que abrir la conversación para darse cuenta.
    const manual = s.mode === 'manual' ? '<span class="row-chip manual">Manual</span> ' : '';
    const preview = opts.preview !== undefined
        ? opts.preview
        : `${manual}${s.lastType === 'ai' ? '<b>Bot:</b> ' : ''}${escapeHtml(truncate(s.lastMessage, 42))}`;

    return `
    <div class="session-item ${unread ? 'unread' : ''}" data-id="${s.id}" style="animation-delay:${delay}ms" onclick="openSession('${s.id}')">
        <div class="session-avatar ${isWeb ? 'web' : ''}">${escapeHtml(getInitials(s.name || s.sessionId))}</div>
        <div class="session-info">
            <div class="session-name">${escapeHtml(displayName)}</div>
            ${subtitle ? `<div class="session-contact">${escapeHtml(subtitle)}</div>` : ''}
            <div class="session-preview">${preview}</div>
        </div>
        <div class="session-meta">${stamp}${badge}</div>
    </div>`;
}

// Trae las dos colecciones y pinta la actual. Hacen falta ambas para contar
// los pendientes del canal que no esta a la vista.
async function loadSessions() {
    // Quien no tiene ni bandeja ni tablero no puede leer /api/sessions: pedirlo
    // igual solo cambiaria una vista vacia por un 403 en pantalla.
    if (!puedeVerChats()) return;
    const list = document.getElementById('sessionsList');
    list.innerHTML = skeletonList();

    try {
        const [wa, web] = await Promise.all([
            fetchAPI('sessions', { collection: 'wa_chats' }),
            fetchAPI('sessions', { collection: 'wa_chats_web' })
        ]);
        // Si Mongo falla, /api/sessions responde {error} con status 500. Ese
        // objeto es "truthy", asi que sin esta comprobacion entraria como si
        // fuera la lista y reventaria despues en .filter/.length.
        if (!Array.isArray(wa) || !Array.isArray(web)) {
            throw new Error((wa && wa.error) || (web && web.error) || 'respuesta inesperada del servidor');
        }
        sessionsByCol = { wa_chats: wa, wa_chats_web: web };
        renderCurrentView();
        // Linea base de los avisos: esta primera pasada no anuncia nada, solo
        // se queda con la foto. Sin ella, abrir el panel sonaria una vez por
        // cada conversacion que ya estaba sin leer.
        revisarNovedades();
    } catch (err) {
        list.innerHTML = '<div class="loading"><p>Error: ' + escapeHtml(err.message) + '</p></div>';
    }
}

function renderSessions(opts = {}) {
    const list = document.getElementById('sessionsList');
    const all = inboxOf(currentCollection);

    // El cache alimenta los resultados de busqueda, que tambien pueden caer
    // sobre conversaciones archivadas: se indexan todas, no solo la bandeja.
    sessionsCache = {};
    Object.keys(sessionsByCol).forEach(col =>
        (sessionsByCol[col] || []).forEach(s => { sessionsCache[s.id] = s; }));
    updateCounters();
    // quiet = viene del refresco automatico, no de una accion del usuario.
    list.classList.toggle('no-anim', !!opts.quiet);

    if (!all.length) {
        list.innerHTML = '<div class="loading"><p>No hay conversaciones en este canal</p></div>';
        return;
    }

    const shown = pendingOnly ? all.filter(s => unreadCount(s) > 0) : all;
    if (!shown.length) {
        list.innerHTML = '<div class="loading"><p>Nada pendiente en este canal.<br>Todo al día.</p></div>';
        return;
    }

    const isWeb = currentCollection === 'wa_chats_web';
    list.innerHTML = shown.map((s, i) => sessionCard(s, isWeb, i)).join('');

    // Conservar el resaltado de la conversacion abierta tras un repintado.
    if (currentSession) {
        const row = list.querySelector(`.session-item[data-id="${currentSession}"]`);
        if (row) row.classList.add('active');
    }
}

/* ======================================================================
   ARCHIVADOS
   Archivar no mueve ni borra el chat: escribe `archivedAt` en el documento.
   Tiene que ser asi porque el nodo de memoria de n8n sigue escribiendo
   mensajes en ese mismo documento; moverlo le borraria al bot el historial
   del cliente. Si el cliente vuelve a escribir, el servidor lo devuelve solo
   a la bandeja, porque entonces la conversacion no habia terminado.
   ====================================================================== */
const ICON_ARCHIVE = '<rect x="2.5" y="3.5" width="19" height="5" rx="1.6"/>' +
    '<path d="M4.5 8.5v10a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-10"/><path d="M9.8 12.5h4.4"/>';
const ICON_RESTORE = '<path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 3.5V9H9"/>';

function renderArchived(opts = {}) {
    const list = document.getElementById('sessionsList');
    const all = archivedAll();

    sessionsCache = {};
    Object.keys(sessionsByCol).forEach(col =>
        (sessionsByCol[col] || []).forEach(s => { sessionsCache[s.id] = s; }));
    updateCounters();
    list.classList.toggle('no-anim', !!opts.quiet);

    updateArchivedFilterCounts();

    if (!all.length) {
        list.innerHTML = '<div class="loading"><p>Todavía no has archivado ninguna conversación.<br>' +
            'Abre un chat y usa el botón de archivar.</p></div>';
        return;
    }

    // Primero el canal, despues el texto: se busca dentro de lo que el filtro
    // dejo a la vista.
    const base = porCanal(all, archivedChannel);
    const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    const shown = !q ? base : base.filter(s =>
        [s.name, s.sessionId, s.lastMessage].some(v => v && String(v).toLowerCase().includes(q)));

    if (!shown.length) {
        const donde = archivedChannel === 'whatsapp' ? ' de WhatsApp'
                    : archivedChannel === 'web' ? ' del chat web' : '';
        list.innerHTML = '<div class="loading"><p>' + (q
            ? 'Nada archivado' + donde + ' coincide con “' + escapeHtml(q) + '”'
            : 'No hay conversaciones archivadas' + donde + '.') + '</p></div>';
        return;
    }

    list.innerHTML = shown.map((s, i) => {
        const isWeb = s.collection === 'wa_chats_web';
        return sessionCard(s, isWeb, i, {
            badge: `<span class="row-chip ${isWeb ? 'web' : 'wa'}">${isWeb ? 'Web' : 'WA'}</span>
                <button class="row-action always" onclick="event.stopPropagation();toggleArchive('${s.id}', false)"
                        title="Devolver a la bandeja" aria-label="Devolver a la bandeja">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">${ICON_RESTORE}</svg>
                </button>`
        });
    }).join('');

    if (currentSession) {
        const row = list.querySelector(`.session-item[data-id="${currentSession}"]`);
        if (row) row.classList.add('active');
    }
}

async function toggleArchive(id, archivar) {
    const s = findSession(id);
    const col = (s && s.collection) || currentSessionCol;
    try {
        const res = await fetch('/api/archive', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ collection: col, id, archived: archivar })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'el servidor respondió ' + res.status);

        if (s) {
            s.archived = archivar;
            s.archivedAt = archivar ? new Date().toISOString() : null;
            s.reopened = false;
        }
        // La conversacion abierta desaparece de la vista actual: se cierra.
        if (currentSession === id &&
            ((currentView === 'inbox' && archivar) || (currentView === 'archived' && !archivar))) {
            currentSession = null;
            closeDetail();
        } else if (currentSession === id) {
            updateArchiveBtn(archivar);
        }
        // El chat cambio de estado: la agenda tendra que releerse.
        contactsList = null;
        renderCurrentView();
        showToast(archivar ? 'Conversación archivada' : 'Devuelta a la bandeja');
    } catch (err) {
        showToast('No se pudo archivar: ' + err.message);
    }
}

function toggleArchiveCurrent() {
    if (!currentSession) return;
    const s = findSession(currentSession);
    toggleArchive(currentSession, !(s && s.archived));
}

function updateArchiveBtn(archivada) {
    const btn = document.getElementById('archiveBtn');
    const icon = document.getElementById('archiveIcon');
    if (!btn || !icon) return;
    btn.title = archivada ? 'Devolver a la bandeja' : 'Archivar conversación';
    btn.setAttribute('aria-label', btn.title);
    icon.innerHTML = archivada ? ICON_RESTORE : ICON_ARCHIVE;
}

/* ======================================================================
   INTERVENCION DEL ASESOR
   En Manual, el nodo "¿Modo Manual?" del workflow corta el paso al bot: el
   cliente deja de recibir respuestas automaticas y sus mensajes se siguen
   guardando en la memoria, para que al volver a Automatico el bot tenga el
   hilo completo. Solo aplica a WhatsApp: el widget web es peticion/respuesta
   y, si el bot no contesta, el visitante se queda esperando.
   ====================================================================== */
let currentMode = 'auto';
let currentPhone = null;
// { abierta: true|false|null, horas, lastSeen } — lo calcula el servidor.
// `null` en `abierta` = no se sabe (contacto sin registro): no se bloquea nada.
let currentVentana = null;

// WhatsApp Web solo sirve si conocemos un numero real. Las identidades nuevas
// de Meta (CO.1586524026432871) no traen telefono: ahi no hay a quien escribir.
function resolvePhone(data) {
    const d = String(data.phoneNumber || data.sessionId || '').replace(/\D/g, '');
    if (/^57\d{10}$/.test(d)) return d;
    if (/^3\d{9}$/.test(d)) return '57' + d;
    return null;
}

function textoHoras(h) {
    if (h == null) return 'un tiempo que no se conoce';
    return h < 48 ? h.toFixed(1).replace('.0', '') + ' horas' : Math.floor(h / 24) + ' días';
}

// Refleja la ventana de 24 h de WhatsApp en los controles. Fuera de ella Meta
// acepta el mensaje y no lo entrega, sin avisar, así que el panel prefiere no
// dejar mandar antes que mostrar como enviado algo que el cliente no recibió.
// El servidor valida lo mismo: esto es solo para que se entienda por qué.
function aplicarVentana() {
    const isWeb = currentSessionCol === 'wa_chats_web';
    const cerrada = !isWeb && !!currentVentana && currentVentana.abierta === false;

    document.getElementById('chatArea').classList.toggle('ventana-cerrada', cerrada);

    const manual = document.querySelector('#modeSwitch button[data-mode="manual"]');
    if (manual) {
        manual.disabled = cerrada;
        manual.title = cerrada
            ? 'No se puede tomar la conversación: la ventana de 24 h está cerrada'
            : '';
    }

    // Si la ventana se vence con la conversación ya tomada, el compositor se
    // apaga igual: es el caso que el bloqueo de Manual no alcanza a cubrir.
    document.getElementById('composerText').disabled = cerrada;
    document.getElementById('sendBtn').disabled = cerrada;

    if (cerrada) {
        document.getElementById('ventanaAviso').innerHTML =
            '<b>La ventana de 24 horas de WhatsApp está cerrada.</b> El cliente no escribe hace ' +
            textoHoras(currentVentana.horas) + '. Meta aceptaría el mensaje pero no se lo entregaría, ' +
            'así que no se puede tomar la conversación ni escribirle. Se reabre sola cuando el cliente ' +
            'vuelva a escribir; para iniciar tú, hace falta una plantilla aprobada.';
    }
}

function paintMode() {
    const isWeb = currentSessionCol === 'wa_chats_web';
    document.getElementById('chatArea')
        .classList.toggle('manual', currentMode === 'manual' && !isWeb);
    document.getElementById('modeSwitch').querySelectorAll('button')
        .forEach(b => b.classList.toggle('on', b.dataset.mode === currentMode));
    document.getElementById('composerHint').textContent = currentMode === 'manual'
        ? 'El bot está en pausa para este cliente. Lo que escribas aquí le llega por WhatsApp.'
        : '';
    aplicarVentana();
}

function updateChatControls(data) {
    const isWeb = currentSessionCol === 'wa_chats_web';
    currentMode = data.mode === 'manual' ? 'manual' : 'auto';
    currentPhone = resolvePhone(data);
    currentVentana = data.ventana || null;

    // El chat web no admite ni modo manual ni escribirle: se ocultan.
    document.getElementById('modeSwitch').style.display = isWeb ? 'none' : '';

    const wa = document.getElementById('waWebBtn');
    if (currentPhone && !isWeb) {
        wa.style.display = '';
        wa.href = 'https://web.whatsapp.com/send?phone=' + currentPhone;
        wa.title = 'Escribir a +' + currentPhone + ' en WhatsApp Web';
    } else {
        wa.style.display = 'none';
    }

    paintMode();
}

async function setMode(mode) {
    if (!currentSession || mode === currentMode) return;
    try {
        const r = await fetch('/api/mode', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ collection: currentSessionCol, id: currentSession, mode })
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
            // El servidor manda la ventana recalculada cuando rechaza por 24 h.
            // Se adopta para que el panel deje de ofrecer algo imposible aunque
            // la conversación se hubiera abierto hace rato.
            if (d.ventana) { currentVentana = d.ventana; aplicarVentana(); }
            throw new Error(d.error || 'el servidor respondió ' + r.status);
        }
        if (d.ventana) currentVentana = d.ventana;

        currentMode = mode;
        const s = findSession(currentSession);
        if (s) s.mode = mode;
        paintMode();
        renderCurrentView();
        if (mode === 'manual') document.getElementById('composerText').focus();
        showToast(mode === 'manual'
            ? 'Bot en pausa: la conversación es tuya'
            : 'El bot vuelve a responder');
    } catch (err) {
        showToast('No se pudo cambiar el modo: ' + err.message);
    }
}

function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function composerKey(e) {
    // Enter envía, Shift+Enter salta de línea (como WhatsApp).
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

async function sendMessage() {
    const box = document.getElementById('composerText');
    const btn = document.getElementById('sendBtn');
    const texto = box.value.trim();
    if (!texto || !currentSession || btn.disabled) return;

    btn.disabled = true;
    try {
        const r = await fetch('/api/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ collection: currentSessionCol, id: currentSession, text: texto })
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
            if (d.ventana) currentVentana = d.ventana;
            throw new Error(d.error || 'el servidor respondió ' + r.status);
        }

        box.value = '';
        autoGrow(box);
        // Se recarga la conversación para ver el mensaje ya guardado, en vez de
        // pintarlo a mano y arriesgarse a mostrar algo que no quedó en la base.
        await openSession(currentSession, currentSessionCol);
        box.focus();
    } catch (err) {
        showToast('No se envió: ' + err.message);
    } finally {
        btn.disabled = false;
        // Vuelve a apagar el compositor si el rechazo fue por la ventana.
        aplicarVentana();
    }
}

/* ======================================================================
   PEDIDOS
   Vienen de la API de Siesa y viven en SQL Server, no en Mongo. Lo que el
   asesor puede tocar es la guia, el contacto y las cinco etapas por las que
   pasa el pedido. La sincronizacion nunca las pisa (ver el MERGE en pedidos.js).
   ====================================================================== */
let pedidosList = null;
let pedidosVerTodos = false;
let pedidosQuery = '';

// Pedidos que el asesor marcó con la casilla de selección, para una acción
// futura sobre varios a la vez (por ahora, sin ninguna acción todavía —
// esta es solo la parte de elegirlos). Van los `id` ("TIPO-CONSEC"), no los
// objetos: así no queda una copia vieja del pedido si se vuelve a sincronizar.
let pedidosSeleccion = new Set();

// Las etapas, en el orden en que ocurren. `clave` es el nombre de la columna en
// SQL — tiene que coincidir con ETAPAS en pedidos.js, que es quien arma el
// UPDATE. El campo con la fecha es siempre `clave + 'En'` (impresionEn,
// formacionEn, bodegaEn, despachadoEn), y por eso los nombres no se escriben
// aparte en ningun lado.
//
// Ninguna depende de la anterior: un pedido puede llegar a bodega sin pasar por
// impresion, y bloquear la casilla obligaria al asesor a mentir para poder
// registrar lo que de verdad paso.
const ETAPAS_PEDIDO = [
    { clave: 'impresion',  titulo: 'Impresión' },
    { clave: 'formacion',  titulo: 'Formación' },
    { clave: 'bodega',     titulo: 'Bodega' },
    { clave: 'despachado', titulo: 'Despacho' },
    // En SQL se llama `recibido`; para el asesor es "Entregado". Marcarla es
    // lo que habilita el botón de la encuesta de satisfacción.
    { clave: 'recibido',   titulo: 'Entregado' }
];

// Busca por cliente, por documento y por guia. El cliente es lo que se pidio,
// los otros dos salen gratis y evitan tener que recordar como se escribia.
function pedidosFiltrados() {
    const q = pedidosQuery.trim().toLowerCase();
    if (!q) return pedidosList || [];
    return (pedidosList || []).filter(p =>
        [p.nombreCliente, p.noGuia, p.idTipoDocto + '-' + p.consecDocto]
            .some(v => v && String(v).toLowerCase().includes(q)));
}

// El rotulo de la etapa lo pone el encabezado de la columna; en la fila solo va
// la casilla, y la fecha en que se marco viaja en el `title`. Sin `en` la
// casilla esta marcada pero la fecha aun no llego del servidor (ver marcarEtapa).
function tituloEtapa(e, marcada, en) {
    if (!marcada) return 'Marcar ' + e.titulo.toLowerCase();
    return e.titulo + (en ? ' · ' + formatFullDate(en) : '');
}

function celdaEtapa(p, e) {
    const marcada = !!p[e.clave];
    return `
        <td class="ped-etapa">
            <label class="ped-check" title="${escapeAttr(tituloEtapa(e, marcada, p[e.clave + 'En']))}">
                <input type="checkbox" ${marcada ? 'checked' : ''}
                       aria-label="${escapeAttr(e.titulo)}"
                       onchange="marcarEtapa('${escapeAttr(p.id)}', '${e.clave}', this)">
                <span class="caja">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"
                         stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
                </span>
            </label>
        </td>`;
}

function celdaSeleccion(p) {
    const marcado = pedidosSeleccion.has(p.id);
    return `
        <td class="ped-sel">
            <label class="ped-check" title="${marcado ? 'Quitar de la selección' : 'Seleccionar'}">
                <input type="checkbox" ${marcado ? 'checked' : ''}
                       aria-label="Seleccionar pedido"
                       onchange="alternarSeleccionPedido('${escapeAttr(p.id)}', this)">
                <span class="caja">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"
                         stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
                </span>
            </label>
        </td>`;
}

function filaPedido(p) {
    return `
        <tr class="${p.despachado ? 'despachado' : ''} ${pedidosSeleccion.has(p.id) ? 'seleccionado' : ''}" data-ped="${escapeAttr(p.id)}">
            ${celdaSeleccion(p)}
            <td class="ped-doc">${escapeHtml(p.idTipoDocto)}-${p.consecDocto}</td>
            <td class="ped-cliente">${escapeHtml(p.nombreCliente || '—')}</td>
            <td class="ped-fecha">${escapeHtml(fechaCorta(p.fechaRegistro))}</td>
            <td class="ped-fecha ped-entrega ${entregaVencida(p) ? 'vencida' : ''}">${escapeHtml(fechaCorta(p.fechaEntrega))}</td>
            <td>
                <input class="ped-guia" type="text" maxlength="100" placeholder="—"
                       value="${escapeAttr(p.noGuia || '')}"
                       onchange="guardarGuia('${escapeAttr(p.id)}', this)"
                       onkeydown="if(event.key==='Enter')this.blur()">
            </td>
            <td>
                <input class="ped-guia ped-contacto" type="text" maxlength="20" placeholder="3xx xxx xxxx"
                       value="${escapeAttr(p.contacto || '')}"
                       onchange="guardarContacto('${escapeAttr(p.id)}', this)"
                       onkeydown="if(event.key==='Enter')this.blur()">
            </td>
            ${ETAPAS_PEDIDO.map(e => celdaEtapa(p, e)).join('')}
            <td class="ped-aviso-celda">${botonAviso(p)}</td>
            <td class="ped-encuesta-celda">${botonEncuesta(p)}</td>
        </tr>`;
}

// Las columnas fijas mas una por etapa. Lo usa el `colspan` del «sin
// resultados»: escrito a mano, se queda corto en cuanto se agregue una etapa.
// Fijas: selección, las seis de datos, el aviso y la encuesta.
const PED_COLUMNAS = 9 + ETAPAS_PEDIDO.length;

// Al teclear se repinta SOLO el cuerpo de la tabla: repintar el panel entero
// destruiria el input y se perderia el foco en cada letra.
function filtrarPedidos(v) {
    pedidosQuery = v;
    const tbody = document.querySelector('#pedidosPanel table.ped tbody');
    if (!tbody) return;
    const filas = pedidosFiltrados();
    tbody.innerHTML = filas.length
        ? filas.map(filaPedido).join('')
        : `<tr class="ped-sinres"><td colspan="${PED_COLUMNAS}">Ningún pedido coincide con “${escapeHtml(v)}”</td></tr>`;
    actualizarCheckTodos();
    const cont = document.getElementById('pedCount');
    if (cont) {
        cont.textContent = pedidosQuery.trim()
            ? filas.length + ' de ' + (pedidosList || []).length : '';
    }
}

/* ----------------------------------------------------------------------
   SELECCIÓN DE PEDIDOS
   Por ahora esto solo deja marcar pedidos; todavía no dispara ninguna
   acción (esa es la parte que sigue, para la encuesta de satisfacción).
   La selección vive en `pedidosSeleccion` y no en el DOM, para que
   sobreviva a un repintado de la tabla (filtrar, marcar una etapa, etc.).
   ---------------------------------------------------------------------- */

function alternarSeleccionPedido(id, el) {
    if (el.checked) pedidosSeleccion.add(id); else pedidosSeleccion.delete(id);

    const fila = document.querySelector(`tr[data-ped="${CSS.escape(id)}"]`);
    if (fila) fila.classList.toggle('seleccionado', el.checked);

    const label = el.closest('.ped-check');
    if (label) label.title = el.checked ? 'Quitar de la selección' : 'Seleccionar';

    actualizarCheckTodos();
}

// Marca o suelta TODOS los pedidos visibles (los que pasan el buscador), no
// toda la lista: si el asesor filtró por un cliente, "seleccionar todos"
// tiene que referirse a lo que está viendo, no a pedidos que no ve en pantalla.
function alternarSeleccionTodos(el) {
    const visibles = pedidosFiltrados();
    for (const p of visibles) {
        if (el.checked) pedidosSeleccion.add(p.id); else pedidosSeleccion.delete(p.id);
    }

    const tbody = document.querySelector('#pedidosPanel table.ped tbody');
    if (tbody) {
        tbody.innerHTML = visibles.length
            ? visibles.map(filaPedido).join('')
            : tbody.innerHTML;
    }
}

// Refleja en la casilla del encabezado si TODOS los visibles están marcados
// (checked), NINGUNO (sin marcar) o solo ALGUNOS (indeterminate) — el estado
// intermedio evita que el asesor crea que ya seleccionó todo cuando en
// realidad marcó las filas una por una y le falta alguna.
function actualizarCheckTodos() {
    const check = document.getElementById('pedSelTodos');
    if (!check) return;
    const visibles = pedidosFiltrados();
    const marcados = visibles.filter(p => pedidosSeleccion.has(p.id)).length;
    check.checked = visibles.length > 0 && marcados === visibles.length;
    check.indeterminate = marcados > 0 && marcados < visibles.length;
}

function fechaCorta(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return '—';
    return d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: '2-digit' });
}

// Un pedido sin despachar cuya fecha de entrega ya paso necesita atencion.
function entregaVencida(p) {
    if (p.despachado || !p.fechaEntrega) return false;
    const d = new Date(p.fechaEntrega);
    return !isNaN(d) && d < new Date(new Date().toDateString());
}

async function renderPedidos(opts = {}) {
    const panel = document.getElementById('pedidosPanel');

    if (!pedidosList) {
        panel.innerHTML = '<div class="ped-vacio"><div class="spinner"></div><p>Cargando pedidos…</p></div>';
        try {
            const d = await fetchAPI('pedidos', pedidosVerTodos ? { todos: '1' } : {});
            if (!Array.isArray(d)) throw new Error((d && d.error) || 'respuesta inesperada del servidor');
            pedidosList = d;
            // Una sincronización o un cambio de filtro puede traer una lista
            // distinta: lo seleccionado que ya no aparece se suelta, para que
            // la acción futura sobre "los seleccionados" no arrastre un pedido
            // que el asesor ya no está viendo.
            const idsVigentes = new Set(pedidosList.map(p => p.id));
            for (const id of pedidosSeleccion) {
                if (!idsVigentes.has(id)) pedidosSeleccion.delete(id);
            }
        } catch (err) {
            panel.innerHTML = `<div class="ped-vacio"><p>No se pudieron cargar los pedidos.<br>
                <b>${escapeHtml(err.message)}</b></p></div>`;
            return;
        }
        if (currentView !== 'pedidos') return;   // cambiaron de vista mientras cargaba
    }

    const sinDespachar = pedidosList.filter(p => !p.despachado).length;
    const ultima = pedidosList.reduce((a, p) =>
        p.sincronizadoEn && (!a || new Date(p.sincronizadoEn) > new Date(a)) ? p.sincronizadoEn : a, null);

    const visibles = pedidosFiltrados();
    const filas = visibles.length
        ? visibles.map(filaPedido).join('')
        : `<tr class="ped-sinres"><td colspan="${PED_COLUMNAS}">Ningún pedido coincide con “${escapeHtml(pedidosQuery)}”</td></tr>`;

    panel.innerHTML = `
        <div class="ped-head">
            <div>
                <h2>Pedidos</h2>
                <div class="sub">
                    ${pedidosList.length} ${pedidosList.length === 1 ? 'pedido' : 'pedidos'} ·
                    ${sinDespachar} sin despachar
                    ${ultima ? ' · última sincronización ' + escapeHtml(formatFullDate(ultima)) : ''}
                    <span class="ped-sync" id="pedSyncEstado">${textoEstadoSync()}</span>
                </div>
            </div>
            <div class="ped-actions">
                <div class="ped-search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
                    </svg>
                    <input type="text" id="pedSearch" autocomplete="off"
                           placeholder="Buscar cliente, documento o guía"
                           value="${escapeAttr(pedidosQuery)}"
                           oninput="filtrarPedidos(this.value)">
                    <span class="ped-count" id="pedCount">${pedidosQuery.trim()
                        ? visibles.length + ' de ' + pedidosList.length : ''}</span>
                </div>
                <button class="btn" onclick="alternarVerTodos()">
                    ${pedidosVerTodos ? 'Ver solo pendientes' : 'Ver todos'}
                </button>
                <button class="btn primary" id="btnSyncPedidos" onclick="sincronizarPedidos()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5V9H15"/>
                    </svg>
                    Sincronizar con Siesa
                </button>
            </div>
        </div>

        <div class="ped-wrap">
            ${!pedidosList.length ? '<div class="ped-vacio"><p>No hay pedidos.<br>Usa «Sincronizar con Siesa» para traerlos.</p></div>' : `
            <div class="ped-scroll">
                <table class="ped">
                    <thead>
                        <tr>
                            <th class="th-sel">
                                <label class="ped-check" title="Seleccionar todos los visibles">
                                    <input type="checkbox" id="pedSelTodos"
                                           aria-label="Seleccionar todos los pedidos visibles"
                                           onchange="alternarSeleccionTodos(this)">
                                    <span class="caja">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"
                                             stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
                                    </span>
                                </label>
                            </th>
                            <th>Documento</th><th>Cliente</th><th>Registro</th>
                            <th>Entrega</th><th>No. guía</th><th>Contacto</th>
                            ${ETAPAS_PEDIDO.map(e => `<th class="th-etapa">${escapeHtml(e.titulo)}</th>`).join('')}
                            <th>Aviso al cliente</th>
                            <th>Encuesta</th>
                        </tr>
                    </thead>
                    <tbody>${filas}</tbody>
                </table>
            </div>`}
        </div>`;

    actualizarCheckTodos();

    // Ya esta pintado lo que hay en SQL; recien ahora se va a Siesa, para que
    // abrir la seccion no dependa de una API externa.
    autoSincronizarPedidos();
}

function alternarVerTodos() {
    pedidosVerTodos = !pedidosVerTodos;
    pedidosList = null;
    renderPedidos();
}

async function sincronizarPedidos() {
    const btn = document.getElementById('btnSyncPedidos');
    if (btn) { btn.disabled = true; btn.classList.add('spinning'); }
    // Cuenta como sincronización para la automática: entrar a la sección justo
    // después de pulsar el botón no tiene por qué llamar a Siesa otra vez.
    pedidosSyncEn = Date.now();
    pedidosSyncEstado = 'sincronizando';
    pintarEstadoSync();
    try {
        const r = await fetch('/api/pedidos/sincronizar', { method: 'POST' });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'el servidor respondió ' + r.status);

        pedidosSyncEstado = null;
        pedidosList = null;
        await renderPedidos();
        showToast(`${d.recibidos} pedidos de Siesa · ${d.nuevos} nuevos` +
                  (d.cerrados ? ` · ${d.cerrados} ya no pendientes` : ''));
    } catch (err) {
        pedidosSyncEstado = 'error';
        pintarEstadoSync();
        showToast('No se pudo sincronizar: ' + err.message);
        if (btn) { btn.disabled = false; btn.classList.remove('spinning'); }
    }
}

/* ----------------------------------------------------------------------
   SINCRONIZACIÓN AUTOMÁTICA AL ENTRAR
   Antes la tabla mostraba lo que hubiera quedado en SQL, que podía ser de
   ayer, y había que acordarse de pulsar «Sincronizar con Siesa». Ahora entrar
   a la sección la trae sola, con tres frenos:

     1. No bloquea. La tabla se pinta primero con lo que hay en SQL y se
        repinta cuando Siesa contesta: la vista abre igual de rápido aunque la
        API esté lenta o caída.
     2. Espera entre llamadas. Ir y volver de Pedidos no dispara una consulta
        cada vez — la de Siesa trae cientos de filas y hace un MERGE por cada
        una. Pasado el plazo, la siguiente entrada vuelve a sincronizar.
     3. No pisa lo que se está escribiendo. Repintar con el cursor dentro de un
        campo le borraría al asesor la guía a medio teclear, así que en ese
        caso se deja el repintado para la próxima entrada.

   El botón manual sigue siendo la vía para forzarla, y es el único que reporta
   el error con un toast: un fallo de Siesa cada vez que se abre la sección
   sería ruido, y por eso el estado se muestra en el encabezado.
   ---------------------------------------------------------------------- */
const PEDIDOS_SYNC_MS = 5 * 60 * 1000;
let pedidosSyncEn = 0;          // último intento, manual o automático
let pedidosSyncEstado = null;   // null | 'sincronizando' | 'error'

function textoEstadoSync() {
    if (pedidosSyncEstado === 'sincronizando') return ' · sincronizando con Siesa…';
    if (pedidosSyncEstado === 'error') return ' · no se pudo sincronizar con Siesa';
    return '';
}

// Actualiza solo el rótulo del encabezado: repintar el panel entero por un
// cambio de estado tumbaría el foco del buscador.
function pintarEstadoSync() {
    const el = document.getElementById('pedSyncEstado');
    if (!el) return;
    el.textContent = textoEstadoSync();
    el.classList.toggle('err', pedidosSyncEstado === 'error');
}

// El asesor está escribiendo en la tabla si tiene el cursor en un campo suyo.
function editandoPedidos() {
    const el = document.activeElement;
    return !!(el && el.tagName === 'INPUT' && el.closest && el.closest('#pedidosPanel'));
}

async function autoSincronizarPedidos() {
    if (pedidosSyncEstado === 'sincronizando') return;
    if (Date.now() - pedidosSyncEn < PEDIDOS_SYNC_MS) return;

    pedidosSyncEn = Date.now();
    pedidosSyncEstado = 'sincronizando';
    pintarEstadoSync();

    try {
        const r = await fetch('/api/pedidos/sincronizar', { method: 'POST' });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'el servidor respondió ' + r.status);
        pedidosSyncEstado = null;

        // Si ya no está en Pedidos, no hay nada que repintar: la lista se vuelve
        // a pedir cuando entre. Y si está escribiendo, tampoco se toca.
        if (currentView !== 'pedidos' || editandoPedidos()) return pintarEstadoSync();

        pedidosList = null;
        await renderPedidos();
    } catch (err) {
        pedidosSyncEstado = 'error';
        pintarEstadoSync();
        console.warn('sincronización automática de pedidos:', err.message);
    }
}

function partirId(id) {
    // El id es "TIPO-CONSEC" y el tipo puede traer guiones, así que se parte
    // por el ÚLTIMO separador.
    const i = id.lastIndexOf('-');
    return { idTipoDocto: id.slice(0, i), consecDocto: Number(id.slice(i + 1)) };
}

async function actualizarPedido(id, cambio) {
    const r = await fetch('/api/pedidos/actualizar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...partirId(id), ...cambio })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'el servidor respondió ' + r.status);
    return d;
}

// Marca o desmarca una de las etapas. La casilla queda deshabilitada
// mientras el servidor responde y vuelve atrás si falla: dejarla marcada sin
// que se haya guardado es peor que no marcarla, porque el asesor la lee como
// trabajo hecho.
async function marcarEtapa(id, clave, el) {
    const etapa = ETAPAS_PEDIDO.find(e => e.clave === clave);
    const valor = el.checked;
    el.disabled = true;
    try {
        await actualizarPedido(id, { [clave]: valor });
        const p = (pedidosList || []).find(x => x.id === id);
        if (p) {
            p[clave] = valor;
            // El servidor sella la hora al marcar y la borra al desmarcar; se
            // replica aquí para que el tooltip no muestre la fecha anterior
            // hasta el próximo cargue.
            p[clave + 'En'] = valor ? new Date().toISOString() : null;
        }

        // Se toca solo la fila, no la tabla: repintarla entera perdería el
        // scroll y el texto que haya en el buscador.
        const label = el.closest('.ped-check');
        if (label && etapa) {
            label.title = tituloEtapa(etapa, valor, p ? p[clave + 'En'] : null);
            label.classList.add('guardado');
            setTimeout(() => label.classList.remove('guardado'), 1200);
        }

        // Despachar cambia cómo se lee la fila entera: se atenúa y la entrega
        // deja de estar vencida.
        if (clave === 'despachado') {
            const fila = document.querySelector(`tr[data-ped="${CSS.escape(id)}"]`);
            if (fila) {
                fila.classList.toggle('despachado', valor);
                const entrega = fila.querySelector('td.ped-entrega');
                if (entrega && p) entrega.classList.toggle('vencida', entregaVencida(p));
            }
            showToast(valor ? 'Pedido marcado como despachado' : 'Pedido devuelto a pendiente');
        }
    } catch (err) {
        el.checked = !valor;   // revertir: no quedó guardado
        showToast('No se pudo guardar' + (etapa ? ' ' + etapa.titulo.toLowerCase() : '') + ': ' + err.message);
    } finally {
        el.disabled = false;
        // Solo el despacho habilita el aviso, pero repintar el botón es barato
        // y así ninguna etapa nueva se olvida de hacerlo.
        refrescarAviso(id);
    }
}

async function guardarGuia(id, el) {
    const valor = el.value.trim();
    const p = (pedidosList || []).find(x => x.id === id);
    if (p && (p.noGuia || '') === valor) return;   // no cambió nada
    try {
        await actualizarPedido(id, { noGuia: valor || null });
        if (p) p.noGuia = valor || null;
        el.classList.add('guardado');
        setTimeout(() => el.classList.remove('guardado'), 1200);
    } catch (err) {
        if (p) el.value = p.noGuia || '';   // devolver a lo último guardado
        showToast('No se pudo guardar la guía: ' + err.message);
    }
    refrescarAviso(id);
}

/* ----------------------------------------------------------------------
   AVISO DE DESPACHO
   El cliente casi nunca tiene una conversación abierta con el bot, así que
   este mensaje sale por PLANTILLA aprobada de Meta y no por texto libre:
   fuera de la ventana de 24 h el texto libre se acepta y no se entrega.
   ---------------------------------------------------------------------- */
const ICONO_AVION = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12l15.5-7.5-6 15.5-2.6-6.4z"/></svg>`;
const ICONO_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>`;

function botonAviso(p) {
    // Los tres requisitos del mensaje: sin guía no hay qué rastrear, sin celular
    // no hay a quién escribirle, y sin despachar el aviso sería falso.
    const falta = [];
    if (!p.despachado) falta.push('marcarlo despachado');
    if (!p.noGuia) falta.push('el número de guía');
    if (!p.contacto) falta.push('el celular de contacto');

    const enviado = !!p.notificadoEn;
    const titulo = falta.length ? 'Falta ' + falta.join(' y ')
        : enviado ? 'Avisado el ' + formatFullDate(p.notificadoEn) + '. Clic para reenviar.'
        : 'Avisarle al cliente que su pedido va en camino';

    return `<button class="ped-avisar${enviado ? ' enviado' : ''}"${falta.length ? ' disabled' : ''}
                    title="${escapeAttr(titulo)}"
                    onclick="notificarPedido('${escapeAttr(p.id)}', this)">
                ${enviado ? ICONO_CHECK : ICONO_AVION}${enviado ? 'Avisado' : 'Avisar'}
            </button>`;
}

// Repinta solo los botones de una fila. Guía, contacto y etapas deciden si el
// aviso y la encuesta pueden salir, así que cualquiera de ellos los cambia.
function refrescarAviso(id) {
    const p = (pedidosList || []).find(x => x.id === id);
    if (!p) return;
    const fila = document.querySelector(`tr[data-ped="${CSS.escape(id)}"]`);
    if (!fila) return;
    const aviso = fila.querySelector('.ped-aviso-celda');
    if (aviso) aviso.innerHTML = botonAviso(p);
    const encuesta = fila.querySelector('.ped-encuesta-celda');
    if (encuesta) encuesta.innerHTML = botonEncuesta(p);
}

async function guardarContacto(id, el) {
    const valor = el.value.trim();
    const p = (pedidosList || []).find(x => x.id === id);
    if (p && (p.contacto || '') === valor) return;   // no cambió nada
    try {
        const d = await actualizarPedido(id, { contacto: valor || null });
        if (p) {
            p.contacto = d.contacto || null;
            // El servidor borra el sello al cambiar de destinatario: quien
            // recibió el aviso anterior no es este. Igual con la encuesta.
            p.notificadoEn = null;
            p.encuestaEnviadaEn = null;
        }
        el.value = (p && p.contacto) || '';
        el.classList.remove('error');
        el.classList.add('guardado');
        setTimeout(() => el.classList.remove('guardado'), 1200);
    } catch (err) {
        el.classList.add('error');
        showToast('No se pudo guardar el contacto: ' + err.message);
    }
    refrescarAviso(id);
}

async function notificarPedido(id, btn) {
    const p = (pedidosList || []).find(x => x.id === id);
    if (!p) return;

    // Reenviar se pregunta siempre: cada plantilla le cuesta a KOS y al cliente
    // le llegaría dos veces el mismo aviso.
    if (p.notificadoEn && !confirm(
        'A este pedido ya se le avisó el ' + formatFullDate(p.notificadoEn) + '.\n\n' +
        '¿Enviar el aviso otra vez a +' + p.contacto + '?')) return;

    btn.disabled = true;
    btn.textContent = 'Enviando…';
    try {
        const r = await fetch('/api/pedidos/notificar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...partirId(id), reenviar: !!p.notificadoEn })
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'el servidor respondió ' + r.status);

        p.notificadoEn = d.notificadoEn || new Date().toISOString();
        showToast('Aviso enviado a +' + p.contacto);
    } catch (err) {
        showToast('No se pudo avisar: ' + err.message);
    }
    refrescarAviso(id);
}

/* ----------------------------------------------------------------------
   ENCUESTA DE SATISFACCIÓN
   Se habilita cuando el asesor marca «Entregado» y hay celular de contacto.
   El botón no manda nada por su cuenta: le pide al servidor que dispare el
   flujo de n8n, que envía la plantilla encuesta_satisfaccion_koski.
   ---------------------------------------------------------------------- */
function botonEncuesta(p) {
    const falta = [];
    if (!p.recibido) falta.push('marcarlo entregado');
    if (!p.contacto) falta.push('el celular de contacto');

    const enviada = !!p.encuestaEnviadaEn;
    const titulo = falta.length ? 'Falta ' + falta.join(' y ')
        : enviada ? 'Encuesta enviada el ' + formatFullDate(p.encuestaEnviadaEn) + '. Clic para reenviar.'
        : 'Enviarle la encuesta de satisfacción a +' + p.contacto;

    return `<button class="ped-avisar${enviada ? ' enviado' : ''}"${falta.length ? ' disabled' : ''}
                    title="${escapeAttr(titulo)}"
                    onclick="enviarEncuesta('${escapeAttr(p.id)}', this)">
                ${enviada ? ICONO_CHECK : ICONO_AVION}${enviada ? 'Enviada' : 'Avisar'}
            </button>`;
}

async function enviarEncuesta(id, btn) {
    const p = (pedidosList || []).find(x => x.id === id);
    if (!p) return;

    // Igual que el aviso: reenviar cuesta otra plantilla y el cliente la
    // recibiría dos veces.
    if (p.encuestaEnviadaEn && !confirm(
        'A este pedido ya se le envió la encuesta el ' + formatFullDate(p.encuestaEnviadaEn) + '.\n\n' +
        '¿Enviarla otra vez a +' + p.contacto + '?')) return;

    btn.disabled = true;
    btn.textContent = 'Enviando…';
    try {
        const r = await fetch('/api/pedidos/encuesta', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...partirId(id), reenviar: !!p.encuestaEnviadaEn })
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'el servidor respondió ' + r.status);

        p.encuestaEnviadaEn = d.encuestaEnviadaEn || new Date().toISOString();
        showToast('Encuesta enviada a +' + p.contacto);
    } catch (err) {
        showToast('No se pudo enviar la encuesta: ' + err.message);
    }
    refrescarAviso(id);
}

/* ======================================================================
   TRANSPORTADORAS
   Directorio que llena el asesor: nombre y pagina de rastreo. Detras no hay
   ninguna API — a diferencia de los pedidos, aqui todo se crea, se edita y
   se borra a mano. Vive en SQL Server, al lado de kx.pedidos.
   ====================================================================== */
let transList = null;
let transQuery = '';
// Filas de alta todavia sin guardar. Viven solo en memoria y se identifican
// con `tmp`, un correlativo del navegador que no choca con los id de SQL.
let transNuevas = [];
let transSeq = 0;

// Guia de mentira para el boton de abrir: sirve para comprobar que la URL
// lleva a alguna parte, no para rastrear nada.
const GUIA_EJEMPLO = '123456789';

const ICONO_ABRIR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
    stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.5h5.5V10"/><path d="M19.5 4.5 11 13"/>
    <path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg>`;
const ICONO_BORRAR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
    stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"/>
    <path d="M9.5 6.5V4.9A1.4 1.4 0 0 1 10.9 3.5h2.2a1.4 1.4 0 0 1 1.4 1.4v1.6"/>
    <path d="M6.6 6.5 7.5 19a1.6 1.6 0 0 0 1.6 1.5h5.8a1.6 1.6 0 0 0 1.6-1.5l.9-12.5"/></svg>`;
const ICONO_EQUIS = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
    stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>`;

function transFiltradas() {
    const q = transQuery.trim().toLowerCase();
    if (!q) return transList || [];
    return (transList || []).filter(t =>
        [t.nombre, t.urlRastreo].some(v => v && String(v).toLowerCase().includes(q)));
}

// Mismo convenio que TCC_RASTREO_URL en el servidor: si la URL trae {guia} se
